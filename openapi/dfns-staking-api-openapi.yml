openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Staking API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Staking
paths:
  /staking/stakes:
    post:
      operationId: createStake
      summary: Create Stake
      tags:
      - Staking
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Create a new stake.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Stakes:Create`: Always required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - oneOf:
                - type: object
                  properties:
                    protocol:
                      type: string
                      enum:
                      - Ethereum
                    walletId:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                      description: Id of the Dfns wallet making the deposit.
                      example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                    provider:
                      type: string
                      enum:
                      - Figment
                      description: Staking Provider
                    amount:
                      type: string
                      pattern: ^\d+$
                      description: Transaction amount denominated in min units
                  required:
                  - protocol
                  - walletId
                  - provider
                  - amount
                  title: Ethereum
                - type: object
                  properties:
                    protocol:
                      type: string
                      enum:
                      - Iota
                    walletId:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                      description: Id of the Dfns wallet making the deposit.
                      example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                    validator:
                      type: string
                      pattern: ^0x[0-9a-fA-F]{64}$
                    amount:
                      type: string
                      pattern: ^\d+$
                      description: Transaction amount denominated in min units
                    lockedIotas:
                      type: array
                      items:
                        type: string
                        pattern: ^0x[0-9a-fA-F]{64}$
                      minItems: 1
                  required:
                  - protocol
                  - walletId
                  - validator
                  - amount
                  title: Iota
                - type: object
                  properties:
                    protocol:
                      type: string
                      enum:
                      - Xdc
                    walletId:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                      description: Id of the Dfns wallet making the deposit.
                      example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                    candidate:
                      type: string
                      description: Coinbase address of the XDC masternode to register
                    amount:
                      type: string
                      pattern: ^\d+$
                      description: Transaction amount denominated in wei (min 10,000,000 XDC)
                  required:
                  - protocol
                  - walletId
                  - candidate
                  - amount
                  title: Xdc
              - type: object
                properties:
                  externalId:
                    type: string
            examples:
              Ethereum:
                value:
                  externalId: ext-123
                  walletId: wa-4g991-s29to-9hrq4nbuto6ih33b
                  protocol: Ethereum
                  provider: Figment
                  amount: '32000000000000000000'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Stake'
                - type: object
                  properties:
                    actions:
                      type: array
                      items:
                        $ref: '#/components/schemas/StakeAction'
                  required:
                  - actions
    get:
      operationId: listStakes
      summary: List Stakes
      tags:
      - Staking
      security:
      - authenticationToken: []
      description: Retrieve the list of stakes.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Stakes:Read`: Always required."
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Stake'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /staking/stakes/{stakeId}/actions:
    post:
      operationId: createStakeAction
      summary: Create Stake Action
      tags:
      - Staking
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Create a new action for an existing stake.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Stakes:Update`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^stk-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
        required: true
        name: stakeId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - anyOf:
                - oneOf:
                  - type: object
                    properties:
                      protocol:
                        type: string
                        enum:
                        - Iota
                      kind:
                        type: string
                        enum:
                        - Withdraw
                      amount:
                        type: string
                        pattern: ^\d+$
                    required:
                    - protocol
                    - kind
                    - amount
                    title: IOTA Withdrawal
                  - type: object
                    properties:
                      protocol:
                        type: string
                        enum:
                        - Iota
                      kind:
                        type: string
                        enum:
                        - Deposit
                      amount:
                        type: string
                        pattern: ^\d+$
                      lockedIotas:
                        type: array
                        items:
                          type: string
                          pattern: ^0x[0-9a-fA-F]{64}$
                    required:
                    - protocol
                    - kind
                    - amount
                    title: IOTA Deposit
                - type: object
                  properties:
                    protocol:
                      type: string
                      enum:
                      - Ethereum
                    kind:
                      type: string
                      enum:
                      - Withdraw
                  required:
                  - protocol
                  - kind
                  title: Ethereum Withdrawal
                - oneOf:
                  - type: object
                    properties:
                      protocol:
                        type: string
                        enum:
                        - Xdc
                      kind:
                        type: string
                        enum:
                        - Withdraw
                    required:
                    - protocol
                    - kind
                    title: XDC Withdrawal
                  - type: object
                    properties:
                      protocol:
                        type: string
                        enum:
                        - Xdc
                      kind:
                        type: string
                        enum:
                        - Unbond
                    required:
                    - protocol
                    - kind
                    title: XDC Unbond
              - type: object
                properties:
                  externalId:
                    type: string
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Stake'
                - type: object
                  properties:
                    actions:
                      type: array
                      items:
                        $ref: '#/components/schemas/StakeAction'
                  required:
                  - actions
    get:
      operationId: listStakeActions
      summary: List Stake Actions
      tags:
      - Staking
      security:
      - authenticationToken: []
      description: Retrieve the list of actions for a specific stake.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Stakes:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^stk-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
        required: true
        name: stakeId
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/StakeAction'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /staking/stakes/{stakeId}:
    get:
      operationId: getStakes
      summary: Get Stakes
      tags:
      - Staking
      security:
      - authenticationToken: []
      description: Retrieve the details of a specific stake.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Stakes:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^stk-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
        required: true
        name: stakeId
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Stake'
                - type: object
                  properties:
                    actions:
                      type: array
                      items:
                        $ref: '#/components/schemas/StakeAction'
                  required:
                  - actions
  /staking/stakes/{stakeId}/rewards:
    get:
      operationId: getStakeRewards
      summary: Get Stake Rewards
      tags:
      - Staking
      security:
      - authenticationToken: []
      description: Retrieves the rewards linked to a specific stake.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Stakes:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^stk-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
        required: true
        name: stakeId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  symbol:
                    type: string
                  balance:
                    type: string
                required:
                - symbol
                - balance
components:
  schemas:
    StakeAction:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^stka-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          example: stka-567ui-9g9b7-ftgvpstk8qfa71b4
        stakeId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^stk-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          example: stk-0pmu3-tog2k-fdtn0teii2i4r13f
        status:
          type: string
          enum:
          - PendingPolicyApproval
          - InProgress
          - Completed
          - Failed
          - Rejected
          description: 'Status of the stake action.


            | Status | Definition |

            | --- | --- |

            | `PendingPolicyApproval` | The action is pending approval due to a policy applied to the wallet. |

            | `InProgress` | The action has been initiated and is being processed. |

            | `Completed` | The action has been successfully completed. |

            | `Failed` | The action has failed. Check failureReason for details. |

            | `Rejected` | The action has been rejected by a policy approval action. |'
        transactionId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^tx-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Deprecated.
          example: tx-583hu-sp2p7-slvb9nqpa3hd8bus
        signatureId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^sig-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Deprecated.
          example: sig-4sfvl-f4iha-umighfi3hk4t54dr
        transactionHash:
          type: string
          description: Deprecated.
        kind:
          type: string
          enum:
          - Stake
          - Unbond
          - Deposit
          - Withdraw
          description: 'The type of staking action being performed.


            | Kind | Definition |

            | --- | --- |

            | `Stake` | Delegate funds to a validator to begin earning rewards. |

            | `Unbond` | Initiate the unbonding process to release staked funds (subject to cooldown). |

            | `Deposit` | Add additional funds to an existing stake position. |

            | `Withdraw` | Withdraw unbonded funds from the stake position. |'
        requester:
          $ref: '#/components/schemas/Requester'
        requestBody:
          anyOf:
          - allOf:
            - oneOf:
              - type: object
                properties:
                  protocol:
                    type: string
                    enum:
                    - Babylon
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the Dfns wallet making the deposit.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  provider:
                    type: string
                    enum:
                    - Figment
                    description: Staking Provider
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: Transaction amount denominated in min units
                  duration:
                    type: number
                required:
                - protocol
                - walletId
                - provider
                - amount
                - duration
                title: Babylon
              - type: object
                properties:
                  protocol:
                    type: string
                    enum:
                    - Ethereum
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the Dfns wallet making the deposit.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  provider:
                    type: string
                    enum:
                    - Figment
                    description: Staking Provider
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: Transaction amount denominated in min units
                required:
                - protocol
                - walletId
                - provider
                - amount
                title: Ethereum
              - type: object
                properties:
                  protocol:
                    type: string
                    enum:
                    - Iota
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the Dfns wallet making the deposit.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  validator:
                    type: string
                    pattern: ^0x[0-9a-fA-F]{64}$
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: Transaction amount denominated in min units
                  lockedIotas:
                    type: array
                    items:
                      type: string
                      pattern: ^0x[0-9a-fA-F]{64}$
                    minItems: 1
                required:
                - protocol
                - walletId
                - validator
                - amount
                title: Iota
              - type: object
                properties:
                  protocol:
                    type: string
                    enum:
                    - Xdc
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the Dfns wallet making the deposit.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  candidate:
                    type: string
                    description: Coinbase address of the XDC masternode to register
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: Transaction amount denominated in wei (min 10,000,000 XDC)
                required:
                - protocol
                - walletId
                - candidate
                - amount
                title: Xdc
            - type: object
              properties:
                externalId:
                  type: string
          - allOf:
            - anyOf:
              - oneOf:
                - type: object
                  properties:
                    protocol:
                      type: string
                      enum:
                      - Iota
                    kind:
                      type: string
                      enum:
                      - Withdraw
                    amount:
                      type: string
                      pattern: ^\d+$
                  required:
                  - protocol
                  - kind
                  - amount
                  title: IOTA Withdrawal
                - type: object
                  properties:
                    protocol:
                      type: string
                      enum:
                      - Iota
                    kind:
                      type: string
                      enum:
                      - Deposit
                    amount:
                      type: string
                      pattern: ^\d+$
                    lockedIotas:
                      type: array
                      items:
                        type: string
                        pattern: ^0x[0-9a-fA-F]{64}$
                  required:
                  - protocol
                  - kind
                  - amount
                  title: IOTA Deposit
              - type: object
                properties:
                  protocol:
                    type: string
                    enum:
                    - Ethereum
                  kind:
                    type: string
                    enum:
                    - Withdraw
                required:
                - protocol
                - kind
                title: Ethereum Withdrawal
              - oneOf:
                - type: object
                  properties:
                    protocol:
                      type: string
                      enum:
                      - Xdc
                    kind:
                      type: string
                      enum:
                      - Withdraw
                  required:
                  - protocol
                  - kind
                  title: XDC Withdrawal
                - type: object
                  properties:
                    protocol:
                      type: string
                      enum:
                      - Xdc
                    kind:
                      type: string
                      enum:
                      - Unbond
                  required:
                  - protocol
                  - kind
                  title: XDC Unbond
            - type: object
              properties:
                externalId:
                  type: string
        failureReason:
          type: string
          description: The failure reason, if any. Only present when status is Failed.
        dateCreated:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). When the stake action was created.'
          example: 2023-04-14 20:41:28.715000+00:00
      required:
      - id
      - stakeId
      - status
      - kind
      - requester
      - requestBody
      - dateCreated
    Stake:
      oneOf:
      - type: object
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^stk-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
            example: stk-0pmu3-tog2k-fdtn0teii2i4r13f
          provider:
            type: string
            enum:
            - Figment
            description: The staking infrastructure provider used to manage the stake.
          walletId:
            type: string
            minLength: 1
            maxLength: 64
            pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
            description: Wallet id.
            example: wa-5pfuu-9euek-h0odgb6snva8ph3k
          status:
            type: string
            enum:
            - Active
            - Failed
            - Staking
            - Unbonding
            - Unbond
            - Withdrawing
            - Withdrawn
            description: 'Status of the stake position.


              | Status | Definition |

              | --- | --- |

              | `Staking` | The stake is being created and funds are being delegated to the validator. |

              | `Active` | The stake is active and earning rewards. |

              | `Unbonding` | The stake is in the process of being unbonded (cooldown period). |

              | `Unbond` | The stake has been unbonded and is ready for withdrawal. |

              | `Withdrawing` | The staked funds are in the process of being withdrawn. |

              | `Withdrawn` | The staked funds have been fully withdrawn. |

              | `Failed` | The staking operation failed. |'
          requester:
            $ref: '#/components/schemas/Requester'
          requestBody:
            allOf:
            - oneOf:
              - type: object
                properties:
                  protocol:
                    type: string
                    enum:
                    - Babylon
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the Dfns wallet making the deposit.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  provider:
                    type: string
                    enum:
                    - Figment
                    description: Staking Provider
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: Transaction amount denominated in min units
                  duration:
                    type: number
                required:
                - protocol
                - walletId
                - provider
                - amount
                - duration
                title: Babylon
              - type: object
                properties:
                  protocol:
                    type: string
                    enum:
                    - Ethereum
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the Dfns wallet making the deposit.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  provider:
                    type: string
                    enum:
                    - Figment
                    description: Staking Provider
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: Transaction amount denominated in min units
                required:
                - protocol
                - walletId
                - provider
                - amount
                title: Ethereum
              - type: object
                properties:
                  protocol:
                    type: string
                    enum:
                    - Iota
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the Dfns wallet making the deposit.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  validator:
                    type: string
                    pattern: ^0x[0-9a-fA-F]{64}$
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: Transaction amount denominated in min units
                  lockedIotas:
                    type: array
                    items:
                      type: string
                      pattern: ^0x[0-9a-fA-F]{64}$
                    minItems: 1
                required:
                - protocol
                - walletId
                - validator
                - amount
                title: Iota
              - type: object
                properties:
                  protocol:
                    type: string
                    enum:
                    - Xdc
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the Dfns wallet making the deposit.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  candidate:
                    type: string
                    description: Coinbase address of the XDC masternode to register
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: Transaction amount denominated in wei (min 10,000,000 XDC)
                required:
                - protocol
                - walletId
                - candidate
                - amount
