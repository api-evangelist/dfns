  /allocations/cancel-0fns-order-placement:
    post:
      operationId: cancel0fnsOrderPlacement
      summary: Cancel an unfilled 0fns order placement
      tags:
      - Allocations
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Craft and broadcast an on-chain cancelOrder to cancel a 0fns OrderBook order placement that was not filled, reclaiming its escrow. The escrowed input token is returned to the wallet that funded the order.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Allocations:Update`: Always required   \n`Wallets:Transactions:Create`: Always required. The cancellation (cancelOrder) is broadcast from your wallet.   \n`FeeSponsors:Use`: Required if `feeSponsorId` is specified and the sponsoree wallet belongs to an `EndUser` user kind."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allocationActionId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^allctn-a-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                  description: The 0fns allocation action whose unfilled OrderBook order placement should be cancelled.
                  example: allctn-a-04p5n-gkkgd-5qk71nuev5n2ug1t
                externalId:
                  type: string
                  description: An optional external identifier provided by the client to ensure idempotency and prevent duplicate operations.
                feeSponsorId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^fs-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                  description: Id of the fee sponsor that will pay the network fees for this allocation. When set, allocation transactions are broadcast as sponsored user operations.
                  example: fs-5vqdl-gliqk-b4rfukqauov1sp7j
              required:
              - allocationActionId
              description: Cancel an unfilled 0fns OrderBook order placement and reclaim its escrow to the funding wallet.
              title: 0fns Order Placement Cancellation Request
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactionId:
                    type: string
                    description: Id of the broadcast on-chain cancelOrder transaction.
                required:
                - transactionId
                description: The broadcast 0fns order-placement cancellation transaction.
