openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Allocations API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Allocations
paths:
  /allocations/get-0fns-quote:
    post:
      operationId: createAllocationQuote
      summary: Request 0fns Allocation Quote
      tags:
      - Allocations
      security:
      - authenticationToken: []
      description: Get a price quote for a 0fns deposit or withdrawal at the current market rate.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\nNo permission required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                walletId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                  description: Wallet id.
                  example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                protocol:
                  type: string
                  enum:
                  - 0fns
                kind:
                  type: string
                  enum:
                  - Deposit
                  - Withdraw
                  description: 'The type of action being performed on the allocation investment: Deposit to add funds or Withdraw to remove funds.'
                sourceAsset:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                      - Erc20
                    contract:
                      type: string
                      pattern: ^0x[0-9a-fA-F]{40}$
                    amount:
                      type: string
                      pattern: ^\d+$
                  required:
                  - kind
                  - contract
                  - amount
                  title: EVM Fungible Token (ERC-20)
                targetAsset:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                      - Erc20
                    contract:
                      type: string
                      pattern: ^0x[0-9a-fA-F]{40}$
                  required:
                  - kind
                  - contract
              required:
              - walletId
              - protocol
              - kind
              - sourceAsset
              - targetAsset
              description: 'Request a 0fns conversion price quote (deposit: stablecoin→0fns; withdraw: 0fns→stablecoin).'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Wallet id.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  protocol:
                    type: string
                    enum:
                    - 0fns
                    - SkySusds
                    - GauntletUsdcPrime
                    - SteakhouseUsdt
                    - GauntletUsdcPrimeBase
                    - SteakhouseUsdcBase
                    - SentoraPyusdMain
                    description: The DeFi protocol used for allocation generation. See [Create Allocation](https://docs.dfns.co/api-reference/allocations/create-allocation) for each protocol's provider, deposit asset, and network.
                  kind:
                    type: string
                    enum:
                    - Deposit
                    - Withdraw
                    description: 'The type of action being performed on the allocation investment: Deposit to add funds or Withdraw to remove funds.'
                  sourceAsset:
                    allOf:
                    - oneOf:
                      - type: object
                        properties:
                          kind:
                            type: string
                            enum:
                            - Native
                          amount:
                            type: string
                            pattern: ^\d+$
                        required:
                        - kind
                        - amount
                        title: Native Asset
                      - type: object
                        properties:
                          kind:
                            type: string
                            enum:
                            - Erc20
                          contract:
                            type: string
                            pattern: ^0x[0-9a-fA-F]{40}$
                          amount:
                            type: string
                            pattern: ^\d+$
                        required:
                        - kind
                        - contract
                        - amount
                        title: EVM Fungible Token (ERC-20)
                      - type: object
                        properties:
                          kind:
                            type: string
                            enum:
                            - Spl
                          mint:
                            type: string
                            pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
                          amount:
                            type: string
                            pattern: ^\d+$
                        required:
                        - kind
                        - mint
                        - amount
                        title: Solana Fungible Token (SPL)
                      - type: object
                        properties:
                          kind:
                            type: string
                            enum:
                            - Sep41
                          issuer:
                            type: string
                            pattern: ^(G[A-Z0-9]{55}|M[A-Z0-9]{68})$
                          assetCode:
                            type: string
                          amount:
                            type: string
                            pattern: ^\d+$
                        required:
                        - kind
                        - issuer
                        - assetCode
                        - amount
                        title: Stellar Fungible Token (SEP-41)
                    - type: object
                      properties:
                        metadata:
                          type: object
                          properties:
                            network:
                              $ref: '#/components/schemas/Network'
                            name:
                              type: string
                            symbol:
                              type: string
                            decimals:
                              type: number
                            tid:
                              type: string
                          required:
                          - network
                          - decimals
                      required:
                      - metadata
                  targetAsset:
                    allOf:
                    - oneOf:
                      - type: object
                        properties:
                          kind:
                            type: string
                            enum:
                            - Native
                          amount:
                            type: string
                            pattern: ^\d+$
                        required:
                        - kind
                        - amount
                        title: Native Asset
                      - type: object
                        properties:
                          kind:
                            type: string
                            enum:
                            - Erc20
                          contract:
                            type: string
                            pattern: ^0x[0-9a-fA-F]{40}$
                          amount:
                            type: string
                            pattern: ^\d+$
                        required:
                        - kind
                        - contract
                        - amount
                        title: EVM Fungible Token (ERC-20)
                      - type: object
                        properties:
                          kind:
                            type: string
                            enum:
                            - Spl
                          mint:
                            type: string
                            pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
                          amount:
                            type: string
                            pattern: ^\d+$
                        required:
                        - kind
                        - mint
                        - amount
                        title: Solana Fungible Token (SPL)
                      - type: object
                        properties:
                          kind:
                            type: string
                            enum:
                            - Sep41
                          issuer:
                            type: string
                            pattern: ^(G[A-Z0-9]{55}|M[A-Z0-9]{68})$
                          assetCode:
                            type: string
                          amount:
                            type: string
                            pattern: ^\d+$
                        required:
                        - kind
                        - issuer
                        - assetCode
                        - amount
                        title: Stellar Fungible Token (SEP-41)
                    - type: object
                      properties:
                        metadata:
                          type: object
                          properties:
                            network:
                              $ref: '#/components/schemas/Network'
                            name:
                              type: string
                            symbol:
                              type: string
                            decimals:
                              type: number
                            tid:
                              type: string
                          required:
                          - network
                          - decimals
                      required:
                      - metadata
                    description: Expected output at current market price.
                  estFillTime:
                    type: integer
                    description: Estimated fill time in seconds.
                  dateCreated:
                    type: string
                    format: date-time
                    description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). When the quote was created.'
                    example: 2023-04-14 20:41:28.715000+00:00
                required:
                - walletId
                - protocol
                - kind
                - sourceAsset
                - targetAsset
                - estFillTime
                - dateCreated
                description: A 0fns conversion price quote.
  /allocations:
    post:
      operationId: createAllocation
      summary: Create Allocation
      tags:
      - Allocations
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Create a new allocation.


        An allocation deposits assets from one of your wallets into a rewards-earning protocol. Two providers are available:


        | Provider | Description | Supported chains |

        |-----------|---------------------------------------------------------------------------------------------------------------------------------|------------------------------------|

        | M0 | Offers the `0fns` protocol, an extension to the M0 USD-based stablecoin $M. Trade USDC on Ethereum into 0fns to earn rewards. | Ethereum Mainnet, Ethereum Sepolia |

        | Yield.xyz | Offers a set of DeFi vault strategies, each with its own APY. Deposit the vault''s underlying token; withdraw it at any time. | Ethereum Mainnet, Base |


        The `protocol` field selects the strategy:


        | `protocol` | Provider | Strategy | Deposit asset | Network |

        |---------------------------|-----------|-----------------------------------|---------------|----------|

        | `0fns` | M0 | 0fns | USDC | Ethereum |

        | `SkySusds` | Yield.xyz | Sky Savings Rate (sUSDS) | USDS | Ethereum |

        | `GauntletUsdcPrime` | Yield.xyz | Gauntlet USDC Prime (gtUSDC) | USDC | Ethereum |

        | `SteakhouseUsdt` | Yield.xyz | Steakhouse USDT (steakUSDT) | USDT | Ethereum |

        | `GauntletUsdcPrimeBase` | Yield.xyz | Gauntlet USDC Prime (gtUSDCp) | USDC | Base |

        | `SteakhouseUsdcBase` | Yield.xyz | Steakhouse USDC (steakUSDC) | USDC | Base |

        | `SentoraPyusdMain` | Yield.xyz | Sentora PYUSD Main (senPYUSDMain) | PYUSD | Ethereum |


        Yield.xyz vaults are available on mainnet networks only.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Allocations:Create`: Always required   \n`Wallets:Transactions:Create`: Always required. Allocation transactions are broadcast from your wallet.   \n`FeeSponsors:Use`: Required if `feeSponsorId` is specified and the sponsoree wallet belongs to an `EndUser` user kind."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Wallet id.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  protocol:
                    type: string
                    enum:
                    - 0fns
                    description: Ofns protocol
                  externalId:
                    type: string
                    description: An optional external identifier provided by the client to ensure idempotency and prevent duplicate operations.
                  provider:
                    type: string
                    enum:
                    - M0
                    - Yield.xyz
                    description: The provider handling this allocation. `M0` offers the 0fns protocol; `Yield.xyz` offers vault strategies on Ethereum and Base.
                  sourceAsset:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - Erc20
                      contract:
                        type: string
                        pattern: ^0x[0-9a-fA-F]{40}$
                      amount:
                        type: string
                        pattern: ^\d+$
                    required:
                    - kind
                    - contract
                    - amount
                    description: Source asset and amount to spend (the stablecoin for a deposit).
                    title: EVM Fungible Token (ERC-20)
                  targetAsset:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - Erc20
                      contract:
                        type: string
                        pattern: ^0x[0-9a-fA-F]{40}$
                      amount:
                        type: string
                        pattern: ^\d+$
                    required:
                    - kind
                    - contract
                    - amount
                    description: Target asset (0fns) and the minimum amount you will accept.
                    title: EVM Fungible Token (ERC-20)
                  feeSponsorId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^fs-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the fee sponsor that will pay the network fees for this allocation. When set, allocation transactions are broadcast as sponsored user operations.
                    example: fs-5vqdl-gliqk-b4rfukqauov1sp7j
                required:
                - walletId
                - protocol
                - sourceAsset
                - targetAsset
                description: Request body for creating a 0fns allocation from a previously obtained quote.
                title: 0fns Allocation Request
              - type: object
                properties:
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Wallet id.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  protocol:
                    type: string
                    enum:
                    - SkySusds
                  externalId:
                    type: string
                    description: An optional external identifier provided by the client to ensure idempotency and prevent duplicate operations.
                  provider:
                    type: string
                    enum:
                    - M0
                    - Yield.xyz
                    description: The provider handling this allocation. `M0` offers the 0fns protocol; `Yield.xyz` offers vault strategies on Ethereum and Base.
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: USDS amount in smallest unit, e.g. "1000000000000000000" = 1 USDS
                  feeSponsorId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^fs-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the fee sponsor that will pay the network fees for this allocation. When set, allocation transactions are broadcast as sponsored user operations.
                    example: fs-5vqdl-gliqk-b4rfukqauov1sp7j
                required:
                - walletId
                - protocol
                - amount
                description: Request body for creating an allocation of USDS into the Sky Savings Rate (sUSDS) vault on Ethereum, provided by Yield.xyz.
                title: Sky sUSDS Allocation Request
              - type: object
                properties:
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Wallet id.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  protocol:
                    type: string
                    enum:
                    - GauntletUsdcPrime
                  externalId:
                    type: string
                    description: An optional external identifier provided by the client to ensure idempotency and prevent duplicate operations.
                  provider:
                    type: string
                    enum:
                    - M0
                    - Yield.xyz
                    description: The provider handling this allocation. `M0` offers the 0fns protocol; `Yield.xyz` offers vault strategies on Ethereum and Base.
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: USDC amount in smallest unit, e.g. "1000000" = 1 USDC
                  feeSponsorId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^fs-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the fee sponsor that will pay the network fees for this allocation. When set, allocation transactions are broadcast as sponsored user operations.
                    example: fs-5vqdl-gliqk-b4rfukqauov1sp7j
                required:
                - walletId
                - protocol
                - amount
                description: Request body for creating an allocation of USDC into the Gauntlet USDC Prime (gtUSDC) vault on Ethereum, provided by Yield.xyz.
                title: Gauntlet gtUSDC Allocation Request
              - type: object
                properties:
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Wallet id.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  protocol:
                    type: string
                    enum:
                    - SteakhouseUsdt
                  externalId:
                    type: string
                    description: An optional external identifier provided by the client to ensure idempotency and prevent duplicate operations.
                  provider:
                    type: string
                    enum:
                    - M0
                    - Yield.xyz
                    description: The provider handling this allocation. `M0` offers the 0fns protocol; `Yield.xyz` offers vault strategies on Ethereum and Base.
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: USDT amount in smallest unit, e.g. "1000000" = 1 USDT
                  feeSponsorId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^fs-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the fee sponsor that will pay the network fees for this allocation. When set, allocation transactions are broadcast as sponsored user operations.
                    example: fs-5vqdl-gliqk-b4rfukqauov1sp7j
                required:
                - walletId
                - protocol
                - amount
                description: Request body for creating an allocation of USDT into the Steakhouse USDT (steakUSDT) vault on Ethereum, provided by Yield.xyz.
                title: Steakhouse USDT Allocation Request
              - type: object
                properties:
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Wallet id.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  protocol:
                    type: string
                    enum:
                    - GauntletUsdcPrimeBase
                  externalId:
                    type: string
                    description: An optional external identifier provided by the client to ensure idempotency and prevent duplicate operations.
                  provider:
                    type: string
                    enum:
                    - M0
                    - Yield.xyz
                    description: The provider handling this allocation. `M0` offers the 0fns protocol; `Yield.xyz` offers vault strategies on Ethereum and Base.
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: USDC amount in smallest unit, e.g. "1000000" = 1 USDC
                  feeSponsorId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^fs-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the fee sponsor that will pay the network fees for this allocation. When set, allocation transactions are broadcast as sponsored user operations.
                    example: fs-5vqdl-gliqk-b4rfukqauov1sp7j
                required:
                - walletId
                - protocol
                - amount
                description: Request body for creating an allocation of USDC into the Gauntlet USDC Prime (gtUSDCp) vault on Base, provided by Yield.xyz.
                title: Gauntlet USDC Prime (Base) Allocation Request
              - type: object
                properties:
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Wallet id.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  protocol:
                    type: string
                    enum:
                    - SteakhouseUsdcBase
                  externalId:
                    type: string
                    description: An optional external identifier provided by the client to ensure idempotency and prevent duplicate operations.
                  provider:
                    type: string
                    enum:
                    - M0
                    - Yield.xyz
                    description: The provider handling this allocation. `M0` offers the 0fns protocol; `Yield.xyz` offers vault strategies on Ethereum and Base.
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: USDC amount in smallest unit, e.g. "1000000" = 1 USDC
                  feeSponsorId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^fs-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the fee sponsor that will pay the network fees for this allocation. When set, allocation transactions are broadcast as sponsored user operations.
                    example: fs-5vqdl-gliqk-b4rfukqauov1sp7j
                required:
                - walletId
                - protocol
                - amount
                description: Request body for creating an allocation of USDC into the Steakhouse USDC (steakUSDC) vault on Base, provided by Yield.xyz.
                title: Steakhouse USDC (Base) Allocation Request
              - type: object
                properties:
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Wallet id.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  protocol:
                    type: string
                    enum:
                    - SentoraPyusdMain
                  externalId:
                    type: string
                    description: An optional external identifier provided by the client to ensure idempotency and prevent duplicate operations.
                  provider:
                    type: string
                    enum:
                    - M0
                    - Yield.xyz
                    description: The provider handling this allocation. `M0` offers the 0fns protocol; `Yield.xyz` offers vault strategies on Ethereum and Base.
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: PYUSD amount in smallest unit, e.g. "1000000" = 1 PYUSD
                  feeSponsorId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^fs-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the fee sponsor that will pay the network fees for this allocation. When set, allocation transactions are broadcast as sponsored user operations.
                    example: fs-5vqdl-gliqk-b4rfukqauov1sp7j
                required:
                - walletId
                - protocol
                - amount
                description: Request body for creating an allocation of PYUSD into the Sentora PYUSD Main (senPYUSDMain) vault on Ethereum, provided by Yield.xyz.
                title: Sentora PYUSD Main Allocation Request
              description: Request body for creating an allocation investment.
            examples:
              Ofns:
                value:
                  externalId: ext-123
                  walletId: wa-4g991-s29to-9hrq4nbuto6ih33b
                  protocol: 0fns
                  sourceAsset:
                    kind: Erc20
                    contract: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
                    amount: '1000000'
                  targetAsset:
                    kind: Erc20
                    contract: '0x64df20A1814a6DD0F3d6f0A14073c47214c53f58'
                    amount: '990000'
              GauntletUsdcPrime:
                value:
                  externalId: ext-456
                  walletId: wa-4g991-s29to-9hrq4nbuto6ih33b
                  protocol: GauntletUsdcPrime
                  provider: Yield.xyz
                  amount: '1000000000'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Allocation'
                - type: object
                  properties:
                    actions:
                      type: array
                      items:
                        $ref: '#/components/schemas/AllocationAction'
                  required:
                  - actions
                description: A allocation investment representing funds deposited to earn interest from a DeFi protocol.
    get:
      operationId: listAllocations
      summary: List Allocations
      tags:
      - Allocations
      security:
      - authenticationToken: []
      description: Lists the allocations of your organization.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Allocations:Read`: Always required."
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Allocation'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /allocations/{allocationId}/actions:
    post:
      operationId: createAllocationAction
      summary: Create Allocation Action
      tags:
      - Allocations
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Create a new action for an existing allocation.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Allocations:Update`: Always required   \n`Wallets:Transactions:Create`: Always required. Allocation transactions are broadcast from your wallet.   \n`FeeSponsors:Use`: Required if `feeSponsorId` is specified and the sponsoree wallet belongs to an `EndUser` user kind."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Unique identifier for the allocation investment.
        required: true
        description: Unique identifier for the allocation investment.
        name: allocationId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
