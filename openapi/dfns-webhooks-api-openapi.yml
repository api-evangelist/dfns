          - vault.tags.modified
          - vault.event.created
          - address_watch.blockchain_event.transfer.confirmed
          - address_watch.blockchain_event.misc.confirmed
          - payout.action.required
          description: Webhook event
        data:
          type: object
          additionalProperties: {}
        status:
          type: string
          description: Status code of the webhook request
        error:
          type: string
          description: Error message if any error happened during the webhook request.
        timestampSent:
          type: integer
          exclusiveMinimum: 0
          description: Unix timestamp when the event was forwarded to the webhook url by our servers.
      required:
      - id
      - date
      - kind
      - data
      - status
      - timestampSent
    WebhookEnvelopeBase:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^whe-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Unique identifier for this webhook event.
          example: whe-544ul-uqgad-jkgltj5p6fvd04cj
        date:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Timestamp when the event occurred.'
          example: 2023-04-14 20:41:28.715000+00:00
        retryOf:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^whe-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: ID of the original event if this is a retry.
          example: whe-544ul-uqgad-jkgltj5p6fvd04cj
        timestampSent:
          type: integer
          description: Unix timestamp when the event was sent
          example: 1719566994
        deliveryAttempt:
          type: integer
          minimum: 1
          description: Delivery attempt number
          example: 1
      required:
      - id
      - date
      - timestampSent
      - deliveryAttempt
  securitySchemes:
    authenticationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '**Bearer Token:** Used to authenticate API requests.

        More details how to generate the token: [Authentication flows](https://docs.dfns.co/api-reference/auth/login-flows)'
    userActionSignature:
      type: apiKey
      in: header
      name: X-DFNS-USERACTION
      description: '**User Action Signature:** Used to sign the change-inducing API requests.

        More details how to generate the token: [User Action Signing flows](https://docs.dfns.co/api-reference/auth/signing-flows)'
