openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Webhooks API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Webhooks
paths:
  /webhooks:
    post:
      operationId: createWebhook
      summary: Create Webhook
      tags:
      - Webhooks
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Register a new webhook.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Webhooks:Create`: Always required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: Webhook url
                status:
                  type: string
                  enum:
                  - Enabled
                  - Disabled
                  description: Webhook status
                description:
                  type: string
                  maxLength: 256
                events:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      enum:
                      - policy.triggered
                      - policy.approval.pending
                      - policy.approval.resolved
                      - key.created
                      - key.deleted
                      - key.delegated
                      - key.exported
                      - wallet.blockchainevent.detected
                      - wallet.blockchain_event.transfer.included
                      - wallet.blockchain_event.misc.confirmed
                      - wallet.created
                      - wallet.activated
                      - wallet.delegated
                      - wallet.exported
                      - wallet.signature.failed
                      - wallet.signature.rejected
                      - wallet.signature.requested
                      - wallet.signature.signed
                      - wallet.transaction.broadcasted
                      - wallet.transaction.confirmed
                      - wallet.transaction.failed
                      - wallet.transaction.rejected
                      - wallet.transaction.requested
                      - wallet.transfer.broadcasted
                      - wallet.transfer.confirmed
                      - wallet.transfer.failed
                      - wallet.transfer.rejected
                      - wallet.transfer.requested
                      - wallet.offer.received
                      - wallet.offer.accepted
                      - wallet.offer.rejected
                      - wallet.offer.withdrawn
                      - wallet.tags.modified
                      - vault.created
                      - vault.updated
                      - vault.tags.modified
                      - vault.event.created
                      - address_watch.blockchain_event.transfer.confirmed
                      - address_watch.blockchain_event.misc.confirmed
                      - payout.action.required
                      description: WebhookEventKind
                    - type: string
                      enum:
                      - '*'
                    description: WebhookEventKind
                  minItems: 1
                  description: All events this webhook is subscribed to.
              required:
              - url
              - events
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookWithSecret'
    get:
      operationId: listWebhooks
      summary: List Webhooks
      tags:
      - Webhooks
      security:
      - authenticationToken: []
      description: List all webhooks for the authenticated user's organization. The results are paginated.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Webhooks:Read`: Always required."
      parameters:
      - schema:
          type: integer
          exclusiveMinimum: 0
          maximum: 200
        required: false
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
        required: false
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Webhook'
                  nextPageToken:
                    type: string
                required:
                - items
                additionalProperties: false
  /webhooks/{webhookId}:
    delete:
      operationId: deleteWebhook
      summary: Delete Webhook
      tags:
      - Webhooks
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Deletes an existing webhook registration.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Webhooks:Delete`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: webhookId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    enum:
                    - true
                required:
                - deleted
    get:
      operationId: getWebhook
      summary: Get Webhook
      tags:
      - Webhooks
      security:
      - authenticationToken: []
      description: Retrieve information about a specific webhook.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Webhooks:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: webhookId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
    put:
      operationId: updateWebhook
      summary: Update Webhook
      tags:
      - Webhooks
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Update the definition of an existing webhook.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Webhooks:Update`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: webhookId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  description: Webhook url
                description:
                  type: string
                  maxLength: 256
                events:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      enum:
                      - policy.triggered
                      - policy.approval.pending
                      - policy.approval.resolved
                      - key.created
                      - key.deleted
                      - key.delegated
                      - key.exported
                      - wallet.blockchainevent.detected
                      - wallet.blockchain_event.transfer.included
                      - wallet.blockchain_event.misc.confirmed
                      - wallet.created
                      - wallet.activated
                      - wallet.delegated
                      - wallet.exported
                      - wallet.signature.failed
                      - wallet.signature.rejected
                      - wallet.signature.requested
                      - wallet.signature.signed
                      - wallet.transaction.broadcasted
                      - wallet.transaction.confirmed
                      - wallet.transaction.failed
                      - wallet.transaction.rejected
                      - wallet.transaction.requested
                      - wallet.transfer.broadcasted
                      - wallet.transfer.confirmed
                      - wallet.transfer.failed
                      - wallet.transfer.rejected
                      - wallet.transfer.requested
                      - wallet.offer.received
                      - wallet.offer.accepted
                      - wallet.offer.rejected
                      - wallet.offer.withdrawn
                      - wallet.tags.modified
                      - vault.created
                      - vault.updated
                      - vault.tags.modified
                      - vault.event.created
                      - address_watch.blockchain_event.transfer.confirmed
                      - address_watch.blockchain_event.misc.confirmed
                      - payout.action.required
                      description: WebhookEventKind
                    - type: string
                      enum:
                      - '*'
                    description: WebhookEventKind
                  minItems: 1
                  description: All events this webhook is subscribed to.
                status:
                  type: string
                  enum:
                  - Enabled
                  - Disabled
                  description: Webhook status
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Webhook'
  /webhooks/{webhookId}/ping:
    post:
      operationId: pingWebhook
      summary: Ping Webhook
      tags:
      - Webhooks
      security:
      - authenticationToken: []
        userActionSignature: []
      description: This endpoint is meant for webhook setup and troubleshooting. Calling the endpoint will trigger a fake test event that will be pushed to the webhook URL. The fake event will not be saved and not appear in further requests to Webhook Events.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Webhooks:Ping`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: webhookId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  error:
                    type: string
                required:
                - status
                additionalProperties: false
  /webhooks/{webhookId}/events/{webhookEventId}:
    get:
      operationId: getWebhookEvent
      summary: Get Webhook Event
      tags:
      - Webhooks
      security:
      - authenticationToken: []
      description: 'Retrieve a specific webhook event details by its ID.


        We only keep a trace of those Webhook Events in our system for a **retention period of 31 days**. Past that, they are discarded, so you cannot see them using List Webhook Events or Get Webhook Event endpoints.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Webhooks:Events:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^wh-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
        required: true
        name: webhookId
        in: path
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^whe-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
        required: true
        name: webhookEventId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEvent'
  /webhooks/{webhookId}/events:
    get:
      operationId: listWebhookEvents
      summary: List Webhook Events
      tags:
      - Webhooks
      security:
      - authenticationToken: []
      description: 'Lists all events for a given webhook.


        We only keep a trace of those Webhook Events in our system for a **retention period of 31 days**. Past that, they are discarded, so you cannot see them using List Webhook Events or Get Webhook Event endpoints.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Webhooks:Events:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: webhookId
        in: path
      - schema:
          type: string
          enum:
          - policy.triggered
          - policy.approval.pending
          - policy.approval.resolved
          - key.created
          - key.deleted
          - key.delegated
          - key.exported
          - wallet.blockchainevent.detected
          - wallet.blockchain_event.transfer.included
          - wallet.blockchain_event.misc.confirmed
          - wallet.created
          - wallet.activated
          - wallet.delegated
          - wallet.exported
          - wallet.signature.failed
          - wallet.signature.rejected
          - wallet.signature.requested
          - wallet.signature.signed
          - wallet.transaction.broadcasted
          - wallet.transaction.confirmed
          - wallet.transaction.failed
          - wallet.transaction.rejected
          - wallet.transaction.requested
          - wallet.transfer.broadcasted
          - wallet.transfer.confirmed
          - wallet.transfer.failed
          - wallet.transfer.rejected
          - wallet.transfer.requested
          - wallet.offer.received
          - wallet.offer.accepted
          - wallet.offer.rejected
          - wallet.offer.withdrawn
          - wallet.tags.modified
          - vault.created
          - vault.updated
          - vault.tags.modified
          - vault.event.created
          - address_watch.blockchain_event.transfer.confirmed
          - address_watch.blockchain_event.misc.confirmed
          - payout.action.required
        required: false
        name: kind
        in: query
      - schema:
          type: string
          enum:
          - 'true'
          - 'false'
        required: false
        name: deliveryFailed
        in: query
      - schema:
          type: integer
          exclusiveMinimum: 0
          maximum: 200
        required: false
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
        required: false
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookEvent'
                  nextPageToken:
                    type: string
                required:
                - items
webhooks:
  webhook.event.retry.triggered:
    post:
      summary: Webhook Event Retry Triggered
      description: Inbound event DFNS sends to your endpoint when it automatically retries a failed webhook delivery. This is a webhook event you receive, not an API method you can call. See Webhook Event Deliveries & Retries for details.
      tags:
      - Webhooks
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookEnvelopeBase'
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - webhook.event.retry.triggered
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: ID of this webhook retry event.
                      webhookId:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: ^wh-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                        description: ID of the webhook to which this event is delivered.
                        example: wh-705m3-si5pq-k3kkp3vv9fnehdil
                      retryOf:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: ^whe-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                        description: ID of the webhook event whose delivery failed and is retried.
                        example: whe-544ul-uqgad-jkgltj5p6fvd04cj
                      deliveryAttempt:
                        type: number
                        description: Attempt number of this delivery attempt.
                      originalEvent:
                        allOf:
                        - $ref: '#/components/schemas/WebhookEvent'
                        - description: The original Dfns event.
                    required:
                    - id
                    - webhookId
                    - retryOf
                    - deliveryAttempt
                    - originalEvent
                required:
                - kind
                - data
      responses:
        '200':
          description: Respond with a 200 to indicate that the event was successfully received. If your endpoint returns anything else than a 200 status code, we will consider the delivery has failed and retry later. See details [here](https://docs.dfns.co/api-reference/webhook-events#webhook-event-deliveries-%26-retries).
components:
