openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Networks API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Networks
paths:
  /networks/fees:
    get:
      operationId: estimateFees
      summary: Estimate Fees
      tags:
      - Networks
      security:
      - authenticationToken: []
      description: 'Gets real-time fee details for a given network, allowing users to make decisions based on their preferences for transaction speed/priority. Three levels of priority will be displayed: `slow`, `standard`, `fast`.


        Legacy (pre-London) EVM networks such as Ethereum Classic do not support EIP-1559 fee estimation and are not listed here. When broadcasting on those networks, omit `priority` and a legacy `gasPrice` is filled automatically.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\nNo permission required."
      parameters:
      - schema:
          type: string
          enum:
          - Bitcoin
          - BitcoinSignet
          - BitcoinTestnet4
          - Litecoin
          - LitecoinTestnet
          - Dogecoin
          - DogecoinTestnet
          - ArbitrumOne
          - ArbitrumSepolia
          - Arc
          - ArcTestnet
          - Areum
          - AvalancheC
          - AvalancheCFuji
          - Base
          - BaseSepolia
          - Bob
          - BobSepolia
          - Bsc
          - BscTestnet
          - Berachain
          - BerachainBepolia
          - Celo
          - CeloSepolia
          - Codex
          - CodexSepolia
          - Ethereum
          - EthereumSepolia
          - EthereumHoodi
          - FlareC
          - FlareCCoston2
          - FlowEvm
          - FlowEvmTestnet
          - Ink
          - InkSepolia
          - Monad
          - MonadTestnet
          - Optimism
          - OptimismSepolia
          - Plasma
          - PlasmaTestnet
          - Plume
          - PlumeSepolia
          - Polygon
          - PolygonAmoy
          - Rayls
          - RaylsTestnet
          - Robinhood
          - RobinhoodSepolia
          - SeiPacific1
          - SeiAtlantic2
          - Sonic
          - SonicTestnet
          - Tempo
          - TempoModerato
          - Tsc
          - TscTestnet1
          - Xdc
          - XdcApothem
          - XLayer
          - XLayerSepolia
          - Solana
          - SolanaDevnet
        required: true
        name: network
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    kind:
                      type: string
                      enum:
                      - Bitcoin
                    network:
                      type: string
                      enum:
                      - Bitcoin
                      - BitcoinSignet
                      - BitcoinTestnet4
                      - Litecoin
                      - LitecoinTestnet
                      - Dogecoin
                      - DogecoinTestnet
                    blockNumber:
                      type: number
                    slow:
                      type: object
                      properties:
                        feeRate:
                          type: string
                          description: Fee rate denominated in satoshis (the lowest denomination) per virtual byte.
                          example: '12'
                        blockHorizon:
                          type: number
                          description: Target number of blocks within which a transaction at this fee rate is expected to confirm.
                          example: 2
                      required:
                      - feeRate
                      - blockHorizon
                    standard:
                      type: object
                      properties:
                        feeRate:
                          type: string
                          description: Fee rate denominated in satoshis (the lowest denomination) per virtual byte.
                          example: '12'
                        blockHorizon:
                          type: number
                          description: Target number of blocks within which a transaction at this fee rate is expected to confirm.
                          example: 2
                      required:
                      - feeRate
                      - blockHorizon
                    fast:
                      type: object
                      properties:
                        feeRate:
                          type: string
                          description: Fee rate denominated in satoshis (the lowest denomination) per virtual byte.
                          example: '12'
                        blockHorizon:
                          type: number
                          description: Target number of blocks within which a transaction at this fee rate is expected to confirm.
                          example: 2
                      required:
                      - feeRate
                      - blockHorizon
                  required:
                  - kind
                  - network
                  - blockNumber
                  - slow
                  - standard
                  - fast
                  title: Bitcoin
                - type: object
                  properties:
                    kind:
                      type: string
                      enum:
                      - Eip1559
                    network:
                      type: string
                      enum:
                      - ArbitrumOne
                      - ArbitrumSepolia
                      - Arc
                      - ArcTestnet
                      - Areum
                      - AvalancheC
                      - AvalancheCFuji
                      - Base
                      - BaseSepolia
                      - Bob
                      - BobSepolia
                      - Bsc
                      - BscTestnet
                      - Berachain
                      - BerachainBepolia
                      - Celo
                      - CeloSepolia
                      - Codex
                      - CodexSepolia
                      - Ethereum
                      - EthereumClassic
                      - EthereumClassicMordor
                      - EthereumSepolia
                      - EthereumHoodi
                      - FlareC
                      - FlareCCoston2
                      - FlowEvm
                      - FlowEvmTestnet
                      - Ink
                      - InkSepolia
                      - Monad
                      - MonadTestnet
                      - Optimism
                      - OptimismSepolia
                      - Plasma
                      - PlasmaTestnet
                      - Plume
                      - PlumeSepolia
                      - Polygon
                      - PolygonAmoy
                      - Rayls
                      - RaylsTestnet
                      - Robinhood
                      - RobinhoodSepolia
                      - SeiPacific1
                      - SeiAtlantic2
                      - Sonic
                      - SonicTestnet
                      - Tempo
                      - TempoModerato
                      - Tsc
                      - TscTestnet1
                      - Xdc
                      - XdcApothem
                      - XLayer
                      - XLayerSepolia
                    blockNumber:
                      type: number
                    slow:
                      type: object
                      properties:
                        maxPriorityFeePerGas:
                          type: string
                          description: Maximum priority fee (tip) per unit of gas, denominated in wei (the lowest denomination).
                          example: '1500000000'
                        maxFeePerGas:
                          type: string
                          description: Maximum total fee per unit of gas, denominated in wei (the lowest denomination).
                          example: '1626000000000'
                      required:
                      - maxPriorityFeePerGas
                      - maxFeePerGas
                    standard:
                      type: object
                      properties:
                        maxPriorityFeePerGas:
                          type: string
                          description: Maximum priority fee (tip) per unit of gas, denominated in wei (the lowest denomination).
                          example: '1500000000'
                        maxFeePerGas:
                          type: string
                          description: Maximum total fee per unit of gas, denominated in wei (the lowest denomination).
                          example: '1626000000000'
                      required:
                      - maxPriorityFeePerGas
                      - maxFeePerGas
                    fast:
                      type: object
                      properties:
                        maxPriorityFeePerGas:
                          type: string
                          description: Maximum priority fee (tip) per unit of gas, denominated in wei (the lowest denomination).
                          example: '1500000000'
                        maxFeePerGas:
                          type: string
                          description: Maximum total fee per unit of gas, denominated in wei (the lowest denomination).
                          example: '1626000000000'
                      required:
                      - maxPriorityFeePerGas
                      - maxFeePerGas
                    baseFeePerGas:
                      type: string
                      description: Base fee per unit of gas of the latest block, denominated in wei (the lowest denomination).
                      example: '1000000000'
                  required:
                  - kind
                  - network
                  - blockNumber
                  - slow
                  - standard
                  - fast
                  - baseFeePerGas
                  description: 'For EIP-1559, we  provide 2 different fields for each strategy: `maxFee` (per Gas) and `maxPriorityFee` (per Gas). To compute these estimations, we look at the block history, compute three different percentiles for the rewards offered by the transactions in the blocks, and then calculate the average for each strategy.'
                  title: EVM EIP-1559
                - type: object
                  properties:
                    kind:
                      type: string
                      enum:
                      - Solana
                    network:
                      type: string
                      enum:
                      - Solana
                      - SolanaDevnet
                    blockNumber:
                      type: number
                    slow:
                      type: object
                      properties:
                        computeUnitPrice:
                          type: string
                          description: Price per compute unit, denominated in micro-lamports (the lowest denomination).
                          example: '10000'
                      required:
                      - computeUnitPrice
                    standard:
                      type: object
                      properties:
                        computeUnitPrice:
                          type: string
                          description: Price per compute unit, denominated in micro-lamports (the lowest denomination).
                          example: '10000'
                      required:
                      - computeUnitPrice
                    fast:
                      type: object
                      properties:
                        computeUnitPrice:
                          type: string
                          description: Price per compute unit, denominated in micro-lamports (the lowest denomination).
                          example: '10000'
                      required:
                      - computeUnitPrice
                  required:
                  - kind
                  - network
                  - blockNumber
                  - slow
                  - standard
                  - fast
                  title: Solana
  /networks/{network}/call-function:
    post:
      operationId: callFunction
      summary: Call Function
      tags:
      - Networks
      security:
      - authenticationToken: []
      description: 'Call a read-only function on a smart contract. In Solidity, these are functions with the state mutability set to `view`.


        Currently only works on EVM compatible chains.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\nNo permission required."
      parameters:
      - schema:
          type: string
          description: Network name formatted in kebab case
        required: true
        description: Network name formatted in kebab case
        name: network
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contract:
                  type: string
                  pattern: ^0x[0-9a-fA-F]{40}$
                  description: Address of the contract to call
                abi:
                  type: object
                  properties:
                    type:
                      type: string
                    name:
                      type: string
                    stateMutability:
                      type: string
                    inputs:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          type:
                            type: string
                          components:
                            type: array
                            items:
                              type: object
                        required:
                        - name
                        - type
                    outputs:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          type:
                            type: string
                          components:
                            type: array
                            items:
                              type: object
                        required:
                        - name
                        - type
                  required:
                  - type
                  - name
                  - stateMutability
                  - inputs
                  - outputs
                  description: ABI of the read-only function to invoke
                calldata:
                  type: object
                  properties: {}
                  description: Function call arguments
              required:
              - contract
              - abi
              additionalProperties: false
              description: Calls an on-chain read function.
              title: Call Function
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema: {}
  /networks/{network}/validators/{validatorId}:
    get:
      operationId: getCantonValidator
      summary: Get Canton Validator
      tags:
      - Networks
      security:
      - authenticationToken: []
      description: Return a configured Canton Validator in your organization.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Networks:Canton:Validators:Read`: Always required."
      parameters:
      - schema:
          type: string
          enum:
          - canton
          - canton-devnet
          - canton-testnet
        required: true
        name: network
        in: path
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^cv-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
        required: true
        name: validatorId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CantonValidator'
    put:
      operationId: updateCantonValidator
      summary: Update Canton Validator
      tags:
      - Networks
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Update an existing Canton Validator configuration.


        Read details about the process here.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Networks:Canton:Validators:Update`: Always required."
      parameters:
      - schema:
          type: string
          enum:
          - canton
          - canton-devnet
          - canton-testnet
        required: true
        name: network
        in: path
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^cv-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
        required: true
        name: validatorId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: Nickname for this validator.
                validator:
                  type: object
                  properties:
                    url:
                      type: string
                      format: uri
                      description: URL to reach the API at this address. The calls will be originating from our IP addresses (see [Dfns Environments](https://docs.dfns.co/api-reference/regions))
                    oauth2:
                      type: object
                      properties:
                        domain:
                          type: string
                          format: uri
                          description: 'your OAuth2 tenant domain. Provided by your auth provider. '
                        tokenPath:
                          type: string
                          description: 'token endpoint from your authorization provider. We will call this endpoint on your tenant domain (i.e.: `<domain>/<token path>`)'
                        audience:
                          type: string
                          description: the audience your configured on your auth provider. It is suggested to start with `https://canton.network.global`.
                        clientId:
                          type: string
                          description: The client id from your auth provider for this application.
                        clientSecret:
                          type: string
                          description: The client secret from your auth provider for this application.
                      required:
                      - domain
                      - audience
                      - clientId
                      - clientSecret
                      description: How Dfns will authenticate into your validator/ledger. You should have setup authentication already (see details [here](https://docs.dev.sync.global/validator_operator/validator_helm.html#helm-validator-auth)), you can reuse the same Application details. See examples in this endpoint payload examples above.
                  required:
                  - url
                  - oauth2
                ledger:
                  type: object
                  properties:
                    url:
                      type: string
                      format: uri
                      description: URL to reach the API at this address. The calls will be originating from our IP addresses (see [Dfns Environments](https://docs.dfns.co/api-reference/regions))
                    oauth2:
                      type: object
                      properties:
                        domain:
                          type: string
                          format: uri
                          description: 'your OAuth2 tenant domain. Provided by your auth provider. '
                        tokenPath:
                          type: string
                          description: 'token endpoint from your authorization provider. We will call this endpoint on your tenant domain (i.e.: `<domain>/<token path>`)'
                        audience:
                          type: string
                          description: the audience your configured on your auth provider. It is suggested to start with `https://canton.network.global`.
                        clientId:
                          type: string
                          description: The client id from your auth provider for this application.
                        clientSecret:
                          type: string
                          description: The client secret from your auth provider for this application.
                      required:
                      - domain
                      - audience
                      - clientId
                      - clientSecret
                      description: How Dfns will authenticate into your validator/ledger. You should have setup authentication already (see details [here](https://docs.dev.sync.global/validator_operator/validator_helm.html#helm-validator-auth)), you can reuse the same Application details. See examples in this endpoint payload examples above.
                  required:
                  - url
                  - oauth2
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CantonValidator'
    delete:
      operationId: deleteCantonValidator
      summary: Delete Canton Validator
      tags:
      - Networks
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Delete a specific Canton Validator configuration.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Networks:Canton:Validators:Delete`: Always required."
      parameters:
      - schema:
          type: string
          enum:
          - canton
          - canton-devnet
          - canton-testnet
        required: true
        name: network
        in: path
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^cv-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
        required: true
        name: validatorId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CantonValidator'
  /networks/{network}/validators:
    post:
      operationId: createCantonValidator
      summary: Create Canton Validator
      tags:
      - Networks
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Link a Canton Validator to your organization. This is required in order to create wallets or interact with the Canton network.


        The `Shared` option allows you to use a shared validator hosted by Dfns and get started in seconds, while the `Custom` option allows you to connect your own validator and ledger nodes using OAuth2 authentication.


        Read details about the process here.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Networks:Canton:Validators:Create`: Always required."
      parameters:
      - schema:
          type: string
          enum:
          - canton
          - canton-devnet
          - canton-testnet
        required: true
        name: network
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: Nickname for this validator.
                  kind:
                    type: string
                    enum:
                    - Shared
                required:
                - kind
                description: Use Dfns' shared validator to create your Canton Wallets. See [here](https://docs.dfns.co/networks/canton)
                title: Dfns Shared validator
              - type: object
                properties:
                  name:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: Nickname for this validator.
                  kind:
                    type: string
                    enum:
                    - Custom
                  validator:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
                        description: URL to reach the API at this address. The calls will be originating from our IP addresses (see [Dfns Environments](https://docs.dfns.co/api-reference/regions))
                      oauth2:
                        type: object
                        properties:
                          domain:
                            type: string
                            format: uri
                            description: 'your OAuth2 tenant domain. Provided by your auth provider. '
                          tokenPath:
                            type: string
                            description: 'token endpoint from your authorization provider. We will call this endpoint on your tenant domain (i.e.: `<domain>/<token path>`)'
                          audience:
                            type: string
                            description: the audience your configured on your auth provider. It is suggested to start with `https://canton.network.global`.
                          clientId:
                            type: string
                            description: The client id from your auth provider for this application.
                          clientSecret:
                            type: string
                            description: The client secret from your auth provider for this application.
                        required:
                        - domain
                        - audience
                        - clientId
                        - clientSecret
                        description: How Dfns will authenticate into your validator/ledger. You should have setup authentication already (see details [here](https://docs.dev.sync.global/validator_operator/validator_helm.html#helm-validator-auth)), you can reuse the same Application details. See examples in this endpoint payload examples above.
                    required:
                    - url
                    - oauth2
                    description: Configuration to reach your validator Signing API. We will call the validator External Signing API at the url (and using the credentials) defined below ; for instance `$URL/api/validator/v0/admin/external-party/topology/generate`. See the underlying calls details [here](https://docs.dev.sync.global/app_dev/validator_api/index.html#validator-api-external-signing).
                  ledger:
                    type: object
                    properties:
                      url:
                        type: string
                        format: uri
                        description: URL to reach the API at this address. The calls will be originating from our IP addresses (see [Dfns Environments](https://docs.dfns.co/api-reference/regions))
                      oauth2:
                        type: object
                        properties:
                          domain:
                            type: string
                            format: uri
                            description: 'your OAuth2 tenant domain. Provided by your auth provider. '
                          tokenPath:
                            type: string
                            description: 'token endpoint from your authorization provider. We will call this endpoint on your tenant domain (i.e.: `<domain>/<token path>`)'
                          audience:
                            type: string
                            description: the audience your configured on your auth provider. It is suggested to start with `https://canton.network.global`.
                          clientId:
                            type: string
                            description: The client id from your auth provider for this application.
                          clientSecret:
                            type: string
                            description: The client secret from your auth provider for this application.
                        required:
                        - domain
                        - audience
                        - clientId
                        - clientSecret
                        description: How Dfns will authenticate into your validator/ledger. You should have setup authentication already (see details [here](https://docs.dev.sync.global/validator_operator/validator_helm.html#helm-validator-auth)), you can reuse the same Application details. See examples in this endpoint payload examples above.
                    required:
                    - url
                    - oauth2
                    description: Configuration to reach your validator Ledger JSON API. We will call endpoints such as `/v2/state/ledger-end`, `/v2/state/active-contracts`, `/v2/parties/participant-id`, `/v2/interactive-submission/prepare`, `/v2/interactive-submission/execute`, `/v2/commands/completions`. See the underlying details [here](https://docs.dev.sync.global/app_dev/ledger_api/index.html).
                required:
                - kind
                - validator
                - ledger
                description: Connect your own validator. See [here](https://docs.dfns.co/networks/canton) for more info.
                title: Your own custom validator
            examples:
              Shared Validator:
                value:
                  kind: Shared
                  name: My shared validator
              Custom Validator | Auth0:
                value:
                  kind: Custom
                  name: My validator with auth0 credentials
                  validator:
                    url: https://validator.testnet.mydomain.com/
                    oauth2:
                      domain: https://xxxxxx.us.auth0.com
                      clientId: xxxxxx
                      clientSecret: xxxxxxx
                      audience: https://canton.network.global
                  ledger:
                    url: https://ledger.testnet.mydomain.com/
                    oauth2:
                      domain: https://xxxxxx.us.auth0.com
                      clientId: xxxxxx
                      clientSecret: xxxxxxx
                      audience: https://canton.network.global
              Custom Validator | Okta:
                value:
                  kind: Custom
                  name: My validator with auth0 credentials
                  validator:
                    url: https://validator.testnet.mydomain.com/
                    oauth2:
                      domain: https://xxxxxx.okta.com
                      tokenPath: oauth2/xxxxxx/v1/token
                      clientId: xxxxxx
                      clientSecret: xxxxxxx
                      audience: https://validator.testnet.mydomain.com/
                  ledger:
                    url: https://ledger.testnet.mydomain.com/
                    oauth2:
                      domain: https://xxxxxx.okta.com
                      tokenPath: oauth2/xxxxxx/v1/token
                      clientId: xxxxxx
                      clientSecret: xxxxxxx
                      audience: https://ledger.testnet.mydomain.com/
              Custom Validator | Keycloak:
                value:
                  kind: Custom
                  name: My validator with auth0 credentials
                  validator:
                    url: https://validator.testnet.mydomain.com/
                    oauth2:
                      domain: https://my-own-server.running-keycloak.com
                      tokenPath: /auth/realms/xxxxx/protocol/openid-connect/token
                      clientId: xxxxxx
                      clientSecret: xxxxxxx
                      audience: https://validator.testnet.mydomain.com/
                  ledger:
                    url: https://ledger.testnet.mydomain.com/
                    oauth2:
                      domain: https://my-own-server.running-keycloak.com
                      tokenPath: /auth/realms/xxxxx/protocol/openid-connect/token
                      clientId: xxxxxx
                      clientSecret: xxxxxxx
                      audience: https://ledger.testnet.mydomain.com/
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CantonValidator'
    get:
      operationId: listCantonValidators
      summary: List Canton Validators
      tags:
      - Networks
      security:
      - authenticationToken: []
      description: Retrieve the list of configured Canton Validators in your organization.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Networks:Canton:Validators:Read`: Always required."
      parameters:
      - schema:
          type: string
          enum:
          - canton
          - canton-devnet
          - canton-testnet
        required: true
        name: network
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CantonValidator'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /networks/{network}/transactions/reindex:
    post:
      operationId: reindexTransaction
      summary: Reindex Transaction
      tags:
      - Networks
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Re-index a finalized transaction that is missing from your wallets'' history. A transaction that is already indexed is not processed again.


        Limited to 10 requests per organization per 10 minutes.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Networks:Transactions:Reindex`: Always required."
      parameters:
      - schema:
          type: string
          description: Network name formatted in kebab case
        required: true
        description: Network name formatted in kebab case
        name: network
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                txHash:
                  type: string
                  minLength: 1
                  description: Hash of the transaction to re-index
              required:
              - txHash
              additionalProperties: false
              description: Re-indexes a finalized transaction.
              title: Reindex Transaction
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                required:
                - success
components:
  schemas:
    CantonValidator:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^cv-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          example: cv-7jeof-m584r-p35ucm37ko3cqgts
        orgId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^or-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Organization id.
          example: or-30tnh-itmjs-s235s5ontr3r23h2
        network:
          type: string
          enum:
          - Canton
          - CantonDevnet
          - CantonTestnet
          description: The Canton network this validator is configured for.
        name:
          type: string
          description: Nickname for this validator.
        kind:
          type: string
          enum:
          - Shared
          - Custom
          description: '`Shared` if using the Dfns-hosted shared validator, `Custom` if connecting your own validator.'
        dateCreated:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). When the validator was linked.'
          example: 2023-04-14 20:41:28.715000+00:00
        partyHint:
          type: string
          description: Party hint used to derive the Canton party id for wallets created under this validator.
      required:
      - id
      - orgId
      - network
      - kind
      - dateCreated
      - partyHint
  securitySchemes:
    authenticationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '**Bearer Token:** Used to authenticate API requests.

        More details how to generate the token: [Authentication flows](https://docs.dfns.co/api-reference/auth/login-flows)'
    userActionSignature:
      type: apiKey
      in: header
      name: X-DFNS-USERACTION
      description: '**User Action Signature:** Used to sign the change-inducing API requests.

        More details how to generate the token: [User Action Signing flows](https://docs.dfns.co/api-reference/auth/signing-flows)'
