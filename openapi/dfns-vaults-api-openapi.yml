components:
  schemas:
    VaultLock:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-lck-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault lock id.
          example: vlt-lck-0lf1e-8a8ag-2ak7vrvusrj3so0j
        vaultId:
          type: string
        network:
          type: string
        tid:
          type: string
        amount:
          type: string
        owner:
          type: string
          description: The user that created the lock. Only this user can update or delete it.
        externalId:
          type: string
        reason:
          type: string
          description: The reason or note the lock was created with.
        beneficiary:
          type: string
          description: The address the locked funds are sent to on transfer. Set at creation and inherited on update.
        transferId:
          type: string
          description: 'Set when the owner transferred the lock: the outgoing transfer sending `transferAmount` of the locked funds to the beneficiary. The funds stay locked until that transfer is confirmed, which deletes the lock. Cleared if the transfer fails, so the lock can be transferred again.'
        transferAmount:
          type: string
          description: 'Set with `transferId`: the amount being sent to the beneficiary, in minimum denomination. The remainder of the locked amount returns to the available balance when the lock is deleted.'
        replacesLockId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-lck-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: 'Set when this lock was created by an update: the lock it replaces.'
          example: vlt-lck-0lf1e-8a8ag-2ak7vrvusrj3so0j
        replacedByLockId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-lck-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: 'Set when this lock was released by an update: the lock that replaced it.'
          example: vlt-lck-0lf1e-8a8ag-2ak7vrvusrj3so0j
        dateCreated:
          type: string
          format: date-time
        dateDeleted:
          type: string
          format: date-time
      required:
      - id
      - vaultId
      - network
      - tid
      - amount
      - owner
      - dateCreated
      additionalProperties: false
      description: 'Vault lock object: funds manually locked for off-chain settlement or escrow. The owner can release them back to the vault or transfer them to the beneficiary.'
    Vault:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault id.
          example: vlt-5vbsp-u62g1-ostmunqgds5o9tc2
        orgId:
          type: string
        name:
          type: string
        tags:
          type: array
          items:
            type: string
        externalId:
          type: string
        dateCreated:
          type: string
          format: date-time
        dateUpdated:
          type: string
          format: date-time
        addresses:
          type: array
          items:
            $ref: '#/components/schemas/VaultAddress'
          description: The vault's addresses.
      required:
      - id
      - orgId
      - tags
      - dateCreated
      - dateUpdated
      additionalProperties: false
      description: Vault object.
    VaultQuarantine:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-qua-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault quarantine id.
          example: vlt-qua-7ein9-uptvv-uuegt9p5n69ocs4q
        vaultId:
          type: string
        network:
          type: string
        transactionHash:
          type: string
          description: The transaction that deposited the quarantined funds.
        kytResult:
          oneOf:
          - type: object
            properties:
              provider:
                type: string
                enum:
                - Chainalysis
              transferReference:
                type: string
              providerUserId:
                type: string
                description: Grouping key registered with the provider ("userId" in Chainalysis terms).
              externalId:
                type: string
                description: Provider-side id of the registered transfer.
              alerts:
                type: array
                items:
                  type: object
                  properties:
                    level:
                      type: string
                      enum:
                      - Low
                      - Medium
                      - High
                      - Severe
                    categoryId:
                      type:
                      - number
                      - 'null'
                  required:
                  - level
                  - categoryId
              exposure:
                type: object
                properties:
                  direct:
                    type: object
                    properties:
                      categoryId:
                        type:
                        - number
                        - 'null'
                      name:
                        type:
                        - string
                        - 'null'
                    required:
                    - categoryId
                    - name
                required:
                - direct
              maxAlertLevel:
                type:
                - string
                - 'null'
                enum:
                - Low
                - Medium
                - High
                - Severe
            required:
            - provider
            - transferReference
            - providerUserId
            - externalId
            - alerts
            - exposure
            - maxAlertLevel
            title: Chainalysis KYT Result
          - type: object
            properties:
              provider:
                type: string
                enum:
                - Elliptic
              transferReference:
                type: string
              providerUserId:
                type: string
                description: Grouping key registered with the provider ("userId" in Chainalysis terms).
              externalId:
                type: string
                description: Provider-side id of the registered transfer.
              alerts:
                type: array
                items:
                  type: object
                  properties:
                    categoryId:
                      type:
                      - string
                      - 'null'
                  required:
                  - categoryId
              riskScore:
                type:
                - number
                - 'null'
            required:
            - provider
            - transferReference
            - providerUserId
            - externalId
            - alerts
            - riskScore
            title: Elliptic KYT Result
          description: KYT screening result recorded for the quarantined deposit, when available. Policies of rule kind `ChainalysisQuarantineScreening` evaluate this stored result when the release is requested.
        dateReleased:
          type: string
          format: date-time
          description: Set when the quarantined funds have been released into the available balance.
        dateCreated:
          type: string
          format: date-time
      required:
      - id
      - vaultId
      - network
      - transactionHash
      - dateCreated
      additionalProperties: false
      description: 'Vault quarantine object: an incoming deposit held out of the available balance until released.'
    VaultAsset:
      type: object
      properties:
        kind:
          type: string
        network:
          type: string
        tid:
          type: string
        decimals:
          type: number
        symbol:
          type: string
        verified:
          type: boolean
        availableBalance:
          type: string
        quarantinedBalance:
          type: string
        lockedBalance:
          type: string
        quotes:
          type: object
          properties:
            USD:
              type: number
      required:
      - kind
      - network
      - tid
      - decimals
      - availableBalance
      - quarantinedBalance
      - lockedBalance
      additionalProperties: false
      description: Vault asset with balances broken down by kind and USD unit price.
