openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Vaults API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Vaults
paths:
  /vaults:
    post:
      operationId: createVault
      summary: Create Vault
      tags:
      - Vaults
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Creates a new Vault.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Vaults:Create`: Always required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                tags:
                  type: array
                  items:
                    type: string
                    pattern: ^[a-zA-Z0-9_.:/+-]{1,100}$
                    description: Vault Tag.
                  maxItems: 10
                  default: []
                externalId:
                  type: string
                  maxLength: 100
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
    get:
      operationId: listVaults
      summary: List Vaults
      tags:
      - Vaults
      security:
      - authenticationToken: []
      description: Retrieves the list of Vaults in your organization.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Vaults:Read`: Always required."
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Vault'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /vaults/{vaultId}/addresses:
    post:
      operationId: createVaultAddress
      summary: Create Vault Address
      tags:
      - Vaults
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Creates a vault address (managed wallet) on a network that supports vaults — EVM networks, Bitcoin, and Solana (native SOL and SPL/Token-2022 tokens). Add one network per call.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Vaults:Create`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault id.
        required: true
        description: Vault id.
        name: vaultId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: string
                  enum:
                  - ArbitrumOne
                  - ArbitrumSepolia
                  - Arc
                  - ArcTestnet
                  - Areum
                  - AvalancheC
                  - AvalancheCFuji
                  - Base
                  - BaseSepolia
                  - Berachain
                  - BerachainBepolia
                  - Bitcoin
                  - BitcoinSignet
                  - BitcoinTestnet4
                  - Bob
                  - BobSepolia
                  - Bsc
                  - BscTestnet
                  - Celo
                  - CeloSepolia
                  - Codex
                  - CodexSepolia
                  - Ethereum
                  - EthereumClassic
                  - EthereumClassicMordor
                  - EthereumSepolia
                  - EthereumHoodi
                  - FlareC
                  - FlareCCoston2
                  - FlowEvm
                  - FlowEvmTestnet
                  - Ink
                  - InkSepolia
                  - Monad
                  - MonadTestnet
                  - Optimism
                  - OptimismSepolia
                  - Plasma
                  - PlasmaTestnet
                  - Plume
                  - PlumeSepolia
                  - Polygon
                  - PolygonAmoy
                  - Rayls
                  - RaylsTestnet
                  - Robinhood
                  - RobinhoodSepolia
                  - SeiAtlantic2
                  - SeiPacific1
                  - Solana
                  - SolanaDevnet
                  - Sonic
                  - SonicTestnet
                  - Tempo
                  - TempoModerato
                  - Tsc
                  - TscTestnet1
                  - Xdc
                  - XdcApothem
                  - XLayer
                  - XLayerSepolia
              required:
              - network
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultAddress'
  /vaults/{vaultId}/locks:
    post:
      operationId: createVaultLock
      summary: Create Vault Lock
      tags:
      - Vaults
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Requests locking funds from the vault's available balance for off-chain settlement or escrow. Returns the created lock (200), or the pending lock request (202) when a policy requires approval.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Vaults:Locks:Create`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault id.
        required: true
        description: Vault id.
        name: vaultId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: string
                  enum:
                  - ArbitrumOne
                  - ArbitrumSepolia
                  - Arc
                  - ArcTestnet
                  - Areum
                  - AvalancheC
                  - AvalancheCFuji
                  - Base
                  - BaseSepolia
                  - Bob
                  - BobSepolia
                  - Bsc
                  - BscTestnet
                  - Berachain
                  - BerachainBepolia
                  - Celo
                  - CeloSepolia
                  - Codex
                  - CodexSepolia
                  - Ethereum
                  - EthereumClassic
                  - EthereumClassicMordor
                  - EthereumSepolia
                  - EthereumHoodi
                  - FlareC
                  - FlareCCoston2
                  - FlowEvm
                  - FlowEvmTestnet
                  - Ink
                  - InkSepolia
                  - Monad
                  - MonadTestnet
                  - Optimism
                  - OptimismSepolia
                  - Plasma
                  - PlasmaTestnet
                  - Plume
                  - PlumeSepolia
                  - Polygon
                  - PolygonAmoy
                  - Rayls
                  - RaylsTestnet
                  - Robinhood
                  - RobinhoodSepolia
                  - SeiPacific1
                  - SeiAtlantic2
                  - Sonic
                  - SonicTestnet
                  - Tempo
                  - TempoModerato
                  - Tsc
                  - TscTestnet1
                  - Xdc
                  - XdcApothem
                  - XLayer
                  - XLayerSepolia
                  description: The EVM network the locked asset is on.
                tid:
                  type: string
                  description: The token identifier of the asset to lock (e.g. `native:eth` or `erc20:0x...`).
                amount:
                  type: string
                  pattern: ^\d+$
                  description: The amount to lock, in minimum denomination.
                externalId:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: 'A unique id from your system. Unique per vault among live locks: a replacement lock inherits it, and it cannot be reused by a new lock, even after the lock is deleted.'
                reason:
                  type: string
                  description: An optional reason or note for the lock.
                beneficiary:
                  type: string
                  description: The address on `network` the locked funds are sent to when the owner transfers the lock. Immutable once set; a lock without a beneficiary can only be released.
              required:
              - network
              - tid
              - amount
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultLock'
    get:
      operationId: listVaultLocks
      summary: List Vault Locks
      tags:
      - Vaults
      security:
      - authenticationToken: []
      description: Lists a vault's locks, active and released.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Vaults:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault id.
        required: true
        description: Vault id.
        name: vaultId
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      - schema:
          type: string
        required: false
        name: network
        in: query
      - schema:
          type: string
        required: false
        name: tid
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VaultLock'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /vaults/{vaultId}/transfers:
    post:
      operationId: createVaultTransfer
      summary: Create Vault Transfer
      tags:
      - Vaults
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Creates a transfer out of a vault, reserving the amount and estimated fee from the vault's available balance.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Vaults:Transfers:Create`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault id.
        required: true
        description: Vault id.
        name: vaultId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  type: string
                  enum:
                  - ArbitrumOne
                  - ArbitrumSepolia
                  - Arc
                  - ArcTestnet
                  - Areum
                  - AvalancheC
                  - AvalancheCFuji
                  - Base
                  - BaseSepolia
                  - Berachain
                  - BerachainBepolia
                  - Bitcoin
                  - BitcoinSignet
                  - BitcoinTestnet4
                  - Bob
                  - BobSepolia
                  - Bsc
                  - BscTestnet
                  - Celo
                  - CeloSepolia
                  - Codex
                  - CodexSepolia
                  - Ethereum
                  - EthereumClassic
                  - EthereumClassicMordor
                  - EthereumSepolia
                  - EthereumHoodi
                  - FlareC
                  - FlareCCoston2
                  - FlowEvm
                  - FlowEvmTestnet
                  - Ink
                  - InkSepolia
                  - Monad
                  - MonadTestnet
                  - Optimism
                  - OptimismSepolia
                  - Plasma
                  - PlasmaTestnet
                  - Plume
                  - PlumeSepolia
                  - Polygon
                  - PolygonAmoy
                  - Rayls
                  - RaylsTestnet
                  - Robinhood
                  - RobinhoodSepolia
                  - SeiAtlantic2
                  - SeiPacific1
                  - Solana
                  - SolanaDevnet
                  - Sonic
                  - SonicTestnet
                  - Tempo
                  - TempoModerato
                  - Tsc
                  - TscTestnet1
                  - Xdc
                  - XdcApothem
                  - XLayer
                  - XLayerSepolia
                  description: The network the transfer is on.
                tid:
                  type: string
                  description: The token identifier of the asset to transfer (e.g. `native:eth`, `native:btc`, `native:sol`, or `spl:<mint>`).
                to:
                  type: string
                  description: The destination address.
                amount:
                  type: string
                  pattern: ^\d+$
                  description: The amount to transfer, in minimum denomination.
                externalId:
                  type: string
                  minLength: 1
                  maxLength: 50
                  description: A unique id from your system.
              required:
              - network
              - tid
              - to
              - amount
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRequest'
  /vaults/{vaultId}:
    get:
      operationId: getVault
      summary: Get Vault
      tags:
      - Vaults
      security:
      - authenticationToken: []
      description: Retrieves a Vault by its ID.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Vaults:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: The vault to retrieve.
        required: true
        description: The vault to retrieve.
        name: vaultId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
    put:
      operationId: updateVault
      summary: Update Vault
      tags:
      - Vaults
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Updates an existing Vault.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Vaults:Update`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault id.
        required: true
        description: Vault id.
        name: vaultId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 200
                externalId:
                  type: string
                  maxLength: 100
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vault'
  /vaults/{vaultId}/locks/{lockId}:
    get:
      operationId: getVaultLock
      summary: Get Vault Lock
      tags:
      - Vaults
      security:
      - authenticationToken: []
      description: Retrieves a vault lock by its ID.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Vaults:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault id.
        required: true
        description: Vault id.
        name: vaultId
        in: path
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-lck-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: The lock to retrieve.
        required: true
        description: The lock to retrieve.
        name: lockId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultLock'
  /vaults/{vaultId}/quarantines/{quarantineId}:
    get:
      operationId: getVaultQuarantine
      summary: Get Vault Quarantine
      tags:
      - Vaults
      security:
      - authenticationToken: []
      description: Retrieves a vault quarantine by its ID.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Vaults:Read`: Always required."
      parameters:
      - schema:
          type: string
