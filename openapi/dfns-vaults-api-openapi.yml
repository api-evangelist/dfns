          - Quarantined
          description: Vault balance kind.
        required: false
        description: Vault balance kind.
        name: kind
        in: query
      - schema:
          type: string
        required: false
        name: network
        in: query
      - schema:
          type: string
        required: false
        name: tid
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VaultBalanceEntry'
                  nextPageToken:
                    type: string
                required:
                - items
                additionalProperties: false
  /vaults/{vaultId}/history:
    get:
      operationId: listVaultHistory
      summary: List Vault History
      tags:
      - Vaults
      security:
