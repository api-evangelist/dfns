          minLength: 1
          maxLength: 64
          pattern: ^vlt-qua-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: The quarantine to retrieve.
        required: true
        description: The quarantine to retrieve.
        name: quarantineId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultQuarantine'
  /vaults/{vaultId}/assets:
    get:
      operationId: listVaultAssets
      summary: List Vault Assets
      tags:
      - Vaults
      security:
      - authenticationToken: []
      description: Lists a vault's assets with balances (available/quarantined/locked) and USD valuation.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Vaults:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault id.
        required: true
        description: Vault id.
        name: vaultId
        in: path
      - schema:
          type:
          - boolean
          - 'null'
          default: false
        required: false
        name: showUnverified
        in: query
      - schema:
          type: string
        required: false
        name: network
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/VaultAsset'
                  netWorth:
                    $ref: '#/components/schemas/VaultNetWorth'
                required:
                - items
                - netWorth
                additionalProperties: false
  /vaults/{vaultId}/balances:
