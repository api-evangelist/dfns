    post:
      operationId: transferVaultLock
      summary: Transfer Vault Lock
      tags:
      - Vaults
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Sends part or all of the locked amount to the lock's beneficiary, paying the network fee from the vault's available balance. Owner only, not subject to policies. Returns the outgoing transfer. The funds stay locked while it is in flight; once confirmed the lock is deleted and any unsent remainder returns to the available balance. If the transfer fails the lock stays in place and can be transferred again.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Vaults:Locks:Transfer`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault id.
        required: true
        description: Vault id.
        name: vaultId
        in: path
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-lck-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault lock id.
        required: true
        description: Vault lock id.
        name: lockId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: string
                  pattern: ^\d+$
                  description: The amount to send to the lock's beneficiary, in minimum denomination. At most the locked amount; the unsent remainder returns to the vault's available balance once the transfer is confirmed.
              required:
              - amount
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRequest'
  /vaults/{vaultId}/locks/{lockId}/replace:
    post:
      operationId: replaceVaultLock
      summary: Replace Vault Lock
      tags:
      - Vaults
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Requests replacing a lock with a new lock at a new total amount. Owner only. Executed immediately unless a policy requires approval. On execution the lock is released, a new lock is created at the new amount (carrying over the owner, externalId and reason), and the new lock is returned. If a policy requires approval, responds 202 with the pending replace request instead.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Vaults:Locks:Release`: Always required.   \n`Vaults:Locks:Create`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault id.
        required: true
        description: Vault id.
        name: vaultId
        in: path
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-lck-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault lock id.
        required: true
        description: Vault lock id.
        name: lockId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: string
                  pattern: ^\d+$
                  description: The new total locked amount, in minimum denomination. To release the lock entirely, use DeleteVaultLock instead.
                reason:
                  type: string
                  description: An optional reason or note for the update.
              required:
              - amount
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VaultLock'
