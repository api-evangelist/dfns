openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Signers API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Signers
paths:
  /key-stores/{storeId}/fleet-operations/cancel:
    post:
      operationId: cancelFleetOperation
      summary: Cancel Fleet Operation
      tags:
      - Signers
      security:
      - authenticationToken: []
        userActionSignature: []
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`KeyStores:Instructions:Cancel`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: storeId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupId:
                  type: string
                  minLength: 1
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
              required:
              - groupId
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  groupId:
                    type: string
                  storeId:
                    type: string
                  orgId:
                    type: string
                  status:
                    type: string
                    enum:
                    - Initialized
                    - InReview
                    - Rejected
                    - Approved
                    - Canceled
                  createdBy:
                    type: string
                  submittedBy:
                    type:
                    - string
                    - 'null'
                  dateSubmitted:
                    type:
                    - string
                    - 'null'
                  reviewedBy:
                    type:
                    - string
                    - 'null'
                  dateReviewed:
                    type:
                    - string
                    - 'null'
                  canceledBy:
                    type:
                    - string
                    - 'null'
                  dateCanceled:
                    type:
                    - string
                    - 'null'
                  reason:
                    type:
                    - string
                    - 'null'
                  dateCreated:
                    type: string
                  operations:
                    type: array
                    items:
                      type: object
                      properties:
                        operationId:
                          type: string
                        kind:
                          type: string
                          enum:
                          - Genesis
                          - Clone
                          - AddMacUser
                          - KeyHarvest
                          - AddProvisioner
                        status:
                          type: string
                          enum:
                          - Initialized
                          - InReview
                          - Rejected
                          - Approved
                          - Canceled
                        dateCreated:
                          type: string
                      required:
                      - operationId
                      - kind
                      - status
                      - dateCreated
                required:
                - groupId
                - storeId
                - orgId
                - status
                - createdBy
                - submittedBy
                - dateSubmitted
                - reviewedBy
                - dateReviewed
                - canceledBy
                - dateCanceled
                - reason
                - dateCreated
                - operations
  /key-stores/{storeId}/add-mac-user/input:
    post:
      operationId: createAddMacUserInput
      summary: Create Add Mac User Input
      tags:
      - Signers
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Creates the input archive for an add-mac-user fleet operation, which registers a new Mac operator machine with an HSM in the key store's trust set.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`KeyStores:Instructions:Fleets:Users:Add`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: storeId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - AddMacUser
                macTargetSerial:
                  type: string
                  minLength: 1
                hsmTargetSerial:
                  type: string
                  minLength: 1
              required:
              - kind
              - macTargetSerial
              - hsmTargetSerial
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/zip:
              schema:
                type: string
                description: Zip archive containing `input/input.json`, the add-mac-user fleet-input document.
  /key-stores/{storeId}/add-provisioner/input:
    post:
      operationId: createAddProvisionerInput
      summary: Create Add Provisioner Input
      tags:
      - Signers
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Creates the input archive for an add-provisioner fleet operation, which registers a new provisioner YubiKey into the key store's governance set.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`KeyStores:Instructions:Fleets:Provisioners:Add`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: storeId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - AddProvisioner
                yubikeySerial:
                  type: string
                  minLength: 1
                hsmTargetSerial:
                  type: string
                  minLength: 1
              required:
              - kind
              - yubikeySerial
              - hsmTargetSerial
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/zip:
              schema:
                type: string
                description: Zip archive containing `input/input.json`, the add-provisioner fleet-input document.
  /key-stores/{storeId}/clone/input:
    post:
      operationId: createCloneInput
      summary: Create Clone Input
      tags:
      - Signers
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Creates the input archive for a clone fleet operation, which replicates a key store from a source HSM to a target HSM.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`KeyStores:Instructions:Fleets:Clone`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: storeId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - Clone
                hsmSourceSerial:
                  type: string
                  minLength: 1
                hsmTargetSerial:
                  type: string
                  minLength: 1
                macTargetSerial:
                  type: string
                  minLength: 1
              required:
              - kind
              - hsmSourceSerial
              - hsmTargetSerial
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/zip:
              schema:
                type: string
                description: Zip archive containing `input/input.json`, the clone fleet-input document.
  /key-stores/{storeId}/genesis/input:
    post:
      operationId: createGenesisInput
      summary: Create Genesis Input
      tags:
      - Signers
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Creates the input archive for a genesis fleet operation, which provisions a new offline signer fleet and generates the key store's initial signing keys.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`KeyStores:Instructions:Fleets:Create`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: storeId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - Genesis
                numProvisioners:
                  type: integer
                  minimum: 1
                  maximum: 5
                numOperational:
                  type: integer
                  minimum: 1
                  maximum: 5
                numSecp256k1:
                  type: integer
                  minimum: 0
                  maximum: 2000
                numEd25519:
                  type: integer
                  minimum: 0
                  maximum: 2000
                hsmGenesisSerial:
                  type: string
                  minLength: 1
                macGenesisSerial:
                  type: string
                  minLength: 1
                hsmGenesisFirmwareVersion:
                  type: string
                  enum:
                  - '2.4'
                debugOptions:
                  type: object
                  additionalProperties: {}
                  description: 'Development environments only (rejected with a 400 in production). Deep-merged over the generated genesis `options` block: objects merge recursively, any other value (including new fields and type changes) replaces the existing value.'
              required:
              - kind
              - numProvisioners
              - numOperational
              - numSecp256k1
              - numEd25519
              - hsmGenesisSerial
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/zip:
              schema:
                type: string
                description: Zip archive containing `input/input.json`, the genesis fleet-input document.
  /key-stores/{storeId}/key-harvest/input:
    post:
      operationId: createKeyHarvestInput
      summary: Create Key Harvest Input
      tags:
      - Signers
      security:
      - authenticationToken: []
        userActionSignature: []
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`KeyStores:Instructions:Fleets:Keys:Harvest`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: storeId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - KeyHarvest
                hsmTargetSerial:
                  type: string
                  minLength: 1
                macTargetSerial:
                  type: string
                  minLength: 1
                macTargetUsername:
                  type: string
                  minLength: 1
                numSecp256k1:
                  type: integer
                  minimum: 0
                  maximum: 2000
                numEd25519:
                  type: integer
                  minimum: 0
                  maximum: 2000
              required:
              - kind
              - hsmTargetSerial
              - macTargetSerial
              - macTargetUsername
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/zip:
              schema:
                type: string
                description: Zip archive containing `input/input.json`, the key-harvest fleet-input document.
  /key-stores/{storeId}/onchain-sign/input:
    post:
      operationId: createOnchainSignInput
      summary: Create Onchain Sign Input
      tags:
      - Signers
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Creates the input archive for an onchain-sign operation covering the key store's pending signature requests.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`KeyStores:Instructions:Keys:Sign`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: storeId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/zip:
              schema:
                type: string
                description: Zip archive containing `input/input.json` and `input-annex/keys.jsonl` for the onchain-sign roundtrip.
  /key-stores/{storeId}/proof-of-control/input:
    post:
      operationId: createProofOfControlInput
      summary: Create Proof Of Control Input
      tags:
      - Signers
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Creates the input archive for a proof-of-control operation covering the keys of the specified wallets.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`KeyStores:Instructions:Keys:ProveControl`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: storeId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                walletIds:
                  type: array
                  items:
                    type: string
                    minLength: 1
                  minItems: 1
                  maxItems: 100
              required:
              - walletIds
      responses:
        '200':
          description: Success
          content:
            application/zip:
              schema:
                type: string
                description: Zip archive containing `input/input.json` (proof of control spec) and `input-annex/wrapped-keystore.jsonl` (one key per line).
  /key-stores:
    get:
      operationId: listKeyStores
      summary: List Key Stores
      tags:
      - Signers
      security:
      - authenticationToken: []
      description: Lists the key stores of your organization.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`KeyStores:Read`: Always required."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        kind:
                          type: string
                          enum:
                          - Hsm
                          - Mpc
                          - OfflineSigner
                        name:
                          type: string
                        primary:
                          type: boolean
                      required:
                      - id
                      - kind
                      - primary
                required:
                - items
  /signers:
    get:
      operationId: listSigners
      summary: List Signers
      tags:
      - Signers
      security:
      - authenticationToken: []
      description: Lists the signer clusters of your key store, including each signer's ID and encryption public key.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`KeyStores:Read`: Always required."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  clusters:
                    type: array
                    items:
                      type: object
                      properties:
                        clusterId:
                          type: string
                        signers:
                          type: array
                          items:
                            type: object
                            properties:
                              signerId:
                                type: string
                              encryptionKey:
                                type: string
                            required:
                            - signerId
                            - encryptionKey
                      required:
                      - clusterId
                      - signers
                required:
                - clusters
  /key-stores/{storeId}/add-mac-user/output:
    post:
      operationId: submitAddMacUserOutput
      summary: Submit Add Mac User Output
      tags:
      - Signers
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Submits the output archive produced by the offline signer fleet for an add-mac-user operation.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`KeyStores:Instructions:Fleets:Users:Add`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: storeId
        in: path
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    fileChecksum:
                      type: string
                      pattern: ^[a-f0-9]{64}$
                    outputJson:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - fleet-output
                        version:
                          type: number
                          enum:
                          - 1
                        status:
                          type: string
                          enum:
                          - success
                        org_id:
                          type: string
                          minLength: 1
                        fleet_id:
                          type: string
                          minLength: 1
                        fleet_label:
                          type: string
                          minLength: 1
                        keystore_id:
                          type: string
                          minLength: 1
                        group_id:
                          type: string
                          minLength: 1
                        online_domain:
                          type: string
                          minLength: 1
                        governance:
                          type: object
                          additionalProperties: {}
                        outputs:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              success:
                                oneOf:
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - genesis-registration
                                    ceremony_mode:
                                      type: string
                                      minLength: 1
                                    hsm_serial:
                                      type: string
                                      minLength: 1
                                    hsm_identity_key:
                                      type: string
                                      pattern: ^[a-f0-9]+$
                                    mac_serial:
                                      type: string
                                      minLength: 1
                                    mac_se_wrap_key_pub_key:
                                      type: string
                                      minLength: 1
                                    provisioners:
                                      type: object
                                      additionalProperties:
                                        type: string
                                    hsm_sealed: {}
                                    key_harvest:
                                      type: object
                                      properties:
                                        ed25519-start:
                                          type: integer
                                          minimum: 0
                                        ed25519:
                                          type: integer
                                          minimum: 0
                                        error:
                                          type:
                                          - string
                                          - 'null'
                                        secp256k1-start:
                                          type: integer
                                          minimum: 0
                                        secp256k1:
                                          type: integer
                                          minimum: 0
                                      required:
                                      - ed25519-start
                                      - ed25519
                                      - error
                                      - secp256k1-start
                                      - secp256k1
                                  required:
                                  - type
                                  - hsm_serial
                                  - hsm_identity_key
                                  - mac_serial
                                  - mac_se_wrap_key_pub_key
                                  - provisioners
                                  - key_harvest
                                  title: Genesis Registration
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - clone-registration
                                    ceremony_mode:
                                      type: string
                                      minLength: 1
                                    hsm_target_serial:
                                      type: string
                                      minLength: 1
                                    hsm_identity_key:
                                      type: string
                                      pattern: ^[a-f0-9]+$
                                    mac_target_serial:
                                      type: string
                                      minLength: 1
                                    mac_se_wrap_key_pub_key:
                                      type: string
                                      minLength: 1
                                    hsm_sealed: {}
                                  required:
                                  - type
                                  - hsm_target_serial
                                  - hsm_identity_key
                                  - mac_target_serial
                                  - mac_se_wrap_key_pub_key
                                  title: Clone Registration
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - add-mac-user
                                    ceremony_mode:
                                      type: string
                                      minLength: 1
                                    hsm_target_serial:
                                      type: string
                                      minLength: 1
                                    hsm_identity_key:
                                      type: string
                                      pattern: ^[a-f0-9]+$
                                    mac_target_serial:
                                      type: string
                                      minLength: 1
                                    mac_username:
                                      type: string
                                      minLength: 1
                                    mac_se_wrap_key_pub_key:
                                      type: string
                                      minLength: 1
                                    hsm_sealed: {}
                                  required:
                                  - type
                                  - hsm_target_serial
                                  - hsm_identity_key
                                  - mac_target_serial
                                  - mac_se_wrap_key_pub_key
                                  title: Add Mac User Registration
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - add-provisioner
                                    ceremony_mode:
                                      type: string
                                      minLength: 1
                                    provisioner_label:
                                      type: string
                                      minLength: 1
                                    provisioner_public_key_hex:
                                      type: string
                                      pattern: ^[a-f0-9]+$
                                    yubikey_serial:
                                      type: string
                                      minLength: 1
                                  required:
                                  - type
                                  - provisioner_label
                                  - provisioner_public_key_hex
                                  - yubikey_serial
                                  title: Add Provisioner Registration
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - key-harvest
                                    hsm_target_serial:
                                      type: string
                                      minLength: 1
                                    mac_target_serial:
                                      type: string
                                      minLength: 1
                                    mac_target_username:
                                      type: string
                                      minLength: 1
                                    key_harvest:
                                      type: object
                                      properties:
                                        secp256k1:
                                          type: integer
                                          minimum: 1
                                        secp256k1_end:
                                          type: integer
                                          minimum: 0
                                        ed25519:
                                          type: integer
                                          minimum: 1
                                        ed25519_end:
                                          type: integer
                                          minimum: 0
                                  required:
                                  - type
                                  - hsm_target_serial
                                  - mac_target_serial
                                  - mac_target_username
                                  - key_harvest
                                  title: Key Harvest Registration
                            required:
                            - success
                      required:
                      - type
                      - version
                      - status
                      - org_id
                      - fleet_id
                      - fleet_label
                      - keystore_id
                      - group_id
                      - online_domain
                      - outputs
                  required:
                  - fileChecksum
                  - outputJson
                file:
                  type: string
                  format: binary
              required:
              - data
              - file
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                required:
                - message
  /key-stores/{storeId}/add-provisioner/output:
    post:
      operationId: submitAddProvisionerOutput
      summary: Submit Add Provisioner Output
      tags:
      - Signers
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Submits the output archive produced by the offline signer fleet for an add-provisioner operation.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`KeyStores:Instructions:Fleets:Provisioners:Add`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: storeId
        in: path
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    fileChecksum:
                      type: string
                      pattern: ^[a-f0-9]{64}$
                    outputJson:
                      type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - fleet-output
                        version:
                          type: number
                          enum:
                          - 1
                        status:
                          type: string
                          enum:
                          - success
                        org_id:
                          type: string
                          minLength: 1
                        fleet_id:
                          type: string
                          minLength: 1
                        fleet_label:
                          type: string
                          minLength: 1
                        keystore_id:
                          type: string
                          minLength: 1
                        group_id:
                          type: string
                          minLength: 1
                        online_domain:
                          type: string
                          minLength: 1
                        governance:
                          type: object
                          additionalProperties: {}
                        outputs:
                          type: object
                          additionalProperties:
                            type: object
                            properties:
                              success:
                                oneOf:
                                - type: object
                                  properties:
                                    type:
                                      type: string
                                      enum:
                                      - genesis-registration
                                    ceremony_mode:
                                      type: string
                                      minLength: 1
                                    hsm_serial:
                                      type: string
                                      minLength: 1
                                    hsm_identity_key:
                                      type: string
                                      pattern: ^[a-f0-9]+$
                                    mac_serial:
                                      type: string
                                      minLength: 1
                                    mac_se_wrap_key_pub_key:
                                      type: string
                                      minLength: 1
                                    provisioners:
                                      type: object
                                      additionalProperties:
                                        type: string
                                    hsm_sealed: {}
                                    key_harvest:
                                      type: object
                                      properties:
