    post:
      operationId: transferAsset
      summary: Transfer Asset
      tags:
      - Wallets
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Transfer an asset out of the specified wallet to a destination address.

        For all fungible token transfers, the transfer amount must be specified in the minimum denomination of that token.

        For example, use the amount in Satoshi for a Bitcoin transfer, or the amount in Wei for an Ethereum transfer etc.


        See the different options in the Body description below. You can also select your kind of transfers in the payload examples in the different languages.


        Binance chains users can use ERC transfers for BEP tokens and Native transfers for BNB.


        Some blockchains may require additional steps before the transfer can be completed, such as creating a destination account (e.g., Stellar). Please refer to the specific blockchain documentation for any prerequisites or additional requirements.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Wallets:Transfers:Create`: Always required   \n`FeeSponsors:Use`: Required if `feeSponsorId` is specified."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: The source wallet id (`wa-...`).
        required: true
        description: The source wallet id (`wa-...`).
        name: walletId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - Native
                  to:
                    type: string
                    description: The destination address.
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: The amount of native tokens to transfer in minimum denomination.
                  memo:
                    anyOf:
                    - type: string
                      maxLength: 64
                      pattern: ^[a-zA-Z0-9]+$
                    - type: string
                      enum:
                      - ''
                    description: The memo or destination tag (supported networks only).
                  priority:
                    type: string
                    enum:
                    - Slow
                    - Standard
                    - Fast
                    description: The priority that determines the fees paid for the transfer. All EVM compatible networks and Bitcoin support `priority`. Not supported for other networks. It uses the [estimate fees](https://docs.dfns.co/api-reference/networks/estimate-fees) API to calculate the transfer fees. When not specified, defaults to `Standard` priority.
                  createDestinationAccount:
                    type: boolean
                    description: Whether to create the destination account on chains that require account creation (e.g., Stellar). Only valid for chains that require the receiver account to exist before transfer.
                  offer:
                    type: boolean
                    description: Optional field for Canton, if true it will create a transfer offer.
                  expiresAt:
                    type: string
                    format: date-time
                    description: Optional field for Canton, especially useful in the context of offers
                  useDurableNonce:
                    type: boolean
                    description: 'Optional Solana-only flag. When `true` the SOL transfer is built as a durable-nonce transaction using one of the wallet''s nonce accounts (picked server-side). Use this for offline-signing flows where the construct → broadcast gap may exceed 90 seconds. The wallet''s nonce account pool must be pre-populated via `POST /wallets/{id}/transactions` with `kind: CreateSolanaNonceAccounts`.'
                  externalId:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: A unique ID from your system. It can be leveraged to be used as an idempotency key. (read more [here](https://docs.dfns.co/api-reference/idempotency))
                  travelRule:
                    oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Notabene
                        beneficiaryVASPdid:
                          type: string
                        beneficiaryProof:
                          type: object
                          additionalProperties: {}
                        originator:
                          type: object
                          additionalProperties: {}
                        beneficiary:
                          type: object
