openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Wallets API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Wallets
paths:
  /wallets/{walletId}/transactions/{transactionId}/abort:
    put:
      operationId: abortTransaction
      summary: Abort Transaction
      tags:
      - Wallets
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Aborts a transaction that is currently in ''Executing'' status and has not yet been signed. Sets the transaction status to ''Failed'' and removes it from the retry queue.


        This is useful when a transaction is stuck in the execution pipeline (e.g., during construct or sign phase) and you want to abort it without waiting for it to fail on its own.


        Unlike cancel, which creates a replacement on-chain transaction, abort simply marks the transaction as failed without any blockchain interaction.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Wallets:Transactions:Abort`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Wallet id.
        required: true
        description: Wallet id.
        name: walletId
        in: path
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Transaction id.
        required: true
        description: Transaction id.
        name: transactionId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRequest'
  /wallets/{walletId}/transfers/{transferId}/abort:
    put:
      operationId: abortTransfer
      summary: Abort Transfer
      tags:
      - Wallets
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Aborts a transfer that is currently in ''Executing'' status and has not yet been signed. Sets the transfer status to ''Failed'' and removes it from the retry queue.


        This is useful when a transfer is stuck in the execution pipeline (e.g., during construct or sign phase) and you want to abort it without waiting for it to fail on its own.


        Unlike cancel, which creates a replacement on-chain transaction, abort simply marks the transfer as failed without any blockchain interaction.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Wallets:Transfers:Abort`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Wallet id.
        required: true
        description: Wallet id.
        name: walletId
        in: path
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Transfer id.
        required: true
        description: Transfer id.
        name: transferId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransferRequest'
  /wallets/{walletId}/activate:
    post:
      operationId: activateWallet
      summary: Activate Wallet
      tags:
      - Wallets
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Activates a wallet by deploying the account contract on-chain, making it ready for transactions.


        This operation is required for wallets on networks where you need to explicitly activate your account on-chain

        before it can be used for transactions.


        - **Starknet**: Deploys the account contract using the wallet''s public key to initialize the account on the blockchain. No additional parameters required.

        - **Concordium**: Deploys the account using credential deployment information and cryptographic randomness returned by the IDApp.

        - **Canton**: Registers the wallet on a validator. You must specify the `validatorId` to activate the wallet. Before activation, the wallet cannot be used and its address will not have a prefix.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Wallets:Create`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Wallet id.
        required: true
        description: Wallet id.
        name: walletId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                properties: {}
                additionalProperties: false
                description: 'Starknet: No parameters required.'
              - type: object
                properties:
                  expiry:
                    type: number
                    description: Expiry timestamp of the Credential Deployment
                  unsignedCdiStr:
                    type: string
                    description: Unsigned Credential Deployment to sign
                required:
                - expiry
                - unsignedCdiStr
                description: "The full credential deployment request object returned by the Concordium IdApp.\n    Please see the example in dfns-sdk-ts on how to retrieve the CredentialDeploymentTx and activate a Concordium wallet.\n    (https://github.com/dfns/dfns-sdk-ts/tree/m/examples/libs/concordium)\n    "
              - type: object
                properties:
                  validatorId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^cv-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the validator on which the wallet is created for Canton networks
                    example: cv-7jeof-m584r-p35ucm37ko3cqgts
                required:
                - validatorId
                additionalProperties: false
            examples:
              Starknet Activation:
                value: {}
              Concordium Activation:
                value:
                  expiry: 1698768000
                  unsignedCdiStr: '{"proofs":{"challenge":"...","commitments":"..."},"ipIdentity":0,"credentialPublicKeys":{"threshold":1,"keys":{"0":{"schemeId":"Ed25519","verifyKey":"..."}}},"policy":{"validTo":"202412","createdAt":"202410","revealedAttributes":{}},"credId":"...","revocationThreshold":1,"arData":{"0":{"encIdCredPubShare":"..."}}}'
              Canton Activation:
                value:
                  validatorId: cv-12o3k-t44tq-9ecb13hivsksiafg
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionRequest'
  /wallets/bulk-create:
    post:
      operationId: bulkCreateWallets
      summary: Bulk Create Wallets
      tags:
      - Wallets
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Creates a batch of custodial wallets asynchronously via HD key derivation. Returns a job handle immediately; poll the bulk-create job endpoints for progress.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Wallets:Create`: Always required   \n`Keys:Create`: Always required. Bulk creation always creates a new master [Key entity](https://docs.dfns.co/api-reference/keys) for the batch.   \n`Wallets:Tags:Add`: Required if `tags` are specified."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  $ref: '#/components/schemas/BulkWalletNetwork'
                count:
                  type: integer
                  minimum: 1
                  maximum: 1000000
                  description: Number of wallets to create in the batch (1 to 1000000).
                name:
                  type: string
                  minLength: 1
                  maxLength: 94
                  description: Required name prefix shared by every wallet in the batch; wallet at index N is named `${name}${N}`.
                tags:
                  type: array
                  items:
                    type: string
                    pattern: ^[a-zA-Z0-9_.:/+-]{1,100}$
                    description: Wallet Tag.
                  maxItems: 10
                  description: List of tags applied to every wallet in the batch. If specified, requires the `Wallets:Tags:Add` permission.
                keystoreId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^store-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                  description: Key store to mint the batch master key in. Defaults to your organization primary store.
                  example: store-425nf-ebf0a-qq22t6qra51tj8j0
              required:
              - network
              - count
              - name
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkWalletCreationJobHandle'
    get:
      operationId: listBulkWalletJobs
      summary: List Bulk Wallet Jobs
      tags:
      - Wallets
      security:
      - authenticationToken: []
      description: List the org bulk wallet creation jobs, most recent first, with progress and status.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Wallets:Read`: Always required."
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      - schema:
          type: string
          enum:
          - Pending
          - InProgress
          - Completed
          - PartiallyCompleted
          - Failed
          description: Filter jobs by status.
        required: false
        description: Filter jobs by status.
        name: status
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/BulkWalletCreationJob'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /wallets/bulk-create/{jobId}:
    get:
      operationId: getBulkWalletJob
      summary: Get Bulk Wallet Job
      tags:
      - Wallets
      security:
      - authenticationToken: []
      description: Retrieve a single bulk wallet creation job by its ID, with progress and status.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Wallets:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^bwc-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: The bulk wallet creation job to retrieve.
        required: true
        description: The bulk wallet creation job to retrieve.
        name: jobId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkWalletCreationJob'
  /wallets/bulk-create/{jobId}/wallets:
    get:
      operationId: listBulkWalletJobWallets
      summary: List Bulk Wallet Job Wallets
      tags:
      - Wallets
      security:
      - authenticationToken: []
      description: List every wallet created by a bulk wallet creation job, ordered by wallet ID and paginated. Only available once the job has completed.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Wallets:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^bwc-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: The bulk wallet creation job whose wallets to list.
        required: true
        description: The bulk wallet creation job whose wallets to list.
        name: jobId
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 2000
          default: 500
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Wallet'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /wallets/{walletId}/transactions:
    post:
      operationId: signAndBroadcastTransaction
      summary: Sign and Broadcast Transaction
      tags:
      - Wallets
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Sign & Broadcast transaction enables communication with any arbitrary smart contract of the target blockchain. You can construct a transaction that performs a complex task and this endpoint will sign the transaction, add the signature and broadcast it to chain. It can be used to call smart contract functions like mint tokens and even deploy new smart contracts.


        | Status | Definition |

        |-------------|-------------------------------------------------------------------------------------------------------------------------------------------------|

        | Pending | The request is pending approval due to a policy applied to the wallet. |

        | Executing | The request is approved and is in the process of being executed. note this status is only set for a short time between pending and broadcasted. |

        | Broadcasted | The transaction has been successfully written to the mempool. |

        | Confirmed | The transaction has been confirmed on-chain by our indexing pipeline. |

        | Failed | Indicates either a system failure to complete the request or the transaction failed on chain. |

        | Rejected | The request has been rejected by a policy approval action. |


        for reading from a "view" function on EVM chains, please use Read Contract endpoint.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Wallets:Transactions:Create`: Always required   \n`FeeSponsors:Use`: Required if `feeSponsorId` is specified."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Wallet id.
        required: true
        description: Wallet id.
        name: walletId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - Transaction
                  transaction:
                    anyOf:
                    - type: string
                      pattern: ^(0x)?([0-9a-fA-F][0-9a-fA-F])*$
                    - type: object
                      properties: {}
                    description: A JSON transaction object (recommended for EVM and other compatible networks) or an unsigned hex-encoded transaction.
                  externalId:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: A unique ID from your system. It can be leveraged to be used as an idempotency key (read more [here](https://docs.dfns.co/api-reference/idempotency)).
                required:
                - kind
                - transaction
                additionalProperties: false
                description: "Signs an unsigned transaction and broadcasts it to chain. This is the recommended transaction `kind` for EVM networks — use it instead of the deprecated `Evm` and `Eip1559` kinds. It accepts a JSON transaction object (type 0 legacy, 2 EIP-1559, or 4 EIP-7702) as well as a hex-encoded raw transaction.\nFor EVM transactions, you may use JSON objects:\n\n| Field                | Description                                                                                                                                                                                                                         | Type - Optional              |\n|----------------------|-------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------|------------------------------|\n| type                 | Ethereum transaction type. 0 for legacy transaction; 2 for EIP-1559 transaction; 4 for EIP-7702 transaction. Default is 2 if undefined.                                                                                             | Integer (optional)           |\n| to                   | The destination address or target contract. Leave undefined when the transaction is a contract deployment.                                                                                                                          | String (optional)            |\n| value                | The amount of native tokens to transfer in minimum denomination.                                                                                                                                                                    | String (optional)            |\n| data                 | ABI encoded function call data in hex format. Can also be the encoded smart contract data when the transaction is a contract deployment.                                                                                            | String (optional)            |\n| nonce                | The transaction number to guarantee idempotency. If omitted, it will be provided automatically. Note the same nonce can be submitted multiple times with a higher maxFeePerGas to \"overwrite\" existing transactions in the mempool. | Integer or String (optional) |\n| gasLimit             | The maximum amount of gas that can be spent for executing the transaction. If omitted, it will be calculated automatically.                                                                                                         | String (optional)            |\n| gasPrice             | The amount of per unit gas. Only valid for a type 0 legacy transaction. If omitted, it will be calculated automatically.                                                                                                            | String (optional)            |\n| maxFeePerGas         | The maximum amount of per unit gas willing to be paid for the transaction. Valid for type 2 and type 4 transactions. If omitted, it will be calculated automatically.                                                               | String (optional)            |\n| maxPriorityFeePerGas | The maximum amount of per unit gas to be included as a tip to the validator. Valid for type 2 and type 4 transactions. If omitted, it will be calculated automatically.                                                             | String (optional)            |\n| authorizationList    | A list that indicates what code the signer of each authorization desires to execute in the context of their EOA. Only valid for type 4 transaction.                                                                                 | Authorization (optional)     |\n\nFor Starknet transactions, you may use invocation request objects (https://github.com/starkware-libs/starknet-specs/blob/v0.8.1/api/starknet_api_openrpc.json#L2621):\n\n| Field                         | Description                                                                                         | Type - Optional                  |\n|-------------------------------|-----------------------------------------------------------------------------------------------------|----------------------------------|\n| calldata                      | **Array** of encoded function call parameters                                                       | **Array of Strings** (required)  |\n| nonce                         | Transaction nonce in hex format                                                                     | String (required)                |\n| version                       | Transaction version in hex format. Typically \"0x3\" for current transactions                         | String (required)                |\n| resourceBounds                | Gas bounds for L1, L2, and L1 data gas                                                              | Object (required)                |\n| ↳ resourceBounds.l1Gas        | L1 gas configuration with maxAmount and maxPricePerUnit                                             | Object (required)                |\n| ↳ resourceBounds.l2Gas        | L2 gas configuration with maxAmount and maxPricePerUnit                                             | Object (required)                |\n| ↳ resourceBounds.l1DataGas    | L1 data gas configuration with maxAmount and maxPricePerUnit                                        | Object (required)                |\n| tip                           | Transaction tip in hex format. Typically \"0x0\"                                                      | String (required)                |\n| paymasterData                 | Paymaster data array                                                                                | Array of Strings (required)      |\n| accountDeploymentData         | Account deployment data array                                                                       | Array of Strings (required)      |\n| nonceDataAvailabilityMode     | Data availability mode for nonce. Typically \"L1\" for now                                            | String (required)                |\n| feeDataAvailabilityMode       | Data availability mode for fee. Typically \"L1\" for now                                              | String (required)                |\n\nFor Concordium transactions, you may use JSON objects (from https://github.com/Concordium/concordium-node-sdk-js/blob/sdk/12.0.0-alpha.3/packages/sdk/src/transactions/Transaction.ts#L102)\n\n| Field                            | Description                                                                                                                                                  | Type - Optional\n|----------------------------------|--------------------------------------------------------------------------------------------------------------------------------------------------------------|---------------------------------|\n| Header                           | Transaction header for the intermediary state of account transactions, i.e. prior to being signing.                                                          | Object (required)               |\n| ↳ Header.executionEnergyAmount   | The destination address or target contract. Leave undefined when the transaction is a contract deployment.                                                   | String/Number/BigInt (required) |\n| ↳ Header.numSignatures           | The number of signatures the transaction can hold. If \"undefined\", this will be defined at the time of signing                                               | Integer (optional)              |\n| ↳ Header.sender                  | The account address that is source of this transaction                                                                                                       | String (optional)               |\n| ↳ Header.nonce                   | The account nonce                                                                                                                                            | String/Number/BigInt (optional) |\n| ↳ Header.expiry                  | expiration of the transaction                                                                                                                                | Integer (optional)              |\n| Payload                          | The transaction account payload in JSON format (https://github.com/Concordium/concordium-node-sdk-js/blob/main/packages/sdk/src/accountTransactions.ts#L646) | Object (required)               |\n\n\n\n```json\n{\n  \"kind\": \"Transaction\",\n  \"transaction\": {\n    \"to\": \"0x00fb58432ef9d418bf6688bcf0a226d2fcaa18e2\",\n    \"data\": \"0x40d097c3000000000000000000000000d2f77f85a50cdd650ca562f3a180284e1d5b4934\",\n    \"maxFeePerGas\": \"1626000000000\",\n    \"maxPriorityFeePerGas\": \"1332000000000\"\n  }\n}\n```\n\n```json\n{\n  \"kind\": \"Transaction\",\n  \"transaction\": {\n    \"type\": \"INVOKE\",\n    \"calldata\": [\n      \"1\",\n      \"2009894490435840142178314390393166646092438090257831307886760648929397478285\",\n      \"232670485425082704932579856502088130646006032362877466777181098476241604910\",\n      \"3\",\n      \"296727860213112272332383824629975240127004024814636931420022890499591637514\",\n      \"1\",\n      \"0\"\n    ],\n    \"nonce\": \"0x51\",\n    \"version\": \"0x3\",\n    \"resourceBounds\": {\n      \"l1Gas\": { \"maxAmount\": \"0x0\", \"maxPricePerUnit\": \"0x239a01ff6e6c\" },\n      \"l2Gas\": { \"maxAmount\": \"0x1694a0\", \"maxPricePerUnit\": \"0x10c388d00\" },\n      \"l1DataGas\": { \"maxAmount\": \"0x120\", \"maxPricePerUnit\": \"0x98e8\" }\n    },\n    \"tip\": \"0x0\",\n    \"paymasterData\": [],\n    \"accountDeploymentData\": [],\n    \"nonceDataAvailabilityMode\": \"L1\",\n    \"feeDataAvailabilityMode\": \"L1\",\n  }\n}\n```\n\n```json\n{\n  \"kind\": \"Transaction\",\n  \"transaction\": {\n    \"header\": {\n      \"sender\": undefined,\n      \"nonce\": undefined,\n      \"expiry\": undefined,\n      \"executionEnergyAmount\": 300\n    },\n    \"payload\": {\n      \"type\": \"transferWithMemo\",\n      \"toAddress\": \"4HhAcToZs6rtxGcgsBRS3VcjeAECPTTSTFVUKS6rBSVEZAPL6d\",\n      \"memo\": \"000968656c6c6f20636364\",\n      \"amount\": \"1\"\n    }\n  }\n}\n```\n"
                title: Transaction
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - Psbt
                  psbt:
                    type: string
                    pattern: ^(0x)?([0-9a-fA-F][0-9a-fA-F])*$
                    description: The hex encoded PSBT.
                  externalId:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: A unique ID from your system. It can be leveraged to be used as an idempotency key (read more [here](https://docs.dfns.co/api-reference/idempotency)).
                required:
                - kind
                - psbt
                additionalProperties: false
                description: Signs a partially signed Bitcoin / Litecoin transaction.
                title: PSBT
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - SignDocDirect
                  signDoc:
                    type: string
                    pattern: ^(0x)?([0-9a-fA-F][0-9a-fA-F])*$
                  externalId:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: A unique ID from your system. It can be leveraged to be used as an idempotency key (read more [here](https://docs.dfns.co/api-reference/idempotency)).
                required:
                - kind
                - signDoc
                additionalProperties: false
                description: Signs an unsigned transaction using [sign mode direct](https://docs.cosmos.network/main/learn/advanced/transactions#sign_mode_direct-preferred).
                title: SignDocDirect
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - UserOperations
                  userOperations:
                    type: array
                    items:
                      type: object
                      properties:
                        to:
                          type: string
                          pattern: ^0x[0-9a-fA-F]{40}$
                          description: The destination address or target contract.
                        value:
                          type: string
                          pattern: ^\d+$
                          description: The amount of native tokens to transfer in minimum denomination.
                        data:
                          type: string
                          pattern: ^(0x)?([0-9a-fA-F][0-9a-fA-F])*$
                          description: ABI encoded function call data in hex format.
                      required:
                      - to
                  feeSponsorId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^fs-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: A fee sponsor id to sponsor the transaction fee by another wallet. (read more [here](https://docs.dfns.co/features/fee-sponsors))
                    example: fs-5vqdl-gliqk-b4rfukqauov1sp7j
                  externalId:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: A unique ID from your system. It can be leveraged to be used as an idempotency key (read more [here](https://docs.dfns.co/api-reference/idempotency)).
                required:
                - kind
                - userOperations
                - feeSponsorId
                additionalProperties: false
                description: 'Signs one or more user operations and broadcasts to chain using a sponsored transaction. Used for invoking arbitrary smart contract calls, including batch operations, with a [fee sponsor](https://docs.dfns.co/features/fee-sponsors).


                  Can only be used with a fee sponsor. Unsponsored user operations are not supported.'
                title: EVM Sponsored transaction
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - FunctionCall
                  call:
                    type: object
                    properties: {}
                    description: Function call arguments
                  externalId:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: A unique ID from your system. It can be leveraged to be used as an idempotency key (read more [here](https://docs.dfns.co/api-reference/idempotency)).
                required:
                - kind
                - call
                additionalProperties: false
                description: Calls an on-chain function that mutates state.
                title: Function Call
