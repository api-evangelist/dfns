                - type: object
                  properties:
                    kind:
                      type: string
                      enum:
                      - Sumsub
                    ivms101:
                      type: object
                      properties:
                        version:
                          type: string
                          enum:
                          - IVMS101.2023
                          description: IVMS101 payload version. Must be `IVMS101.2023`.
                        data:
