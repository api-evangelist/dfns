              externalId:
                type: string
                minLength: 1
                maxLength: 50
                description: A unique ID from your system. It can be leveraged to be used as an idempotency key. (read more [here](https://docs.dfns.co/api-reference/idempotency))
              travelRule:
                oneOf:
                - type: object
                  properties:
                    kind:
                      type: string
                      enum:
                      - Notabene
                    beneficiaryVASPdid:
                      type: string
                    beneficiaryProof:
                      type: object
                      additionalProperties: {}
                    originator:
                      type: object
                      additionalProperties: {}
                    beneficiary:
                      type: object
