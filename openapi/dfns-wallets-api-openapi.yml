    Requester:
      type: object
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^us-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User id.
          example: us-6b58p-r53sr-rlrd3l5cj3uc4ome
        tokenId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^to-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Token id.
          example: to-202a0-cdo33-o65mbt6q758lvvnt
      required:
      - userId
      description: The user who initiated the request.
    KeyCurve:
      type: string
      enum:
      - ed25519
      - secp256k1
      - stark
      description: The elliptic curve for the key.
    AddressWatchNetwork:
      type: string
      description: Network the address is watched on.
      title: Network
      enum:
      - ArbitrumOne
      - ArbitrumSepolia
      - Arc
