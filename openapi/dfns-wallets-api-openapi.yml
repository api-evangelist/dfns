              Ethereum:
                value:
                  network: Ethereum
                  name: trading hot wallet
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Wallet'
                - additionalProperties: false
