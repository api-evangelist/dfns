                      type: object
                      additionalProperties: {}
                    beneficiary:
                      type: object
                      additionalProperties: {}
                  required:
                  - kind
                  - originator
                  - beneficiary
                  additionalProperties: false
                  title: Notabene Travel Rule
                - type: object
                  properties:
                    kind:
                      type: string
                      enum:
                      - Sumsub
                    ivms101:
                      type: object
                      properties:
                        version:
                          type: string
                          enum:
                          - IVMS101.2023
                          description: IVMS101 payload version. Must be `IVMS101.2023`.
                        data:
                          type: string
                          minLength: 1
                          description: Originator and beneficiary IVMS101 data, JWS-signed then JWE-encrypted (compact serialization) with the Sumsub public key. Retrieve the key from the Sumsub travel rule public key endpoint. Dfns never decrypts this value.
                        filledFields:
                          type: array
                          items:
                            type: string
                            minLength: 1
                          description: IVMS101 field paths present in `data`, e.g. `Originator.originatorPersons[].naturalPerson.name`.
                      required:
                      - version
                      - data
                      - filledFields
                      additionalProperties: false
                    beneficiaryVaspId:
                      type: string
                      minLength: 1
                      description: Sumsub id of the beneficiary VASP, for a transfer to a hosted (custodial) wallet. Set exactly one of `beneficiaryVaspId` or `beneficiaryWalletType`.
                    beneficiaryWalletType:
                      type: string
                      enum:
                      - unhosted
                      description: Set to `unhosted` for a transfer to a self-custody wallet, which skips VASP attribution. Set exactly one of `beneficiaryVaspId` or `beneficiaryWalletType`.
                  required:
                  - kind
                  - ivms101
                  additionalProperties: false
                  title: Sumsub Travel Rule
                description: A travel rule payload to associate with the transfer. (read more [here](https://docs.dfns.co/features/travel-rule))
              feeSponsorId:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^fs-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                description: Id of the fee sponsor that will be used to pay for your transfer fees, it might not be available for all blockchains. (read more [here](https://docs.dfns.co/features/fee-sponsors))
                example: fs-5vqdl-gliqk-b4rfukqauov1sp7j
            required:
            - kind
            - issuanceId
            - to
            - amount
            additionalProperties: false
            description: Transfer XRPL XLS-33 Token with specified issuance ID. (https://xrpl.org/docs/concepts/tokens/fungible-tokens/multi-purpose-tokens
            title: XRPL XLS-33 Token
        metadata:
          type: object
          properties:
            asset:
              type: object
              properties:
                symbol:
                  type: string
                decimals:
                  type: integer
                  description: Number of decimals used by the asset, see [this guide](https://docs.dfns.co/guides/developers/displaying-balances) for more details.
                verified:
                  type: boolean
                  description: Whether the asset is verified by DFNS as legitimate.
                quotes:
                  type: object
                  properties:
                    EUR:
                      type: number
                    USD:
                      type: number
                  description: Corresponding asset price in USD at the time of transfer.
          required:
          - asset
          description: Additional metadata about the transfered asset.
        status:
          type: string
          enum:
          - Pending
          - Executing
          - Broadcasted
          - Confirmed
          - Failed
          - Rejected
          description: 'Transfer status.


            | Status | Definition |

            | --- | --- |

            | `Pending` | The request is pending approval due to a policy applied to the wallet. |

            | `Executing` | The request is approved and is in the process of being executed. note this status is only set for a short time between pending and broadcasted. |

            | `Broadcasted` | The transaction has been successfully written to the mempool. |

            | `Confirmed` | The transaction has been confirmed on-chain by our indexing pipeline. |

            | `Failed` | Indicates either system failure to complete the request or the transaction failed on chain. |

            | `Rejected` | The request has been rejected by a policy approval action. |'
        reason:
          type: string
          description: The reason for a failed transfer.
        txHash:
          type: string
          description: The blockchain transaction hash for this transfer.
        fee:
          type: string
          description: The fee paid for this transfer in minimum denomination.
        dateRequested:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). When the transfer was requested.'
          example: 2023-04-14 20:41:28.715000+00:00
        datePolicyResolved:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). When the transfer was approved by policy reviewers.'
          example: 2023-04-14 20:41:28.715000+00:00
        dateBroadcasted:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). When the transfer was broadcasted to the blockchain.'
          example: 2023-04-14 20:41:28.715000+00:00
        dateConfirmed:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). When the transfer was confirmed on chain.'
          example: 2023-04-14 20:41:28.715000+00:00
        approvalId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^ap-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: The id of the approval request if this transfer triggered a policy.
          example: ap-2a9in-tt2a1-983lho480p35ejd0
        externalId:
          type: string
          description: The external id provided at transfer creation time.
        feeSponsorId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^fs-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: The fee sponsor id used to pay for the transfer fees.
          example: fs-5vqdl-gliqk-b4rfukqauov1sp7j
        replacementId:
          type: string
          description: The id of the replacement transaction (cancel or speed-up) issued for this transfer.
        details:
          type: object
          additionalProperties: {}
          description: Structured representation of the data used to construct the signature (e.g. nonce, gas parameters). Shape is blockchain specific.
      required:
      - id
      - walletId
      - network
      - requester
      - requestBody
      - metadata
      - status
      - dateRequested
    Offer:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^offer-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Offer id.
          example: offer-3ugfu-o8duj-vqu770ckmg7ilhp4
        orgId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^or-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Organization id.
          example: or-30tnh-itmjs-s235s5ontr3r23h2
        walletId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Wallet id.
          example: wa-5pfuu-9euek-h0odgb6snva8ph3k
        network:
          $ref: '#/components/schemas/Network'
        kind:
          type: string
          enum:
          - Native
          - Aip21
          - Asa
          - Coin
          - Cip56
          - Erc20
          - Erc721
          - Erc7984
          - Asset
          - Hip17
          - Hts
          - Sep41
          - Spl
          - Spl2022
          - Snip2
          - Snip3
          - Tep74
          - Trc10
          - Trc20
          - Trc721
          - Cis7
          - Cis2
          - Iou
          - Xls33
        metadata:
          type: object
          properties:
            asset:
              type: object
              properties:
                symbol:
                  type: string
                decimals:
                  type: integer
                  description: Number of decimals used by the asset, see [this guide](https://docs.dfns.co/guides/developers/displaying-balances) for more details.
                verified:
                  type: boolean
                  description: Whether the asset is verified by DFNS as legitimate.
                quotes:
                  type: object
                  properties:
                    EUR:
                      type: number
                    USD:
                      type: number
                  description: Corresponding asset price in USD at the time of transfer.
          required:
          - asset
        txHash:
          type: string
        status:
          type: string
          enum:
          - Pending
          - Accepted
          - Rejected
          - Withdrawn
          - Expired
        from:
          type: string
        to:
          type: string
        value:
          type: string
          pattern: ^\d+(\.\d+)?$
        timestamp:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). When the offer was created.'
          example: 2023-04-14 20:41:28.715000+00:00
        expiresAt:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). When the offer expires.'
          example: 2023-04-14 20:41:28.715000+00:00
        memo:
          type: string
        settlementTransactionId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^tx-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Transaction id.
          example: tx-583hu-sp2p7-slvb9nqpa3hd8bus
        dateSettled:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). When the offer was settled.'
          example: 2023-04-14 20:41:28.715000+00:00
      required:
      - id
      - orgId
      - walletId
      - network
      - kind
      - metadata
      - txHash
      - status
      - from
      - to
      - value
      - timestamp
    BulkWalletCreationJob:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^bwc-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: ID of the bulk wallet creation job.
          example: bwc-7jk0a-j19vv-4fhcj3452jceonu0
        orgId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^or-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: ID of the org that owns the job.
          example: or-30tnh-itmjs-s235s5ontr3r23h2
        status:
          type: string
          enum:
          - Pending
          - InProgress
          - Completed
          - PartiallyCompleted
          - Failed
          description: Bulk wallet creation job status.
        network:
          allOf:
          - $ref: '#/components/schemas/Network'
          - description: Network the wallets are created on.
        namePrefix:
          type: string
          description: Name prefix shared by every wallet in the batch; wallet at index N is named `${namePrefix}${N}`.
        tags:
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9_.:/+-]{1,100}$
            description: Wallet Tag.
          maxItems: 10
          description: List of tags.
        totalCount:
          type: integer
          description: Total number of wallets requested in the batch.
        completedCount:
          type: integer
          description: Number of wallets created so far.
        keystoreId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^store-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Key store the batch keys are minted in.
          example: store-425nf-ebf0a-qq22t6qra51tj8j0
        masterKeyId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^key-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Master key the batch wallets are derived from.
          example: key-01snl-t56gb-j8tsok0vn802p80i
        reason:
          type: string
          description: Failure reason, set when the job did not complete fully.
        nextRetryDate:
          type: string
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date string when the job is next retried.'
          example: 2023-04-14 20:41:28.715000+00:00
        nextRetryAttempt:
          type: integer
          description: Number of retry attempts made so far.
        dateCreated:
          type: string
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date string when the job was created.'
          example: 2023-04-14 20:41:28.715000+00:00
        dateUpdated:
          type: string
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date string when the job was last updated.'
          example: 2023-04-14 20:41:28.715000+00:00
        dateCompleted:
          type: string
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date string when the job finished.'
          example: 2023-04-14 20:41:28.715000+00:00
      required:
      - id
      - orgId
      - status
      - network
      - namePrefix
      - tags
      - totalCount
      - completedCount
      - keystoreId
      - dateCreated
      - dateUpdated
      example:
        id: bwc-1f04s-lqc9q-xxxxxxxxxxxxxxxx
        orgId: or-1f04s-lqc9q-xxxxxxxxxxxxxxxx
        status: InProgress
        network: Ethereum
        namePrefix: user-
        tags: []
        totalCount: 500000
        completedCount: 12000
        keystoreId: ks-1f04s-lqc9q-xxxxxxxxxxxxxxxx
        dateCreated: 2023-04-14 20:41:28.715000+00:00
        dateUpdated: 2023-04-14 20:41:28.715000+00:00
  securitySchemes:
    authenticationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '**Bearer Token:** Used to authenticate API requests.

        More details how to generate the token: [Authentication flows](https://docs.dfns.co/api-reference/auth/login-flows)'
    userActionSignature:
      type: apiKey
      in: header
      name: X-DFNS-USERACTION
      description: '**User Action Signature:** Used to sign the change-inducing API requests.

        More details how to generate the token: [User Action Signing flows](https://docs.dfns.co/api-reference/auth/signing-flows)'
