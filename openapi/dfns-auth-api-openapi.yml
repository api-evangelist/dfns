  /auth/registration:
    post:
      operationId: register
      x-dfns-deprecated-operation-id: completeUserRegistration
      summary: Complete User Registration
      tags:
      - Auth
      security:
      - authenticationToken: []
      description: 'Completes the user registration process and creates the user''s initial credentials.


        All credentials submitted in this call (`firstFactorCredential`, `secondFactorCredential`, `recoveryCredential`) sign the same challenge returned by the registration init endpoint (Create Registration Challenge, Create Delegated Registration Challenge, or Create Social Registration Challenge).


        Always include a `recoveryCredential` for end users. Without one, a user who loses their device cannot recover access and you must initiate a delegated recovery manually. See Implement end-user recovery.


        The type of credentials being registered is determined by the `credentialKind` field in the nested objects (`firstFactorCredential` , `secondFactorCredential` and `recoveryCredential`). Supported credential kinds are:

        * `Fido2`: User action is signed by a user''s signing device using `WebAuthn`.

        * `Key`: User action is signed by a user''s, or token''s, private key.

        * `PasswordProtectedKey`: User action is signed by a user''s, or token''s, private key. The encrypted version of the private key is stored by Dfns and returns during the signing flow for the user to decrypt it.

        * `RecoveryKey` : Similar to `PasswordProtectedKey`, but this credential can only be used to recover an account not to sign an action or login. Once this credential is used all the other user''s credentials are invalidated.'
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account    \n✅ Registration Code\n\n#### Required Permissions\n\nNo permission required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                firstFactorCredential:
                  $ref: '#/components/schemas/FirstFactorAttestation'
                secondFactorCredential:
                  $ref: '#/components/schemas/SecondFactorAttestation'
                recoveryCredential:
                  $ref: '#/components/schemas/RecoveryKeyAttestation'
              required:
              - firstFactorCredential
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential:
                    type: object
                    properties:
                      uuid:
                        type: string
                        description: UUID of the credential that was registered.
                      kind:
                        type: string
                        enum:
                        - Fido2
                        - Key
                        - Password
                        - PasswordProtectedKey
                        - RecoveryKey
                        - SessionKey
                        - Totp
                        description: Kind of credential that was registered.
                      name:
                        type: string
                        description: Human-readable name of the credential.
                    required:
                    - uuid
                    - kind
                    - name
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: ^us-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                        description: User id.
                        example: us-6b58p-r53sr-rlrd3l5cj3uc4ome
                      username:
                        type: string
                        description: Username/identifier of the user.
                      orgId:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: ^or-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                        description: Organization id.
                        example: or-30tnh-itmjs-s235s5ontr3r23h2
                      tenantId:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: ^acct-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                        description: Tenant id.
                        example: acct-24hka-dhili-9hgvdlvr1ohpibp4
                    required:
                    - id
                    - username
                required:
                - credential
                - user
