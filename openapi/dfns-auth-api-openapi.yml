  /auth/login/oidc:
    post:
      operationId: oidcLogin
      x-dfns-deprecated-operation-id: completeOidcLogin
      summary: Complete OIDC Login
      tags:
      - Auth
      security:
      - {}
      description: Completes the OIDC login process by exchanging the authorization code obtained from the identity provider. Returns the user's authentication token; when the verified user has no active first-factor credential yet, the response also includes a credential challenge so the client can register one before performing any user-action-signed operation.
      x-mint:
        content: '#### Authentication


          No authentication required.


          #### Required Permissions


          No authentication required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Authorization code obtained from the IdP
                state:
                  type: string
                  description: State forwarded by the IdP
              required:
              - code
              - state
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Authentication token issued to the user.
                  expiry:
                    type: number
                    description: Token expiration time in epoch milliseconds.
                  identity:
                    type: object
                    properties:
                      orgId:
                        type: string
                      tenantId:
                        type: string
                      userId:
                        type: string
                      username:
                        type: string
                    required:
                    - userId
                    - username
                    description: Decoded identity for the issued token. Populated for flows whose token is not a Dfns-minted JWT (e.g. OIDC passthrough) so clients can skip JWT decoding; absent on flows where the token's claims carry the same fields.
                  credentialChallenge:
                    type: object
                    properties:
                      user:
                        type: object
                        properties:
                          id:
                            type: string
                            description: Base64url-encoded user handle (WebAuthn user.id).
                          displayName:
                            type: string
                            description: Display name of the user.
                          name:
                            type: string
                            description: Username of the user.
                        required:
                        - id
                        - displayName
                        - name
                      challenge:
                        type: string
                        description: Challenge to be signed by the credential being registered.
                      rp:
                        type: object
                        properties:
                          id:
                            type: string
                            description: ID of the WebAuthn relying party (typically a domain name).
                          name:
                            type: string
                            description: Human-readable name of the relying party.
                        required:
                        - id
                        - name
                        description: Deprecated. Should not be used.
                      supportedCredentialKinds:
                        type: object
                        properties:
                          firstFactor:
                            type: array
                            items:
                              type: string
                              enum:
                              - Fido2
                              - Key
                              - Password
                              - PasswordProtectedKey
                              - RecoveryKey
                              - SessionKey
                              - Totp
                            description: Credential kinds accepted as first factor.
                          secondFactor:
                            type: array
                            items:
                              type: string
                              enum:
                              - Fido2
                              - Key
                              - Password
                              - PasswordProtectedKey
                              - RecoveryKey
                              - SessionKey
                              - Totp
                            description: Credential kinds accepted as second factor.
                        required:
                        - firstFactor
                        - secondFactor
                        description: Credential kinds that can be used to register the user.
                      authenticatorSelection:
                        type: object
                        properties:
                          authenticatorAttachment:
                            type: string
                            enum:
                            - platform
                            - cross-platform
                          residentKey:
                            type: string
                            enum:
                            - required
                            - preferred
                            - discouraged
                          requireResidentKey:
                            type: boolean
                          userVerification:
                            type: string
                            enum:
                            - required
                            - preferred
                            - discouraged
                            description: 'Value indicating if the user should be prompted for a second factor. Can be one of the following values:

                              * required to indicate the user must be prompted for their pin, biometrics, or another second factor option

                              * preferred to indicate the user should be prompted for a second factor if it is supported

                              * discouraged to indicate the user should not be prompted for their second factor unless the device requires it

                              '
                        required:
                        - residentKey
                        - requireResidentKey
                        - userVerification
                      attestation:
                        type: string
                        enum:
                        - none
                        - indirect
                        - direct
                        - enterprise
                        description: 'Identifies the information needed to verify the user''s signing certificate; can be one of the following:

                          * none: indicates no attestation data is required

                          * indirect: indicates the attestation data should be given, but that it can be generated using an Anonymization CA

                          * direct: indicates the attestation data must be given and should be generated by the authenticator

                          * enterprise: indicates the attestation data should include information to uniquely identify the user''s device

                          '
                      pubKeyCredParams:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - public-key
                            alg:
                              type: number
                          required:
                          - type
                          - alg
                        description: Public key credential parameters supported for the registration.
                      excludeCredentials:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - public-key
                              description: Is always `public-key`.
                            id:
                              type: string
                              minLength: 1
                              maxLength: 64
                              pattern: ^cr-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                              description: ID that identifies the credential.
                              example: cr-6uunn-bm6ja-f6rmod5kqrk5rbel
                          required:
                          - type
                          - id
                        description: Credentials to exclude from the registration (already registered for the user).
                      otpUrl:
                        type: string
                        description: URL to provision a TOTP credential, when applicable.
                      challengeIdentifier:
                        type: string
                        description: Short-lived JWT that identifies the challenge; echo it back on credential completion.
                    required:
                    - user
                    - challenge
                    - supportedCredentialKinds
                    - authenticatorSelection
                    - attestation
                    - pubKeyCredParams
                    - excludeCredentials
                    - otpUrl
                    - challengeIdentifier
                    description: Credential challenge offering all supported first-factor credential kinds. Included when the user has no active first-factor credential; absent once one is registered.
                required:
                - token
