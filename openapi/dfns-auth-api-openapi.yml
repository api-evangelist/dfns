                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserGroupMember'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
    post:
      operationId: addUserGroupMembers
      summary: Add User Group Members
      tags:
      - Auth
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Add users to a user group. Each member gains every permission assigned to the group, in addition to their own.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Auth:UserGroups:Members:Add`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^ug-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User group id.
        required: true
        description: User group id.
        name: userGroupId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^us-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: User id.
                    example: us-6b58p-r53sr-rlrd3l5cj3uc4ome
                  minItems: 1
                  maxItems: 100
                  description: Users to add. Users already in the group are left unchanged.
              required:
              - userIds
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: {}
    delete:
      operationId: removeUserGroupMembers
      summary: Remove User Group Members
      tags:
      - Auth
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Remove users from a user group. Each removed user immediately loses every permission they held only through this group.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Auth:UserGroups:Members:Remove`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^ug-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User group id.
        required: true
        description: User group id.
        name: userGroupId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^us-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: User id.
                    example: us-6b58p-r53sr-rlrd3l5cj3uc4ome
                  minItems: 1
                  maxItems: 100
                  description: Users to remove. Users not in the group are left unchanged.
              required:
              - userIds
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: {}
components:
  schemas:
    PasswordProtectedKeyAttestation:
      type: object
      properties:
        credentialKind:
          type: string
          enum:
          - PasswordProtectedKey
        credentialInfo:
          type: object
          properties:
            credId:
              type: string
              minLength: 1
              description: Base64url-encoded id of the credential.
            clientData:
              type: string
              minLength: 1
              description: Base64url-encoded, stringified JSON [client data](https://docs.dfns.co/api-reference/auth/credentials-data#client-data) object.
            attestationData:
              type: string
              minLength: 1
              description: Base64url-encoded public key.
          required:
          - credId
          - clientData
          - attestationData
          additionalProperties: false
        encryptedPrivateKey:
          type: string
          minLength: 1
          description: User-encrypted private key. Dfns does not have the password to decrypt it.
        credentialName:
          type: string
          minLength: 1
          description: Human-readable name to assign to the credential.
      required:
      - credentialKind
      - credentialInfo
      - encryptedPrivateKey
      additionalProperties: false
      description: Register an encrypted private key. Note that Dfns only stores the encrypted private key and should not have access to the password to decrypt it!
      title: Password-protected Key
    RecoveryKeyAttestation:
      type: object
      properties:
        credentialKind:
          type: string
          enum:
          - RecoveryKey
        credentialInfo:
          type: object
          properties:
            credId:
              type: string
              minLength: 1
              description: Base64url-encoded id of the recovery credential.
            clientData:
              type: string
              minLength: 1
              description: Base64url-encoded, stringified JSON [client data](https://docs.dfns.co/api-reference/auth/credentials-data#client-data) object.
            attestationData:
              type: string
              minLength: 1
              description: Base64url-encoded public key.
          required:
          - credId
          - clientData
          - attestationData
          additionalProperties: false
        encryptedPrivateKey:
          type: string
          minLength: 1
          description: User-encrypted private key for the recovery credential.
        credentialName:
          type: string
          minLength: 1
          description: Human-readable name to assign to the credential.
      required:
      - credentialKind
      - credentialInfo
      additionalProperties: false
      description: Register a recovery key. See [Account Recovery](https://docs.dfns.co/api-reference/auth/account-recovery) for more details.
      title: Recovery Key
    CreateCredentialKeyAttestation:
      type: object
      properties:
        credentialKind:
          type: string
          enum:
          - Key
        credentialInfo:
          type: object
          properties:
            credId:
              type: string
              minLength: 1
              description: Base64url-encoded id of the credential.
            clientData:
              type: string
              minLength: 1
              description: Base64url-encoded, stringified JSON [client data](https://docs.dfns.co/api-reference/auth/credentials-data#client-data) object.
            attestationData:
              type: string
              minLength: 1
              description: Base64url-encoded public key.
          required:
          - credId
          - clientData
          - attestationData
          additionalProperties: false
        credentialName:
          type: string
          minLength: 1
          description: Human-readable name of the credential.
        challengeIdentifier:
          type: string
          minLength: 1
          description: Challenge identifier returned by the create credential challenge endpoint.
      required:
      - credentialKind
      - credentialInfo
      - credentialName
      - challengeIdentifier
      additionalProperties: false
      description: Register a "raw" public/private keypair, mostly meant to be used by Service Accounts. See [Generate a Key Pair](https://docs.dfns.co/guides/developers/generate-a-key-pair) for more details.
      title: Public/Private key pair
    PersonalAccessToken:
      type: object
      properties:
        accessToken:
          type: string
          description: The access token. Only returned at creation time.
        dateCreated:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the access token was created.'
          example: 2023-04-14 20:41:28.715000+00:00
        credId:
          type: string
          description: ID of the credential associated with the access token.
        isActive:
          type: boolean
          description: Whether the access token is active.
        kind:
          type: string
          enum:
          - Pat
          - ServiceAccount
          - Token
          - Code
          - Recovery
          - Temp
          - Application
          description: Access token kind.
        linkedUserId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^us-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User id.
          example: us-6b58p-r53sr-rlrd3l5cj3uc4ome
        linkedAppId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^ap-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: ID of the application the access token is linked to.
          example: ap-2a9in-tt2a1-983lho480p35ejd0
        name:
          type: string
          description: Human-readable name of the access token.
        orgId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^or-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Organization id.
          example: or-30tnh-itmjs-s235s5ontr3r23h2
        permissionAssignments:
          type: array
          items:
            type: object
            properties:
              permissionName:
                type: string
                description: Human-readable name of the permission (role).
              permissionId:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^pm-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                description: ID of the permission (also referred to as "role" in the dashboard).
                example: pm-37vj4-jkr4l-lc9945spfftkne57
              assignmentId:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^as-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                description: ID of the permission assignment.
                example: as-1vcmc-qrek0-6b4vii9pln60907e
              operations:
                type: array
                items:
                  type: string
                description: List of API operations granted by this permission.
            required:
            - permissionName
            - permissionId
            - assignmentId
          description: Permissions (roles) assigned to the access token.
        publicKey:
          type: string
          description: Public key associated with the access token.
        tokenId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^to-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Token id.
          example: to-202a0-cdo33-o65mbt6q758lvvnt
      required:
      - dateCreated
      - credId
      - isActive
      - kind
      - linkedUserId
      - linkedAppId
      - name
      - orgId
      - permissionAssignments
      - publicKey
      - tokenId
    Wallet:
