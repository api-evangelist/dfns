  /auth/credentials/code/verify:
    post:
      operationId: createCredentialWithCode
      summary: Create Credential With Code
      tags:
      - Auth
      security:
      - {}
      description: 'Finalizes the flow Create Credential With Code.


        Adds a new credential to a user''s account. This endpoint is similar to the Create Credential endpoint, except:

        * it does not need the user to be authenticated

        * it does not need user action signing

        * it will only work with the challenge gotten from the Create Credential Challenge With Code endpoint'
      x-mint:
        content: '#### Authentication


          No authentication required.


          #### Required Permissions


          No authentication required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/CreateCredentialFido2Attestation'
              - $ref: '#/components/schemas/CreateCredentialKeyAttestation'
              - $ref: '#/components/schemas/CreateCredentialPasswordProtectedKeyAttestation'
              - $ref: '#/components/schemas/CreateCredentialRecoveryKeyAttestation'
              - $ref: '#/components/schemas/CreateCredentialPasswordAttestation'
              - $ref: '#/components/schemas/CreateCredentialTotpAttestation'
              discriminator:
                propertyName: credentialKind
                mapping:
                  Fido2: '#/components/schemas/CreateCredentialFido2Attestation'
                  Key: '#/components/schemas/CreateCredentialKeyAttestation'
                  PasswordProtectedKey: '#/components/schemas/CreateCredentialPasswordProtectedKeyAttestation'
                  RecoveryKey: '#/components/schemas/CreateCredentialRecoveryKeyAttestation'
                  Password: '#/components/schemas/CreateCredentialPasswordAttestation'
                  Totp: '#/components/schemas/CreateCredentialTotpAttestation'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Credential'
  /auth/login/init:
    post:
      operationId: createLoginChallenge
      summary: Create Login Challenge
      tags:
      - Auth
      security:
      - {}
      description: 'Start a user login session, returning a challenge that will be used to verify the user''s identity.


        If the user has a credential of kind `PasswordProtectedKey` a temporary one time code needs to be passed in the `loginCode` field.


        If the user has at least one discoverable WebAuthn credential, `username` is optional (username-less flow).'
      x-mint:
        content: '#### Authentication


          No authentication required.


          #### Required Permissions


          No authentication required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username/identifier of the user. Optional when the user has at least one discoverable WebAuthn credential.
                orgId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^or-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                  description: Organization id.
                  example: or-30tnh-itmjs-s235s5ontr3r23h2
                tenantId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^acct-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                  description: Tenant id.
                  example: acct-24hka-dhili-9hgvdlvr1ohpibp4
                loginCode:
                  type: string
                  description: One-time login code, required when the user has a credential of kind `PasswordProtectedKey`.
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: string
                    description: Challenge (string) to be signed by the requester with his private key.
                  challengeIdentifier:
                    type: string
                    description: A JWT that identifies the signing session.
                  rp:
                    type: object
                    properties:
                      id:
                        type: string
                        description: ID of the WebAuthn relying party (typically a domain name).
                      name:
                        type: string
                        description: Human-readable name of the relying party.
                    required:
                    - id
                    - name
                    description: Deprecated. Should not be used.
                  supportedCredentialKinds:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          $ref: '#/components/schemas/CredentialKind'
                        factor:
                          type: string
                          enum:
                          - first
                          - second
                          - either
                          description: Indicates if the credential can be used as a first factor, second factor, or either; can be `first`, `second`, or `either`.
                        requiresSecondFactor:
                          type: boolean
                          description: When true indicates a second factor credential is required if the credential is used as a first factor.
                      required:
                      - kind
                      - factor
                      - requiresSecondFactor
                    description: Identifies the kind of credentials that can be used to sign the user action.
                  userVerification:
                    type: string
                    enum:
                    - required
                    - preferred
                    - discouraged
                    description: 'Value indicating if the user should be prompted for a second factor. Can be one of the following values:

                      * required to indicate the user must be prompted for their pin, biometrics, or another second factor option

                      * preferred to indicate the user should be prompted for a second factor if it is supported

                      * discouraged to indicate the user should not be prompted for their second factor unless the device requires it

                      '
                  attestation:
                    type: string
                    enum:
                    - none
                    - indirect
                    - direct
                    - enterprise
                    description: 'Identifies the information needed to verify the user''s signing certificate; can be one of the following:

                      * none: indicates no attestation data is required

                      * indirect: indicates the attestation data should be given, but that it can be generated using an Anonymization CA

                      * direct: indicates the attestation data must be given and should be generated by the authenticator

                      * enterprise: indicates the attestation data should include information to uniquely identify the user''s device

                      '
                  allowCredentials:
                    type: object
                    properties:
                      key:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - public-key
                              description: Is always `public-key`.
                            id:
                              type: string
                              minLength: 1
                              maxLength: 64
                              pattern: ^cr-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                              description: ID that identifies the credential.
                              example: cr-6uunn-bm6ja-f6rmod5kqrk5rbel
                          required:
                          - type
                          - id
                        description: List of keys that the user can use to sign the user action.
                      passwordProtectedKey:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - public-key
                              description: Is always `public-key`.
                            id:
                              type: string
                              minLength: 1
                              maxLength: 64
                              pattern: ^cr-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                              description: ID that identifies the credential.
                              example: cr-6uunn-bm6ja-f6rmod5kqrk5rbel
                            encryptedPrivateKey:
                              type: string
                              description: Encrypted Private Key. Only the user knows the password to decrypt it and have access to the private key.
                          required:
                          - type
                          - id
                          - encryptedPrivateKey
                        description: List of password protected keys that the user can use to sign the login challenge.
                      webauthn:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - public-key
                              description: Is always `public-key`.
                            id:
                              type: string
                              minLength: 1
                              maxLength: 64
                              pattern: ^cr-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                              description: ID that identifies the credential.
                              example: cr-6uunn-bm6ja-f6rmod5kqrk5rbel
                          required:
                          - type
                          - id
                        description: List of WebAuthn credentials that the user can use to sign the user action.
                    required:
                    - key
                    - webauthn
                    description: List of credentials that the user can use to sign the user action.
                  externalAuthenticationUrl:
                    type: string
                    description: Optional url containing a secret value that can be used to enable cross device/origin signing.
                required:
                - challenge
                - challengeIdentifier
                - supportedCredentialKinds
                - userVerification
                - attestation
                - allowCredentials
                - externalAuthenticationUrl
                example:
                  supportedCredentialKinds:
                  - kind: Fido2
                    factor: first
                    requiresSecondFactor: true
                  challenge: MWM0MmY5YTQ0MDRiNzdhNTFhNzY5ODQwNWI5ZTQ4Y2RhODZiNDk3ZTYzOTE5OGYyMDcxZjBjYzk4MmQ5YzY1MA
                  challengeIdentifier: eyJ0e...fQNA
                  userVerification: required
                  attestation: direct
                  externalAuthenticationUrl: ''
                  allowCredentials:
                    key: []
                    passwordProtectedKey:
                    - type: public-key
                      id: hIjkx5PqVxz8wbtuvOh2UYHEY1QXS8mMfKeEDGt-0Fo=
                      encryptedPrivateKey: LsXVskHYqqrKKxBC9KvqStLEmxak5Y7NaboDDlRSIW7evUJpQTT1AYvx0EsFskmriaVb3AjTCGEv7gqUKokml1USL7+dVmrUVhV+cNWtS5AorvRuZr1FMGVKFkW1pKJhFNH2e2O661UhpyXsRXzcmksA7ZN/V37ZK7ITue0gs6I=
                    webauthn:
                    - type: public-key
                      id: c1QEdgnPLJargwzy3cbYKny4Q18u0hr97unXsF3DiE8
  /auth/login/delegated:
    post:
      operationId: delegatedLogin
      summary: Delegated Login
      tags:
      - Auth
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Only a Service Account can use this endpoint.


        Logs a user into an organization without the user''s credentials.


        If you want to use your own authentication system, while still using `Delegated Signing`, you can use this endpoint to authenticate a user without needing the user''s credentials.


        The user authentication token can be used for read operations within the Dfns API, however, write operations will still require the user to sign the action.'
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Auth:Delegated:Login`: Always required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: Username/identifier of the user to log in.
              required:
              - username
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: Authentication token issued to the user.
                  expiry:
                    type: number
                    description: Token expiration time in epoch milliseconds.
                  identity:
                    type: object
                    properties:
                      orgId:
                        type: string
                      tenantId:
                        type: string
                      userId:
                        type: string
                      username:
                        type: string
                    required:
                    - userId
                    - username
                    description: Decoded identity for the issued token. Populated for flows whose token is not a Dfns-minted JWT (e.g. OIDC passthrough) so clients can skip JWT decoding; absent on flows where the token's claims carry the same fields.
                required:
                - token
  /auth/login:
    post:
      operationId: login
      x-dfns-deprecated-operation-id: completeUserLogin
      summary: Complete User Login
      tags:
      - Auth
      security:
      - {}
      description: 'Completes the login process and provides the authenticated user with their authentication token.


        The type of credentials used to login is determined by the `kind` field in the nested objects (`firstFactor` and `secondFactor`). Supported credential kinds are:

        * `Fido2`: Login challenge is signed by a user''s signing device using `WebAuthn`.

        * `Key`: Login challenge is signed by a user''s private key.

        * `PasswordProtectedKey`: Login challenge is signed by the decrypted user''s private key that was sent during the Create Login Challenge step.'
      x-mint:
        content: '#### Authentication


          No authentication required.


          #### Required Permissions


          No authentication required.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeIdentifier:
                  type: string
                  description: Temporary authentication token returned by the Create Challenge endpoint.
                firstFactor:
                  $ref: '#/components/schemas/FirstFactorAssertion'
                secondFactor:
                  $ref: '#/components/schemas/SecondFactorAssertion'
              required:
              - challengeIdentifier
              - firstFactor
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  properties:
                    token:
                      type: string
                      description: Authentication token issued to the user.
                    expiry:
                      type: number
                      description: Token expiration time in epoch milliseconds.
                    identity:
                      type: object
                      properties:
                        orgId:
                          type: string
                        tenantId:
                          type: string
                        userId:
                          type: string
                        username:
                          type: string
                      required:
                      - userId
                      - username
                      description: Decoded identity for the issued token. Populated for flows whose token is not a Dfns-minted JWT (e.g. OIDC passthrough) so clients can skip JWT decoding; absent on flows where the token's claims carry the same fields.
                  required:
                  - token
                - type: object
                  properties:
                    ssoClientId:
                      type: string
                      description: Identifier of the SSO client to use to complete the login flow.
                  required:
                  - ssoClientId
