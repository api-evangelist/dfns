openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Auth API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Auth
paths:
  /auth/action:
    post:
      operationId: createUserActionSignature
      summary: Create User Action Signature
      tags:
      - Auth
      security:
      - authenticationToken: []
      description: 'Completes the user action signing process and provides a signing token that can be used to verify the user intended to perform the action.


        This is the first step of the User Action Signing flow.


        The type of credentials used to sign the action is determined by the `kind` field in the nested objects (`firstFactor` and `secondFactor`). Supported credential kinds are:

        * `Fido2`: User action is signed by a user''s signing device using `WebAuthn`.

        * `Key`: User action is signed by a user''s, or token''s, private key.

        * `PasswordProtectedKey`: Login challenge is signed by the decrypted user''s private key that was sent during Create User Action Signature Challenge step.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\nNo permission required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                challengeIdentifier:
                  type: string
                  description: Temporary authentication token returned by the Create Challenge endpoint.
                firstFactor:
                  $ref: '#/components/schemas/FirstFactorAssertion'
                secondFactor:
                  $ref: '#/components/schemas/SecondFactorAssertion'
              required:
              - challengeIdentifier
              - firstFactor
              additionalProperties: false
            examples:
              Fido2 Passkey credential:
                value:
                  challengeIdentifier: eyJ0e...fQNA
                  firstFactor:
                    kind: Fido2
                    credentialAssertion:
                      credId: c1QEdgnPLJargwzy3cbYKny4Q18u0hr97unXsF3DiE8
                      clientData: eyJ0eXBlIjoid2ViYXV0aG4uZ2V0IiwiY2hhbGxlbmdlIjoiTVdNME1tWTVZVFEwTURSaU56ZGhOVEZoTnpZNU9EUXdOV0k1WlRRNFkyUmhPRFppTkRrM1pUWXpPVEU1T0dZeU1EY3haakJqWXprNE1tUTVZelkxTUEiLCJvcmlnaW4iOiJodHRwczovL2FwcC5kZm5zLm5pbmphIiwiY3Jvc3NPcmlnaW4iOmZhbHNlfQ
                      authenticatorData: WT-zFZUBbJHfBkmhzTlPf49LTn7asLeTQKhm_riCvFgFAAAAAA
                      signature: MEUCIQDJ8G9J1NTjdoKx0yloYw45bpn6fJhcqCoUGiZuOU1IAQIgAtPt7S8FHFYW9OMHh3S5FVAxk-lhli-2lX22bBNSDog
                      userHandle: dXMtMmJhMGgtbHZwMnEtOHYxODYwcGNqMWJoNWlyaQ
              Key Credential:
                value:
                  challengeIdentifier: eyJ0e...fQNA
                  firstFactor:
                    kind: Key
                    credentialAssertion:
                      credId: 6Ca6tAOFTx2odyJBnCoRO-gPvfpfy0EOoOcEaxfxIOk
                      clientData: eyJ0eXBlIjoia2V5LmdldCIsImNoYWxsZW5nZSI6Ik1XTTBNbVk1WVRRME1EUmlOemRoTlRGaE56WTVPRFF3TldJNVpUUTRZMlJoT0RaaU5EazNaVFl6T1RFNU9HWXlNRGN4WmpCall6azRNbVE1WXpZMU1BIiwib3JpZ2luIjoiaHR0cHM6Ly9hcHAuZGZucy5uaW5qYSIsImNyb3NzT3JpZ2luIjpmYWxzZX0
                      signature: owt8WtpJT_6eEuw4UwdIX2HMMwENgk0SrI-RoCMPhx_9YMVpNKJGmJfHUusf_R1Mor9a_hinQVuXj4_XRdeJFSY2AySXSUk
              Password-protected Key Credential:
                value:
                  challengeIdentifier: eyJ0e...fQNA
                  firstFactor:
                    kind: PasswordProtectedKey
                    credentialAssertion:
                      credId: 6Ca6tAOFTx2odyJBnCoRO-gPvfpfy0EOoOcEaxfxIOk
                      clientData: eyJ0eXBlIjoia2V5LmdldCIsImNoYWxsZW5nZSI6Ik1XTTBNbVk1WVRRME1EUmlOemRoTlRGaE56WTVPRFF3TldJNVpUUTRZMlJoT0RaaU5EazNaVFl6T1RFNU9HWXlNRGN4WmpCall6azRNbVE1WXpZMU1BIiwib3JpZ2luIjoiaHR0cHM6Ly9hcHAuZGZucy5uaW5qYSIsImNyb3NzT3JpZ2luIjpmYWxzZX0
                      signature: owt8WtpJT_6eEuw4UwdIX2HMMwENgk0SrI-RoCMPhx_9YMVpNKJGmJfHUusf_R1Mor9a_hinQVuXj4_XRdeJFSY2AySXSUk
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  userAction:
                    type: string
                    description: Signing token to use to verify the user intended to perform the action.
                required:
                - userAction
                example:
                  userAction: eyJ0eX...bzrQakA
  /auth/action/init:
    post:
      operationId: createUserActionChallenge
      summary: Create User Action Challenge
      tags:
      - Auth
      security:
      - authenticationToken: []
      description: 'Starts a user action signing session, returning a challenge that will be used to verify the user''s intent to perform an action.


        This is the first step of the User Action Signing flow.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\nNo permission required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userActionServerKind:
                  type: string
                  enum:
                  - Api
                  description: Optional indicator of which Dfns service being called.
                userActionHttpMethod:
                  type: string
                  enum:
                  - POST
                  - PUT
                  - DELETE
                  - GET
                  description: The HTTP method that will be used to make the request that is being signed.
                userActionHttpPath:
                  type: string
                  minLength: 1
                  description: The path of the request that is being signed.
                userActionPayload:
                  type: string
                  description: The JSON-encoded body of the request that is being signed.
              required:
              - userActionHttpMethod
              - userActionHttpPath
              - userActionPayload
              additionalProperties: false
              example:
                userActionPayload: '{"name": "My PAT","publicKey": "-----BEGIN PUBLIC KEY-----\nMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEZQt0YI2hdsFNmKJesSkAHldyPLIV\nFLI/AhQ5eGasA7jU8tEXOb6nGvxRaTIXrgZ2NPdk78O8zMqz5u9AekH8jA==\n-----END PUBLIC KEY-----","daysValid": 365,"permissionId": "pm-delaw-avoca-v16r37fpp8koqebc"}'
                userActionHttpMethod: POST
                userActionHttpPath: /auth/pats
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  challenge:
                    type: string
                    description: Challenge (string) to be signed by the requester with his private key.
                  challengeIdentifier:
                    type: string
                    description: A JWT that identifies the signing session.
                  rp:
                    type: object
                    properties:
                      id:
                        type: string
                        description: ID of the WebAuthn relying party (typically a domain name).
                      name:
                        type: string
                        description: Human-readable name of the relying party.
                    required:
                    - id
                    - name
                    description: Deprecated. Should not be used.
                  supportedCredentialKinds:
                    type: array
                    items:
                      type: object
                      properties:
                        kind:
                          $ref: '#/components/schemas/CredentialKind'
                        factor:
                          type: string
                          enum:
                          - first
                          - second
                          - either
                          description: Indicates if the credential can be used as a first factor, second factor, or either; can be `first`, `second`, or `either`.
                        requiresSecondFactor:
                          type: boolean
                          description: When true indicates a second factor credential is required if the credential is used as a first factor.
                      required:
                      - kind
                      - factor
                      - requiresSecondFactor
                    description: Identifies the kind of credentials that can be used to sign the user action.
                  userVerification:
                    type: string
                    enum:
                    - required
                    - preferred
                    - discouraged
                    description: 'Value indicating if the user should be prompted for a second factor. Can be one of the following values:

                      * required to indicate the user must be prompted for their pin, biometrics, or another second factor option

                      * preferred to indicate the user should be prompted for a second factor if it is supported

                      * discouraged to indicate the user should not be prompted for their second factor unless the device requires it

                      '
                  attestation:
                    type: string
                    enum:
                    - none
                    - indirect
                    - direct
                    - enterprise
                    description: 'Identifies the information needed to verify the user''s signing certificate; can be one of the following:

                      * none: indicates no attestation data is required

                      * indirect: indicates the attestation data should be given, but that it can be generated using an Anonymization CA

                      * direct: indicates the attestation data must be given and should be generated by the authenticator

                      * enterprise: indicates the attestation data should include information to uniquely identify the user''s device

                      '
                  allowCredentials:
                    type: object
                    properties:
                      key:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - public-key
                              description: Is always `public-key`.
                            id:
                              type: string
                              minLength: 1
                              maxLength: 64
                              pattern: ^cr-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                              description: ID that identifies the credential.
                              example: cr-6uunn-bm6ja-f6rmod5kqrk5rbel
                          required:
                          - type
                          - id
                        description: List of keys that the user can use to sign the user action.
                      passwordProtectedKey:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - public-key
                              description: Is always `public-key`.
                            id:
                              type: string
                              minLength: 1
                              maxLength: 64
                              pattern: ^cr-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                              description: ID that identifies the credential.
                              example: cr-6uunn-bm6ja-f6rmod5kqrk5rbel
                            encryptedPrivateKey:
                              type: string
                              description: Encrypted Private Key. Only the user knows the password to decrypt it and have access to the private key.
                          required:
                          - type
                          - id
                          - encryptedPrivateKey
                        description: List of password protected keys that the user can use to sign the login challenge.
                      webauthn:
                        type: array
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                              enum:
                              - public-key
                              description: Is always `public-key`.
                            id:
                              type: string
                              minLength: 1
                              maxLength: 64
                              pattern: ^cr-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                              description: ID that identifies the credential.
                              example: cr-6uunn-bm6ja-f6rmod5kqrk5rbel
                          required:
                          - type
                          - id
                        description: List of WebAuthn credentials that the user can use to sign the user action.
                    required:
                    - key
                    - webauthn
                    description: List of credentials that the user can use to sign the user action.
                  externalAuthenticationUrl:
                    type: string
                    description: Optional url containing a secret value that can be used to enable cross device/origin signing.
                required:
                - challenge
                - challengeIdentifier
                - supportedCredentialKinds
                - userVerification
                - attestation
                - allowCredentials
                - externalAuthenticationUrl
                example:
                  supportedCredentialKinds:
                  - kind: Fido2
                    factor: first
                    requiresSecondFactor: true
                  challenge: MWM0MmY5YTQ0MDRiNzdhNTFhNzY5ODQwNWI5ZTQ4Y2RhODZiNDk3ZTYzOTE5OGYyMDcxZjBjYzk4MmQ5YzY1MA
                  challengeIdentifier: eyJ0e...fQNA
                  userVerification: required
                  attestation: direct
                  externalAuthenticationUrl: ''
                  allowCredentials:
                    key: []
                    passwordProtectedKey:
                    - type: public-key
                      id: hIjkx5PqVxz8wbtuvOh2UYHEY1QXS8mMfKeEDGt-0Fo=
                      encryptedPrivateKey: LsXVskHYqqrKKxBC9KvqStLEmxak5Y7NaboDDlRSIW7evUJpQTT1AYvx0EsFskmriaVb3AjTCGEv7gqUKokml1USL7+dVmrUVhV+cNWtS5AorvRuZr1FMGVKFkW1pKJhFNH2e2O661UhpyXsRXzcmksA7ZN/V37ZK7ITue0gs6I=
                    webauthn:
                    - type: public-key
                      id: c1QEdgnPLJargwzy3cbYKny4Q18u0hr97unXsF3DiE8
  /auth/action/logs:
    get:
      operationId: listAuditLogs
      summary: List Audit Logs
      tags:
      - Auth
      security:
      - authenticationToken: []
      description: 'Gets all signature events which have occurred in the over the timeframe. The time range is unbounded, but the export is capped at 100,000 rows. When the result is truncated, the `X-Dfns-Result-Truncated: true` response header is set and a trailing `# TRUNCATED ...` line is appended to the CSV; narrow the time range to retrieve all data.


        StartTime and EndTime are URL-encoded UTC ISO timestamps:

        `startTime=2025-08-29T02%3A46%3A40Z`

        `endTime=2025-09-01T02%3A46%3A40Z`


        An additional optional query parameter, `userId` can be specified to filter down events to a particular user. The API will return results found in CSV format.


        Dfns maintains a script which can be used for audit log signature validation: WebAuthn Signature Verifier'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Auth:Logs:Read`: Always required."
      parameters:
      - schema:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Start of the range.'
        required: true
        description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Start of the range.'
        name: startTime
        in: query
      - schema:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). End of the range. The export is capped at 100,000 rows.'
        required: true
        description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). End of the range. The export is capped at 100,000 rows.'
        name: endTime
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Provide a user id to list events from that particular user only.
        required: false
        description: Provide a user id to list events from that particular user only.
        name: userId
        in: query
      responses:
        '200':
          description: Success
          content:
            text/csv:
              schema:
                type: string
                description: "List of event in CSV format. Content contains:\n\n| Field | Type | description |\n| ----- | ---- | ----------- |\n| Date Performed | date-time | When the action was performed |\n| Audit Log ID | log id | id of the log (to use with [Get Audit Log](https://docs.dfns.co/api-reference/auth/get-audit-log)) |\n| User ID | user id | User id who performed the action |\n| Username | string | Username who performed the action |\n| Primary Credential ID | credential id | Credential used by the user |\n| Action Path | string | Path of this action |\n| Summary | string | Summary of this action |\n| Date Signed | date-time | When the user action token was signed |\n| Date Resolved | date-time | When the action reached its final outcome. Empty for legacy rows recorded before outcome tracking |\n| Response Status | string | Final HTTP status code returned for the action (e.g. 200, 403). Empty for legacy rows |\n| Response Error | string | Failure reason for the action, when it failed. Empty on success |\n\nCheck out '[Get Audit Log](https://docs.dfns.co/api-reference/auth/get-audit-log)' response for more details about those fields.\n    "
                example: 'Date Performed,Audit Log ID,User ID,Username,Primary Credential ID,Action Path,Summary,Date Signed,Date Resolved,Response Status,Response Error

                  2025-10-09T13:23:05.134Z,uj-4vs1l-5012b-9589s12d57t26u8,us-4ovh4-6a0h8-81d2df5e2u8l6djt,my-user@my-company.com,cr-7bfqk-89uag-8nle1s2d3f8e6dvd1mk,/wallets/wa-3l6ap-r4cbt-8js1e2f3s8u5242c8,Update wallet wa-3l6ap-r4cbt-8j09mhse1f3s5e242c8.,2025-10-09T13:23:04.000Z,2025-10-09T13:23:05.600Z,200,'
  /auth/action/logs/{id}:
    get:
      operationId: getAuditLog
      summary: Get Audit Log
      tags:
      - Auth
      security:
      - authenticationToken: []
      description: 'Gets detailed information for a particular audit log. Specifically, the API returns the action performed, as well as the `firstFactorCredential` in which you will find the signature information required to validate it.


        Dfns maintains a script which can be used for audit log signature validation: WebAuthn Signature Verifier


        Because the response includes the full signed action (request body and path), details are only returned for actions on routes that Dfns has marked as safe to expose (the same set forwarded to SIEM exports). Requesting details for any other event returns `403 Forbidden`.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Auth:Logs:Read`: Always required."
      parameters:
      - schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
            pattern: ^uj-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
            description: ''
            example: uj-22lhj-mp2ir-88at3r4cufpis60i
          - type: string
            minLength: 1
            maxLength: 64
            pattern: ^to-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
            description: ''
            example: to-202a0-cdo33-o65mbt6q758lvvnt
          description: Log id you need information about.
        required: true
        description: Log id you need information about.
        name: id
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLog'
  /auth/apps:
    get:
      operationId: listApplications
      summary: List Applications
      tags:
      - Auth
      security:
      - authenticationToken: []
      deprecated: true
      description: Applications are deprecated and will be removed in a future release. See details here.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\nNo permission required."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        appId:
                          type: string
                          minLength: 1
                          maxLength: 64
                          pattern: ^ap-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                          description: ID of the application (deprecated).
                          example: ap-2a9in-tt2a1-983lho480p35ejd0
                        kind:
                          type: string
                          enum:
                          - ServerSideApplication
                          - ClientSideApplication
                        orgId:
                          type: string
                          minLength: 1
                          maxLength: 64
                          pattern: ^or-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                          description: Organization id.
                          example: or-30tnh-itmjs-s235s5ontr3r23h2
                        expectedRpId:
                          type: string
                          description: Expected relying party ID for webauthn (deprecated).
                        name:
                          type: string
                          description: Human-readable name of the application.
                        isActive:
                          type: boolean
                          description: Whether the application is active.
                        expectedOrigin:
                          type: string
                          description: Expected origin for webauthn (deprecated).
                        permissionAssignments:
                          type: array
                          items:
                            type: object
                            properties:
                              permissionName:
                                type: string
                                description: Human-readable name of the permission (role).
                              permissionId:
                                type: string
                                minLength: 1
                                maxLength: 64
                                pattern: ^pm-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                                description: ID of the permission (also referred to as "role" in the dashboard).
                                example: pm-37vj4-jkr4l-lc9945spfftkne57
                              assignmentId:
                                type: string
                                minLength: 1
                                maxLength: 64
                                pattern: ^as-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                                description: ID of the permission assignment.
                                example: as-1vcmc-qrek0-6b4vii9pln60907e
                              operations:
                                type: array
                                items:
                                  type: string
                                description: List of API operations granted by this permission.
                            required:
                            - permissionName
                            - permissionId
                            - assignmentId
                          description: Permissions (roles) assigned to the application.
                        accessTokens:
                          type: array
                          items:
                            $ref: '#/components/schemas/PersonalAccessToken'
                          description: Access tokens associated with the application.
                      required:
                      - appId
                      - kind
                      - orgId
                      - name
                      - isActive
                      - permissionAssignments
                      - accessTokens
                    description: Current page items.
                required:
                - items
  /auth/apps/{appId}:
    get:
      operationId: getApplication
      summary: Get Application
      tags:
      - Auth
      security:
      - authenticationToken: []
      deprecated: true
      description: Applications are deprecated and will be removed in a future release. See details here.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\nNo permission required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: ID of the application (deprecated).
        required: true
        description: ID of the application (deprecated).
        name: appId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  appId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^ap-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: ID of the application (deprecated).
                    example: ap-2a9in-tt2a1-983lho480p35ejd0
                  kind:
                    type: string
                    enum:
                    - ServerSideApplication
                    - ClientSideApplication
                  orgId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^or-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Organization id.
                    example: or-30tnh-itmjs-s235s5ontr3r23h2
                  expectedRpId:
                    type: string
                    description: Expected relying party ID for webauthn (deprecated).
                  name:
                    type: string
                    description: Human-readable name of the application.
                  isActive:
                    type: boolean
                    description: Whether the application is active.
                  expectedOrigin:
                    type: string
                    description: Expected origin for webauthn (deprecated).
                  permissionAssignments:
                    type: array
                    items:
                      type: object
                      properties:
                        permissionName:
                          type: string
                          description: Human-readable name of the permission (role).
                        permissionId:
                          type: string
                          minLength: 1
                          maxLength: 64
                          pattern: ^pm-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                          description: ID of the permission (also referred to as "role" in the dashboard).
                          example: pm-37vj4-jkr4l-lc9945spfftkne57
                        assignmentId:
                          type: string
                          minLength: 1
                          maxLength: 64
                          pattern: ^as-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                          description: ID of the permission assignment.
                          example: as-1vcmc-qrek0-6b4vii9pln60907e
                        operations:
                          type: array
                          items:
                            type: string
                          description: List of API operations granted by this permission.
                      required:
                      - permissionName
                      - permissionId
