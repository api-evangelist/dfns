                type: string
                minLength: 1
                maxLength: 64
                pattern: ^pm-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                description: ID of the permission (also referred to as "role" in the dashboard).
                example: pm-37vj4-jkr4l-lc9945spfftkne57
              assignmentId:
                type: string
                minLength: 1
                maxLength: 64
                pattern: ^as-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                description: ID of the permission assignment.
                example: as-1vcmc-qrek0-6b4vii9pln60907e
              operations:
                type: array
                items:
                  type: string
                description: List of API operations granted by this permission.
            required:
            - permissionName
            - permissionId
            - assignmentId
          description: Permissions (roles) assigned to the user.
      required:
      - username
      - name
      - userId
      - kind
      - credentialUuid
      - isActive
      - isServiceAccount
      - isRegistered
      - isSSORequired
      - permissionAssignments
    CreateCredentialPasswordProtectedKeyAttestation:
      type: object
      properties:
        credentialKind:
          type: string
          enum:
          - PasswordProtectedKey
        credentialInfo:
          type: object
          properties:
            credId:
              type: string
              minLength: 1
              description: Base64url-encoded id of the credential.
            clientData:
              type: string
              minLength: 1
              description: Base64url-encoded, stringified JSON [client data](https://docs.dfns.co/api-reference/auth/credentials-data#client-data) object.
            attestationData:
              type: string
              minLength: 1
              description: Base64url-encoded public key.
          required:
          - credId
          - clientData
          - attestationData
          additionalProperties: false
        encryptedPrivateKey:
          type: string
          minLength: 1
          description: User-encrypted private key. Dfns does not have the password to decrypt it.
        credentialName:
          type: string
          minLength: 1
          description: Human-readable name of the credential.
        challengeIdentifier:
          type: string
          minLength: 1
          description: Challenge identifier returned by the create credential challenge endpoint.
      required:
      - credentialKind
      - credentialInfo
      - encryptedPrivateKey
      - credentialName
      - challengeIdentifier
      additionalProperties: false
      description: Register an encrypted private key. Note that Dfns only stores the encrypted private key and should not have access to the password to decrypt it!
      title: Password-protected Key
    FirstFactorAssertion:
      oneOf:
      - $ref: '#/components/schemas/Fido2Assertion'
      - $ref: '#/components/schemas/KeyAssertion'
      - $ref: '#/components/schemas/PasswordProtectedKeyAssertion'
      - $ref: '#/components/schemas/PasswordAssertion'
      discriminator:
        propertyName: kind
        mapping:
          Fido2: '#/components/schemas/Fido2Assertion'
          Key: '#/components/schemas/KeyAssertion'
          PasswordProtectedKey: '#/components/schemas/PasswordProtectedKeyAssertion'
          Password: '#/components/schemas/PasswordAssertion'
      description: First factor credential used to sign the challenge.
    CreateCredentialPasswordAttestation:
      type: object
      properties:
        credentialKind:
          type: string
          enum:
          - Password
        credentialInfo:
          type: object
          properties:
            password:
              type: string
              minLength: 1
              description: User password.
          required:
          - password
          additionalProperties: false
        credentialName:
          type: string
          minLength: 1
          description: Human-readable name of the credential.
        challengeIdentifier:
          type: string
          minLength: 1
          description: Challenge identifier returned by the create credential challenge endpoint.
      required:
      - credentialKind
      - credentialInfo
      - credentialName
      - challengeIdentifier
      additionalProperties: false
      description: Not supported, will be removed in a future release.
      title: <Deprecated> Password
    KeyAttestation:
      type: object
      properties:
        credentialKind:
          type: string
          enum:
          - Key
        credentialInfo:
          type: object
          properties:
            credId:
              type: string
              minLength: 1
              description: Base64url-encoded id of the credential.
            clientData:
              type: string
              minLength: 1
              description: Base64url-encoded, stringified JSON [client data](https://docs.dfns.co/api-reference/auth/credentials-data#client-data) object.
            attestationData:
              type: string
              minLength: 1
              description: Base64url-encoded public key.
          required:
          - credId
          - clientData
          - attestationData
          additionalProperties: false
        credentialName:
          type: string
          minLength: 1
          description: Human-readable name to assign to the credential.
      required:
      - credentialKind
