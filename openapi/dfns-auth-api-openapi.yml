                        operations:
                          type: array
                          items:
                            type: string
                          description: List of API operations granted by this permission.
                      required:
                      - permissionName
                      - permissionId
                      - assignmentId
                    description: Permissions (roles) assigned to the access token.
                required:
                - accessToken
                - dateCreated
                - credId
                - isActive
                - kind
                - linkedUserId
                - linkedAppId
                - name
                - orgId
                - publicKey
                - tokenId
