  /auth/recover/user:
    post:
      operationId: recover
      x-dfns-deprecated-operation-id: recoverUser
      summary: Recover User
      tags:
      - Auth
      security:
      - authenticationToken: []
      description: 'Recovers a user, using a recovery credential. After successfully recovering the user, all of the user''s previous credentials and personal access tokens will be invalidated.


        This flow requires cryptographic validation of newly created credential(s) using a recovery credential. The `recovery.credentialAssertion.clientData` field''s challenge must be the _base64url-encoded_ representation of the `newCredential` object.


        The process is as follows:


        1. Construct the `newCredential` object, using the challenge obtained from either the Create Recovery Challenge or Create Delegated Recovery Challenge endpoints.

        2. Serialize the `newCredential` object to JSON and then base64url-encode the resulting JSON string. This _base64url-encoded_ string will serve as the challenge for the `recovery.credentialAssertion` object.

        3. Construct the `recovery.credentialAssertion` object, using the _base64url-encoded_ string generated in step 2 as its challenge.'
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account    \n✅ Recovery Code\n\n#### Required Permissions\n\nNo permission required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                recovery:
                  type: object
                  properties:
                    kind:
                      type: string
                      enum:
                      - RecoveryKey
                    credentialAssertion:
                      type: object
                      properties:
                        credId:
                          type: string
                          minLength: 1
                          description: Base64url-encoded id of the credential returned by the user's WebAuthn client.
                        clientData:
                          type: string
                          minLength: 1
                          description: Base64url-encoded, stringified JSON [client data](https://docs.dfns.co/api-reference/auth/credentials-data#client-data) object returned by the user's WebAuthn client.
                        signature:
                          type: string
                          minLength: 1
                          description: Base64url-encoded signature returned by the user's WebAuthn client.
                        algorithm:
                          type: string
                          description: The algorithm/digest that the credential will use to sign data. If the algoritm is not specified then the algorithm will be determined by the key.
                      required:
                      - credId
                      - clientData
                      - signature
                      additionalProperties: false
                  required:
                  - kind
                  - credentialAssertion
                  additionalProperties: false
                newCredentials:
                  type: object
                  properties:
                    firstFactorCredential:
                      $ref: '#/components/schemas/FirstFactorAttestation'
                    secondFactorCredential:
                      $ref: '#/components/schemas/SecondFactorAttestation'
                    recoveryCredential:
                      $ref: '#/components/schemas/RecoveryKeyAttestation'
                  required:
                  - firstFactorCredential
                  additionalProperties: false
              required:
              - recovery
              - newCredentials
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  credential:
                    type: object
                    properties:
                      uuid:
                        type: string
                        description: UUID of the credential that was registered.
                      kind:
                        type: string
                        enum:
                        - Fido2
                        - Key
                        - Password
                        - PasswordProtectedKey
                        - RecoveryKey
                        - SessionKey
                        - Totp
                        description: Kind of credential that was registered.
                      name:
                        type: string
                        description: Human-readable name of the credential.
                    required:
                    - uuid
                    - kind
                    - name
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: ^us-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                        description: User id.
                        example: us-6b58p-r53sr-rlrd3l5cj3uc4ome
                      username:
                        type: string
                        description: Username/identifier of the user.
                      orgId:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: ^or-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                        description: Organization id.
                        example: or-30tnh-itmjs-s235s5ontr3r23h2
                      tenantId:
                        type: string
                        minLength: 1
                        maxLength: 64
                        pattern: ^acct-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                        description: Tenant id.
                        example: acct-24hka-dhili-9hgvdlvr1ohpibp4
                    required:
                    - id
                    - username
                required:
