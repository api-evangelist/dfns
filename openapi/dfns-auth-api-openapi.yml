      title: Public/Private key pair
    PasswordAssertion:
      type: object
      properties:
        kind:
          type: string
          enum:
          - Password
        password:
          type: string
          minLength: 1
          description: User password.
      required:
      - kind
      - password
      additionalProperties: false
      description: Not supported, will be removed in a future release.
      title: <Deprecated> Password
    UserGroupMember:
      type: object
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^us-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User id.
          example: us-6b58p-r53sr-rlrd3l5cj3uc4ome
        username:
          type: string
          description: Username/identifier of the member.
        kind:
          type: string
