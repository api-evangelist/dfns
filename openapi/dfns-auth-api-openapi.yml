      description: Second factor credential used to authenticate a user.
    TotpAssertion:
      type: object
      properties:
        kind:
          type: string
          enum:
          - Totp
        otpCode:
          type: string
          minLength: 1
          description: TOTP one-time code.
      required:
      - kind
      - otpCode
      additionalProperties: false
      description: Not supported, will be removed in a future release.
      title: <Deprecated> TOTP
    UserGroup:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^ug-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User group id.
          example: ug-139tf-f58l8-lsbt6dp47lfsdvgh
        orgId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^or-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Organization id.
          example: or-30tnh-itmjs-s235s5ontr3r23h2
        tenantId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^acct-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Tenant id.
          example: acct-24hka-dhili-9hgvdlvr1ohpibp4
        name:
          type: string
          description: Name of the group.
        description:
          type: string
          description: Description of the group.
        memberCount:
          type: integer
          minimum: 0
          description: Number of members.
        dateCreated:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the group was created.'
          example: 2023-04-14 20:41:28.715000+00:00
        dateUpdated:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the group was last updated.'
          example: 2023-04-14 20:41:28.715000+00:00
      required:
      - id
      - name
      - memberCount
      - dateCreated
      - dateUpdated
    CredentialKind:
      type: string
      description: The kind of credential.
      enum:
      - Fido2
      - Key
      - PasswordProtectedKey
      - RecoveryKey
      - SessionKey
    AuditLog:
      type: object
      properties:
        id:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
            pattern: ^uj-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
            description: ''
            example: uj-22lhj-mp2ir-88at3r4cufpis60i
          - type: string
            minLength: 1
            maxLength: 64
            pattern: ^to-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
            description: ''
            example: to-202a0-cdo33-o65mbt6q758lvvnt
          description: Log id.
        action:
          type: string
          description: Action performed.
        actionToken:
          type: string
          description: User Action Signature used as token for permorming this action.
        userId:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 64
          pattern: ^us-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User who performed the action.
          example: us-6b58p-r53sr-rlrd3l5cj3uc4ome
        username:
          type:
          - string
          - 'null'
          description: Username who performed the action.
        datePerformed:
          type:
          - string
          - 'null'
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). When this action was performed (consumed by its handler).'
          example: 2023-04-14 20:41:28.715000+00:00
        dateSigned:
          type:
          - string
          - 'null'
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date when the user action token was signed.'
          example: 2023-04-14 20:41:28.715000+00:00
        dateResolved:
          type:
          - string
          - 'null'
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). When this action reached its final outcome (handler finished and the HTTP status was recorded). Null for legacy rows recorded before outcome tracking.'
          example: 2023-04-14 20:41:28.715000+00:00
        responseStatus:
          type:
          - string
          - 'null'
          description: Final HTTP status code returned for this action (e.g. "200", "403"). Null for legacy rows recorded before outcome tracking.
        responseError:
          type:
          - string
          - 'null'
          description: Failure reason for the action, when it failed. Null on success or when no failure reason was recorded.
        firstFactorCredential:
          type: object
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^cr-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
              description: Id of the credential used to sign this action.
              example: cr-6uunn-bm6ja-f6rmod5kqrk5rbel
            kind:
              allOf:
              - $ref: '#/components/schemas/CredentialKind'
              - type:
                - string
                - 'null'
                description: Kind of credential used to sign this action.
            publicKey:
              type: string
              description: Public Key which can be used to verify signature.
            assertion:
              type:
              - object
              - 'null'
              properties:
                authenticatorData:
                  type:
                  - string
                  - 'null'
                  description: Used to verify the signature for Fido2 credentials. Null for Key credentials, which sign clientData directly.
                clientData:
                  type: string
                  description: Information, including challenge, which you can use to verify the signature.
                signature:
                  type: string
                  description: Signature of the clientData (and authenticatorData for Fido2).
              required:
              - authenticatorData
              - clientData
              - signature
              description: Cryptographic signature evidence. Null when the action was recorded without a WebAuthn assertion (e.g. system-initiated actions or staff-flow org-owner creations).
          required:
          - id
          - kind
          - publicKey
          - assertion
          description: Cryptographic Signature details. Use these parameters if you want to validate the signature.
      required:
      - id
      - action
      - actionToken
      - userId
      - username
      - datePerformed
      - dateSigned
      - dateResolved
      - responseStatus
      - responseError
      - firstFactorCredential
      additionalProperties: false
      example:
        id: uj-4vs1l-5012b-95825381215t26u8
        action: eyJwYXlsb2FkIjoie1wibmFtZVwi3215853bGlhXCJ9IiwibWV0aG9kIjoiUFVUIiwicGF0aCI6Ii93YWxsZX32584LTNsNmFwLXI0Y2J0LThqMDltaGh0YnU1MjQyYzgiLCJzZXJ2ZXIiOiJhcGkuZGZucy5pbyIsInN56534nkiOiJVcGRhdGUgd2FsbGV0IHdhLTNsNmFwLXI0Y2J0LThqMDlt84388jQyYzguIiwibm9uY2UiOiIifQ==
        actionToken: eyJ0eXAiOiJKV1QiLC453JFZERTQSJ9..zva5vMQHkkbxGgk8IG2jHtbWOoftDA1ga_5INqLks2aCO9V29U3lWE9eE3Mu3M6z5SPHprF31BpIMW0jOzWbDA
        datePerformed: 2025-10-09 13:23:05.134000+00:00
        dateSigned: 2025-10-09 13:23:04+00:00
        dateResolved: 2025-10-09 13:23:05.600000+00:00
        responseStatus: '200'
        responseError: null
        userId: us-4ovh4-6a0h8-81oa5584u8l6djt
        username: my-user@my-company.com
        firstFactorCredential:
          id: cr-7bfqk-89uag-8nlq12437958dvd1mk
          kind: Fido2
          publicKey: '-----BEGIN PUBLIC KEY-----

            MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAE2315138132rYlwMzKbl458cZk

            yiHqVsN6QJRE/tqvqsdfq35eT8KEwjSGsh/Lv4LiWMFlnz/kIzjo6TCJpA==

            -----END PUBLIC KEY-----

            '
          assertion:
            authenticatorData: k3SiDdanJToQdO2q1f3se58ELbhdGfzoZ3GRSPmOO9AdAAAAAA
            clientData: 
            signature: MEYCIQDq2iXdlHcsqf13se5BlK1VJFiMQuV1x-HTj1efWvu5dKGgIhAJOudYr43QPWNQnxu1Y1U7PJ3pxjQNhx7kBb821HZJNk
    CreateCredentialFido2Attestation:
      type: object
      properties:
        credentialKind:
          type: string
          enum:
          - Fido2
        credentialInfo:
          type: object
          properties:
            credId:
              type: string
              minLength: 1
              description: Base64url-encoded id of the credential returned by the user's WebAuthn client.
            clientData:
              type: string
              minLength: 1
              description: Base64url-encoded, stringified JSON [client data](https://docs.dfns.co/api-reference/auth/credentials-data#client-data) object returned by the user's WebAuthn client.
            attestationData:
              type: string
              minLength: 1
              description: Base64url-encoded attestation data returned by the user's WebAuthn client.
          required:
          - credId
          - clientData
          - attestationData
          additionalProperties: false
        credentialName:
          type: string
          minLength: 1
          description: Human-readable name of the credential.
        challengeIdentifier:
          type: string
          minLength: 1
          description: Challenge identifier returned by the create credential challenge endpoint.
      required:
      - credentialKind
      - credentialInfo
      - credentialName
      - challengeIdentifier
      additionalProperties: false
      description: Register a Fido2 Credential, also known as Passkeys or WebauthN credential.
      title: Fido2/Passkeys
    KeyScheme:
      type: string
      description: The cryptographic scheme for the key.
      enum:
      - ECDSA
      - EdDSA
      - Schnorr
    CreateCredentialSessionKeyAttestation:
      type: object
      properties:
        credentialKind:
          type: string
          enum:
          - SessionKey
        credentialInfo:
          type: object
          properties:
            credId:
              type: string
              minLength: 1
              description: Credential id of the session key. Must equal the nonce supplied at Initiate OIDC Login so the server can verify the key was bound to the OIDC id_token.
            clientData:
              type: string
              minLength: 1
              description: Base64url-encoded, stringified JSON [client data](https://docs.dfns.co/api-reference/auth/credentials-data#client-data) object.
            attestationData:
              type: string
              minLength: 1
              description: Base64url-encoded public key.
          required:
          - credId
          - clientData
          - attestationData
          additionalProperties: false
        credentialName:
          type: string
          minLength: 1
          description: Human-readable name of the credential.
        challengeIdentifier:
          type: string
          minLength: 1
          description: Challenge identifier returned by the create credential challenge endpoint.
      required:
      - credentialKind
      - credentialInfo
      - credentialName
      - challengeIdentifier
      additionalProperties: false
      description: Register an ephemeral session key bound to an OIDC login session.
      title: Session Key
    Credential:
      type: object
      properties:
        kind:
          type: string
          enum:
          - Fido2
          - Key
          - Password
          - PasswordProtectedKey
          - RecoveryKey
          - SessionKey
          - Totp
        credentialId:
          type: string
          description: Credential ID from the WebAuthn authenticator (base64url).
        credentialUuid:
          type: string
          description: Dfns-internal UUID of the credential.
        dateCreated:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the credential was created.'
          example: 2023-04-14 20:41:28.715000+00:00
        isActive:
          type: boolean
          description: Whether the credential is active.
        name:
          type: string
          description: Human-readable name of the credential.
        publicKey:
          type: string
          description: Public key of the credential.
        relyingPartyId:
          type: string
          description: Relying party identifier associated with the credential.
        origin:
          type: string
          description: Origin where the credential was created.
      required:
      - kind
      - credentialId
      - credentialUuid
      - dateCreated
      - isActive
      - name
      - publicKey
      - relyingPartyId
      - origin
    KeyAssertion:
      type: object
      properties:
        kind:
          type: string
          enum:
          - Key
        credentialAssertion:
          type: object
          properties:
            credId:
              type: string
              minLength: 1
              description: Base64url-encoded id of the credential returned by the user's WebAuthn client.
            clientData:
              type: string
              minLength: 1
              description: Base64url-encoded, stringified JSON [client data](https://docs.dfns.co/api-reference/auth/credentials-data#client-data) object returned by the user's WebAuthn client.
            signature:
              type: string
              minLength: 1
              description: Base64url-encoded signature returned by the user's WebAuthn client.
            algorithm:
              type: string
              description: The algorithm/digest that the credential will use to sign data. If the algoritm is not specified then the algorithm will be determined by the key.
          required:
          - credId
          - clientData
          - signature
          additionalProperties: false
      required:
      - kind
      - credentialAssertion
      additionalProperties: false
      description: Use a "raw" public/private keypair.
      title: Public/Private key pair
    SecondFactorAttestation:
      oneOf:
      - $ref: '#/components/schemas/Fido2Attestation'
      - $ref: '#/components/schemas/KeyAttestation'
      - $ref: '#/components/schemas/TotpAttestation'
      - $ref: '#/components/schemas/PasswordProtectedKeyAttestation'
      discriminator:
        propertyName: credentialKind
        mapping:
          Fido2: '#/components/schemas/Fido2Attestation'
          Key: '#/components/schemas/KeyAttestation'
          Totp: '#/components/schemas/TotpAttestation'
          PasswordProtectedKey: '#/components/schemas/PasswordProtectedKeyAttestation'
    KeyCurve:
      type: string
      enum:
      - ed25519
      - secp256k1
      - stark
      description: The elliptic curve for the key.
    FirstFactorAttestation:
      oneOf:
      - $ref: '#/components/schemas/Fido2Attestation'
      - $ref: '#/components/schemas/KeyAttestation'
      - $ref: '#/components/schemas/PasswordAttestation'
      - $ref: '#/components/schemas/PasswordProtectedKeyAttestation'
      discriminator:
        propertyName: credentialKind
        mapping:
          Fido2: '#/components/schemas/Fido2Attestation'
          Key: '#/components/schemas/KeyAttestation'
          Password: '#/components/schemas/PasswordAttestation'
          PasswordProtectedKey: '#/components/schemas/PasswordProtectedKeyAttestation'
    PasswordProtectedKeyAssertion:
      type: object
      properties:
        kind:
          type: string
          enum:
          - PasswordProtectedKey
        credentialAssertion:
          type: object
          properties:
            credId:
              type: string
              minLength: 1
              description: Base64url-encoded id of the credential returned by the user's WebAuthn client.
            clientData:
              type: string
              minLength: 1
              description: Base64url-encoded, stringified JSON [client data](https://docs.dfns.co/api-reference/auth/credentials-data#client-data) object returned by the user's WebAuthn client.
            signature:
              type: string
              minLength: 1
              description: Base64url-encoded signature returned by the user's WebAuthn client.
            algorithm:
              type: string
              description: The algorithm/digest that the credential will use to sign data. If the algoritm is not specified then the algorithm will be determined by the key.
          required:
          - credId
          - clientData
          - signature
          additionalProperties: false
      required:
      - kind
      - credentialAssertion
      additionalProperties: false
      description: 'Use an encrypted private key. '
      title: Password-protected Key
  securitySchemes:
    authenticationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '**Bearer Token:** Used to authenticate API requests.

        More details how to generate the token: [Authentication flows](https://docs.dfns.co/api-reference/auth/login-flows)'
    userActionSignature:
      type: apiKey
      in: header
      name: X-DFNS-USERACTION
      description: '**User Action Signature:** Used to sign the change-inducing API requests.

        More details how to generate the token: [User Action Signing flows](https://docs.dfns.co/api-reference/auth/signing-flows)'
