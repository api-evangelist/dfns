      required:
      - userId
      - username
      - kind
      - isActive
      - isArchived
      - isServiceAccount
      - dateAdded
    PasswordAttestation:
      type: object
      properties:
        credentialKind:
          type: string
          enum:
          - Password
        credentialInfo:
          type: object
          properties:
            password:
              type: string
              minLength: 1
              description: User password.
