openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Payins API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Payins
paths:
  /payins:
    post:
      operationId: createPayin
      summary: Create Payin
      tags:
      - Payins
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Deliver stablecoin from the organisation's provider balance to a wallet on-chain.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Payins:Create`: Always required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: The destination wallet for the on-ramped funds.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  amount:
                    type: string
                    pattern: ^[0-9]+(\.[0-9]{1,2})?$
                    description: The amount to deliver on-chain, in currency units (e.g. "100.00").
                  provider:
                    type: string
                    enum:
                    - CircleMint
                  currency:
                    type: string
                    enum:
                    - USD
                    - EUR
                    description: 'Fiat currency of the payin (for Circle Mint it determines the delivered stablecoin: USD → USDC, EUR → EURC).'
                required:
                - walletId
                - amount
                - provider
                - currency
                title: Circle Mint Create Payin
              - type: object
                properties:
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: The destination wallet for the on-ramped funds.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  amount:
                    type: string
                    pattern: ^[0-9]+(\.[0-9]{1,2})?$
                    description: The amount to deliver on-chain, in currency units (e.g. "100.00").
                  provider:
                    type: string
                    enum:
                    - Borderless
                  currency:
                    type: string
                    enum:
                    - USD
                    - EUR
                    description: 'Fiat currency of the payin (for Circle Mint it determines the delivered stablecoin: USD → USDC, EUR → EURC).'
                  country:
                    type: string
                    pattern: ^[A-Z]{2}$
                    description: ISO-3166 Alpha-2 country the fiat deposit originates from.
                  borderlessAccountId:
                    type: string
                    description: Borderless account ID; its registered asset address must match the destination wallet address.
                  paymentMethod:
                    type: string
                    enum:
                    - Wire
                    - ACH
                    - Sepa
                    description: The fiat payment rail the payer uses to fund the deposit.
                  asset:
                    oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Erc20
                        contract:
                          type: string
                          description: The ERC-20 contract address of the asset to deliver.
                      required:
                      - kind
                      - contract
                      title: ERC-20 Asset
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Spl
                          - Spl2022
                        mint:
                          type: string
                          description: The token mint address of the asset to deliver.
                      required:
                      - kind
                      - mint
                      title: SPL/SPL-2022 Asset
                    description: The asset to deliver on-chain. Must be supported by Borderless on the wallet network.
                  quoteId:
                    type: string
                    description: Executable quote to redeem (from Create Payin Quote), locking its rate until it expires.
                required:
                - walletId
                - amount
                - provider
                - currency
                - country
                - borderlessAccountId
                - paymentMethod
                - asset
                title: Borderless Create Payin
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: ^payin-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                      description: Payin id.
                      example: payin-59t9u-eng2t-dd9p5nm02uc81sto
                    walletId:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                      description: The destination wallet for the on-ramped funds.
                      example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                    amount:
                      type: string
                      pattern: ^[0-9]+(\.[0-9]{1,2})?$
                      description: The amount to deliver on-chain, in currency units (e.g. "100.00").
                    currency:
                      type: string
                      enum:
                      - USD
                      - EUR
                      description: 'Fiat currency of the payin (for Circle Mint it determines the delivered stablecoin: USD → USDC, EUR → EURC).'
                    network:
                      allOf:
                      - $ref: '#/components/schemas/Network'
                      - description: The network the funds are delivered on (the destination wallet network).
                    status:
                      type: string
                      enum:
                      - Processing
                      - Completed
                      - Failed
                      description: The current status of the payin.
                    requester:
                      allOf:
                      - $ref: '#/components/schemas/Requester'
                      - description: The user/token that initiated the payin.
                    dateCreated:
                      type: string
                      format: date-time
                      description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). ISO 8601 timestamp when the payin was created.'
                      example: 2023-04-14 20:41:28.715000+00:00
                    dateFinalized:
                      type: string
                      format: date-time
                      description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). ISO 8601 timestamp when the payin was finalized.'
                      example: 2023-04-14 20:41:28.715000+00:00
                    provider:
                      type: string
                      enum:
                      - CircleMint
                    data:
                      type: object
                      properties:
                        executionStatus:
                          type: string
                          enum:
                          - Initializing
                          - AwaitingTransfer
                          - Completed
                          - Failed
                          description: The Circle Mint execution status.
                        statusReason:
                          type: string
                          description: Reason for the current status, primarily for failure cases.
                        recipientAddressId:
                          type: string
                          description: Circle recipient-registry id for the destination address (approved once in Circle's console).
                        circleTransferId:
                          type: string
                          description: The id of the Circle transfer delivering the funds on-chain.
                        transactionHash:
                          type: string
                          description: The blockchain transaction hash of the delivery transfer.
                        dateTransferConfirmed:
                          type: string
                          format: date-time
                          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). ISO 8601 timestamp when the transfer confirmed on-chain.'
                          example: 2023-04-14 20:41:28.715000+00:00
                      required:
                      - executionStatus
                      description: Circle Mint provider-specific payin data.
                  required:
                  - id
                  - walletId
                  - amount
                  - currency
                  - network
                  - status
                  - requester
                  - dateCreated
                  - provider
                  - data
                  title: Circle Mint Payin
                - type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: ^payin-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                      description: Payin id.
