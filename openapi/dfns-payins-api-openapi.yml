  /payins/quote:
    post:
      operationId: createPayinQuote
      x-dfns-deprecated-operation-id: requestPayinQuote
      summary: Request Payin Quote
      tags:
      - Payins
      security:
      - authenticationToken: []
      description: Request a quote from a given provider for a payin. Returns the stablecoin amount to be delivered and the fees.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Payins:Create`: Always required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: The destination wallet — determines the network the funds are delivered on.
