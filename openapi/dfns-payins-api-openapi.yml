                    currency:
                      type: string
                      enum:
                      - USD
                      - EUR
                      description: 'Fiat currency of the payin (for Circle Mint it determines the delivered stablecoin: USD → USDC, EUR → EURC).'
                    network:
                      allOf:
                      - $ref: '#/components/schemas/Network'
                      - description: The network the funds are delivered on (the destination wallet network).
                    status:
                      type: string
                      enum:
                      - Processing
                      - Completed
                      - Failed
                      description: The current status of the payin.
                    requester:
                      allOf:
                      - $ref: '#/components/schemas/Requester'
                      - description: The user/token that initiated the payin.
                    dateCreated:
                      type: string
                      format: date-time
                      description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). ISO 8601 timestamp when the payin was created.'
                      example: 2023-04-14 20:41:28.715000+00:00
                    dateFinalized:
                      type: string
                      format: date-time
                      description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). ISO 8601 timestamp when the payin was finalized.'
                      example: 2023-04-14 20:41:28.715000+00:00
                    provider:
                      type: string
                      enum:
                      - Borderless
                    data:
                      type: object
                      properties:
                        executionStatus:
                          type: string
                          enum:
                          - Initializing
                          - AwaitingDeposit
                          - Completed
                          - Failed
                          description: The Borderless execution status.
                        statusReason:
                          type: string
                          description: Reason for the current status, primarily for failure cases.
                        borderlessAccountId:
                          type: string
                          description: The Borderless account whose registered asset address receives the funds.
                        country:
                          type: string
                          pattern: ^[A-Z]{2}$
                          description: ISO-3166 Alpha-2 country the fiat deposit originates from.
                        paymentMethod:
                          type: string
                          enum:
                          - Wire
                          - ACH
                          - Sepa
                          description: The fiat payment rail the payer uses to fund the deposit.
                        asset:
                          type: string
                          description: The provider's code of the asset being delivered (e.g. USDT_POLYGON).
                        quoteId:
                          type: string
                          description: The executable quote the payin was created with, if any.
                        borderlessTransactionId:
                          type: string
                          description: The id of the Borderless deposit transaction.
                        pfiName:
                          type: string
                          description: The Participating Financial Institution fulfilling the deposit.
                        depositInstruction:
                          type: object
                          properties:
                            paymentMethod:
                              type: string
                              description: The fiat payment rail these instructions apply to.
                            details:
                              type: object
                              properties:
                                depositMessage:
                                  type:
                                  - string
                                  - 'null'
                                  description: Reference the payer must include with the payment.
                                bankName:
                                  type:
                                  - string
                                  - 'null'
                                bankAccountNumber:
                                  type:
                                  - string
                                  - 'null'
                                bankRoutingNumber:
                                  type:
                                  - string
                                  - 'null'
                                bankBeneficiaryName:
                                  type:
                                  - string
                                  - 'null'
                                bankBeneficiaryAddress:
                                  type:
                                  - string
                                  - 'null'
                                bankAddress:
                                  type:
                                  - string
                                  - 'null'
                                iban:
                                  type:
                                  - string
                                  - 'null'
                                bic:
                                  type:
                                  - string
                                  - 'null'
                                accountHolderName:
                                  type:
                                  - string
                                  - 'null'
                              additionalProperties:
                                type:
                                - string
                                - 'null'
                              description: Rail-dependent bank details to send the fiat to.
                          required:
                          - paymentMethod
                          - details
                          description: Bank details + reference the payer must wire the fiat to. Absent until Borderless issues them.
                          title: Borderless Deposit Instruction
                        transactionHash:
                          type: string
                          description: The blockchain transaction hash of the stablecoin delivery.
                        dateDeliveryConfirmed:
                          type: string
                          format: date-time
                          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). ISO 8601 timestamp when the on-chain delivery was confirmed.'
                          example: 2023-04-14 20:41:28.715000+00:00
                      required:
                      - executionStatus
                      - borderlessAccountId
                      - country
                      - paymentMethod
                      - asset
                      description: Borderless provider-specific payin data.
                  required:
                  - id
                  - walletId
                  - amount
                  - currency
                  - network
                  - status
                  - requester
                  - dateCreated
                  - provider
                  - data
                  title: Borderless Payin
    get:
      operationId: listPayins
      summary: List Payins
      tags:
      - Payins
      security:
      - authenticationToken: []
      description: List payins with optional filtering and pagination.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Payins:Read`: Always required."
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Filter payins by wallet ID.
        required: false
        description: Filter payins by wallet ID.
        name: walletId
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - Processing
            - Completed
            - Failed
            description: The current status of the payin.
          description: Filter payins by status (comma-separated).
        required: false
        description: Filter payins by status (comma-separated).
        name: status
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - CircleMint
            - Borderless
            description: Payin provider.
          description: Filter payins by provider (comma-separated).
        required: false
        description: Filter payins by provider (comma-separated).
        name: provider
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
