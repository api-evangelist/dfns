                      properties:
                        kind:
                          type: string
                          enum:
                          - Spl
                          - Spl2022
                        mint:
                          type: string
                          description: The token mint address of the asset to deliver.
                      required:
                      - kind
                      - mint
                      title: SPL/SPL-2022 Asset
                    description: The asset to deliver on-chain. Must be supported by Borderless on the wallet network.
                required:
                - provider
                - borderlessAccountId
                - walletId
                - asset
                title: Borderless Register Payin Account Asset
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  accountId:
                    type: string
                    description: The provider's account id.
                  name:
                    type: string
                    description: The account name, when the provider has one.
                  assets:
                    type: array
                    items:
                      type: object
                      properties:
                        asset:
                          type: string
                          description: The provider's asset code (e.g. USDC_ETHEREUM).
                        address:
                          type: string
                          description: The registered destination address for the asset.
                      required:
                      - asset
                      - address
                    description: The assets registered on the account, with their destination addresses.
                required:
                - accountId
                - assets
