                            enum:
                            - USD
                            - EUR
                            description: 'Fiat currency of the payin (for Circle Mint it determines the delivered stablecoin: USD → USDC, EUR → EURC).'
                          network:
                            allOf:
                            - $ref: '#/components/schemas/Network'
                            - description: The network the funds are delivered on (the destination wallet network).
                          status:
                            type: string
                            enum:
                            - Processing
                            - Completed
