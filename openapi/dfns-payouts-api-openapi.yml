                  title: Circle Mint Payout
    get:
      operationId: listPayouts
      summary: List Payouts
      tags:
      - Payouts
      security:
      - authenticationToken: []
      description: List payouts with optional filtering and pagination.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Payouts:Read`: Always required."
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Filter payouts by wallet ID.
        required: false
        description: Filter payouts by wallet ID.
        name: walletId
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - Processing
            - Completed
            - Failed
            - Rejected
            - Expired
            - Canceled
            description: Dfns managed payout status.
          description: Filter payouts by status (comma-separated).
        required: false
        description: Filter payouts by status (comma-separated).
        name: status
        in: query
      - schema:
          type: array
          items:
            type: string
            enum:
            - Borderless
            - CircleMint
            description: Payout provider.
          description: Filter payouts by provider (comma-separated).
        required: false
        description: Filter payouts by provider (comma-separated).
        name: provider
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      oneOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            minLength: 1
                            maxLength: 64
                            pattern: ^pyt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                            description: Payout id.
                            example: pyt-4ihii-9lonb-tmhjo9bor4odmb5h
                          walletId:
                            type: string
                            minLength: 1
                            maxLength: 64
                            pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                            description: The wallet ID used for the payout.
                            example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                          fiatCurrency:
                            type: string
                            description: ISO-4217 fiat currency code for the payout.
                          asset:
                            oneOf:
                            - type: object
                              properties:
                                kind:
                                  type: string
                                  enum:
                                  - Erc20
                                amount:
                                  type: string
                                  pattern: ^\d+$
                                  description: The amount of the asset to be paid out in minimum denomination.
                                contract:
                                  type: string
                                  description: The ERC-20 contract address.
                                network:
                                  $ref: '#/components/schemas/Network'
                                metadata:
                                  type: object
                                  properties:
                                    name:
                                      type: string
                                      description: The display name of the token.
                                    symbol:
                                      type: string
                                      description: The ticker symbol of the token.
                                    decimals:
                                      type: integer
                                      description: Number of decimals used by the token.
