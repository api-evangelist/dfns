openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Payouts API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Payouts
paths:
  /payouts:
    post:
      operationId: createPayout
      summary: Create Payout
      tags:
      - Payouts
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Create a new payout to convert crypto assets to fiat currency.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Payouts:Create`: Always required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: The wallet ID to remit funds from.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  externalId:
                    type: string
                    description: Optional idempotency key to ensure only one payout is created.
                  asset:
                    oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Erc20
                        amount:
                          type: string
                          pattern: ^\d+$
                          description: The amount of the asset to be paid out in minimum denomination.
                        contract:
                          type: string
                          description: The ERC-20 contract address.
                      required:
                      - kind
                      - amount
                      - contract
                      title: ERC-20 Asset
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Spl
                          - Spl2022
                        amount:
                          type: string
                          pattern: ^\d+$
                          description: The amount of the asset to be paid out in minimum denomination.
                        mint:
                          type: string
                          description: The token mint address.
                      required:
                      - kind
                      - amount
                      - mint
                      title: SPL/SPL-2022 Asset
                    description: The asset to be paid out.
                  fiatCurrency:
                    type: string
                    pattern: ^[A-Z]{3}$
                    description: ISO-4217 fiat currency code for the payout.
                  provider:
                    type: string
                    enum:
                    - Borderless
                  country:
                    type: string
                    pattern: ^[A-Z]{2}$
                    description: ISO-3166 Alpha-2 country code for the payout destination.
                  borderlessAccountId:
                    type: string
                    description: Borderless account ID specifying who is paying out funds.
                  paymentInstructionsId:
                    type: string
                    description: Borderless payment instructions ID specifying fiat settlement instructions.
                  paymentPurpose:
                    type: string
                    enum:
                    - salary payment
                    - personal remittance
                    - rent payment
                    - property purchase
                    - owned account abroad
                    - advertising expenses
                    - advisory fees
                    - business insurance
                    - construction
                    - delivery fees
                    - education
                    - exports
                    - donation
                    - hotel
                    - loan payment
                    - maintenance expenses
                    - medical expense
                    - office expenses
                    - royalty fees
                    - service charge
                    - shares investment
                    - tax payment
                    - transportation fees
                    - travel
                    - utility bills
                    - other
                    description: Borderless reason/purpose for the payment.
                required:
                - walletId
                - asset
                - fiatCurrency
                - provider
                - country
                - borderlessAccountId
                - paymentInstructionsId
                - paymentPurpose
                title: Borderless Create Payout
              - type: object
                properties:
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: The wallet ID to remit funds from.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  externalId:
                    type: string
                    description: Optional idempotency key to ensure only one payout is created.
                  asset:
                    oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Erc20
                        amount:
                          type: string
                          pattern: ^\d+$
                          description: The amount of the asset to be paid out in minimum denomination.
                        contract:
                          type: string
                          description: The ERC-20 contract address.
                      required:
                      - kind
                      - amount
                      - contract
                      title: ERC-20 Asset
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Spl
                          - Spl2022
                        amount:
                          type: string
                          pattern: ^\d+$
                          description: The amount of the asset to be paid out in minimum denomination.
                        mint:
                          type: string
                          description: The token mint address.
                      required:
                      - kind
                      - amount
                      - mint
                      title: SPL/SPL-2022 Asset
                    description: The asset to be paid out.
                  fiatCurrency:
                    type: string
                    pattern: ^[A-Z]{3}$
                    description: ISO-4217 fiat currency code for the payout.
                  provider:
                    type: string
                    enum:
                    - CircleMint
                  destination:
                    oneOf:
                    - type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - bank
                        bankId:
                          type: string
                          description: The Circle Mint bank account id to pay out to (the org links banks on Circle's website).
                        rail:
                          type: string
                          enum:
                          - wire
                          - sepa
                          - sepa_instant
                          description: The Circle Mint payout rail.
                      required:
                      - type
                      - bankId
                      - rail
                      title: Circle Mint Bank Destination
                    - type: object
                      properties:
                        type:
                          type: string
                          enum:
                          - balance
                      required:
                      - type
                      title: Circle Mint Balance Destination
                    description: 'Where the redeemed fiat goes: ''bank'' wires it to a linked bank account; ''balance'' holds it in the org''s Circle Mint balance.'
                required:
                - walletId
                - asset
                - fiatCurrency
                - provider
                - destination
                title: Circle Mint Create Payout
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  properties:
                    id:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: ^pyt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                      description: Payout id.
                      example: pyt-4ihii-9lonb-tmhjo9bor4odmb5h
                    walletId:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                      description: The wallet ID used for the payout.
                      example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                    fiatCurrency:
                      type: string
                      description: ISO-4217 fiat currency code for the payout.
                    asset:
                      oneOf:
                      - type: object
                        properties:
                          kind:
                            type: string
                            enum:
                            - Erc20
                          amount:
                            type: string
                            pattern: ^\d+$
                            description: The amount of the asset to be paid out in minimum denomination.
                          contract:
                            type: string
                            description: The ERC-20 contract address.
                          network:
                            $ref: '#/components/schemas/Network'
                          metadata:
                            type: object
                            properties:
                              name:
                                type: string
                                description: The display name of the token.
                              symbol:
                                type: string
                                description: The ticker symbol of the token.
                              decimals:
                                type: integer
                                description: Number of decimals used by the token.
                              verified:
                                type: boolean
                                description: Whether the token is verified by DFNS as legitimate.
                            required:
                            - decimals
                        required:
                        - kind
                        - amount
                        - contract
                        - network
                        title: ERC-20 Asset
                      - type: object
                        properties:
                          kind:
                            type: string
                            enum:
                            - Spl
                            - Spl2022
                          amount:
                            type: string
                            pattern: ^\d+$
                            description: The amount of the asset to be paid out in minimum denomination.
                          mint:
                            type: string
                            description: The token mint address.
                          network:
                            $ref: '#/components/schemas/Network'
                          metadata:
                            type: object
                            properties:
                              name:
                                type: string
                                description: The display name of the token.
                              symbol:
                                type: string
                                description: The ticker symbol of the token.
                              decimals:
                                type: integer
                                description: Number of decimals used by the token.
                              verified:
                                type: boolean
                                description: Whether the token is verified by DFNS as legitimate.
                            required:
                            - decimals
                        required:
                        - kind
                        - amount
                        - mint
                        - network
                        title: SPL/SPL-2022 Asset
                      description: The asset being paid out, including token descriptor and metadata.
                    externalId:
                      type: string
                      description: Optional external identifier for idempotency.
                    status:
                      type: string
                      enum:
                      - Processing
                      - Completed
                      - Failed
                      - Rejected
                      - Expired
                      - Canceled
                      description: The current status of the payout.
                    requester:
                      allOf:
                      - $ref: '#/components/schemas/Requester'
                      - description: The user/token that initiated the payout.
                    dateCreated:
                      type: string
                      format: date-time
                      description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). ISO 8601 timestamp when the payout was created.'
                      example: 2023-04-14 20:41:28.715000+00:00
                    dateFinalized:
                      type: string
                      format: date-time
                      description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). ISO 8601 timestamp when the payout was finalized.'
                      example: 2023-04-14 20:41:28.715000+00:00
                    provider:
                      type: string
                      enum:
                      - Borderless
                    data:
                      type: object
                      properties:
                        borderlessAccountId:
                          type: string
                          description: The Borderless account ID associated with the payout.
                        paymentInstructionsId:
                          type: string
                          description: The Borderless payment instructions ID linked to the destination bank account.
                        paymentPurpose:
                          type: string
                          enum:
                          - salary payment
                          - personal remittance
                          - rent payment
                          - property purchase
                          - owned account abroad
                          - advertising expenses
                          - advisory fees
                          - business insurance
                          - construction
                          - delivery fees
                          - education
                          - exports
                          - donation
                          - hotel
                          - loan payment
                          - maintenance expenses
                          - medical expense
                          - office expenses
                          - royalty fees
                          - service charge
                          - shares investment
                          - tax payment
                          - transportation fees
                          - travel
                          - utility bills
                          - other
                          description: The purpose of the withdrawal payment.
                        dateConfirmed:
                          type: string
                          format: date-time
                          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). ISO 8601 timestamp when the settlement was confirmed via Action Confirm.'
                          example: 2023-04-14 20:41:28.715000+00:00
                        dateCanceled:
                          type: string
                          format: date-time
                          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). ISO 8601 timestamp when the settlement was canceled via Action Cancel.'
                          example: 2023-04-14 20:41:28.715000+00:00
                        executionStatus:
                          type: string
                          enum:
                          - Initializing
                          - AwaitingPayoutInstructions
                          - AwaitingPayoutConfirmation
                          - SubmittingPayoutTransfer
                          - PendingPolicyApproval
                          - DepositProcessing
                          - DisbursementPending
                          - Completed
                          - Rejected
                          - Failed
                          - Expired
                          - Canceled
                          description: The Borderless execution status.
                        statusReason:
                          type: string
                          description: Reason for the current status, primarily for failure cases.
                        country:
                          type: string
                          description: ISO-3166 Alpha-2 country code for the payout destination.
                        borderlessPayoutId:
                          type: string
                          description: The ID assigned by Borderless when the payout is created.
                        depositAddress:
                          type: string
                          description: The on-chain address to remit funds to.
                        transferId:
                          type: string
                          description: The Dfns transfer ID used to settle the payout.
                        transactionHash:
                          type: string
                          description: The blockchain transaction hash once the transfer is confirmed.
                        dateDepositConfirmed:
                          type: string
                          format: date-time
                          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). ISO 8601 timestamp when the on-chain deposit was confirmed.'
                          example: 2023-04-14 20:41:28.715000+00:00
                        datePayoutConfirmed:
                          type: string
                          format: date-time
                          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). ISO 8601 timestamp when Borderless verified fiat has settled.'
                          example: 2023-04-14 20:41:28.715000+00:00
                      required:
                      - borderlessAccountId
                      - paymentInstructionsId
                      - paymentPurpose
                      - executionStatus
                      - country
                      description: Borderless provider-specific payout data.
                  required:
                  - id
                  - walletId
                  - fiatCurrency
                  - asset
                  - status
                  - requester
                  - dateCreated
                  - provider
                  - data
                  title: Borderless Payout
                - type: object
