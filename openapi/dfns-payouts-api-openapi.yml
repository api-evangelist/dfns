    post:
      operationId: createPayoutAction
      summary: Create Payout Action
      tags:
      - Payouts
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Perform an action on a payout, such as confirming or canceling.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Payouts:Update`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: Payout id.
        required: true
        description: Payout id.
        name: payoutId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  action:
                    type: string
                    enum:
                    - Confirm
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: The wallet ID to use for the transfer.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  transfer:
                    oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Erc20
                        amount:
                          type: string
                          pattern: ^\d+$
                          description: The amount of the asset to be paid out in minimum denomination.
                        contract:
                          type: string
                          description: The ERC-20 contract address.
                        to:
                          type: string
                          pattern: ^0x[0-9a-fA-F]{40}$
                          description: The counterparty address for the payout.
                      required:
                      - kind
                      - amount
                      - contract
                      - to
                      title: ERC-20 Transfer
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Spl
                          - Spl2022
                        amount:
                          type: string
                          pattern: ^\d+$
                          description: The amount of the asset to be paid out in minimum denomination.
                        mint:
                          type: string
                          description: The token mint address.
                        to:
                          type: string
                          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
                          description: The counterparty address for the payout.
                      required:
                      - kind
                      - amount
                      - mint
                      - to
                      title: SPL/SPL-2022 Transfer
                    description: The transfer details for the payout settlement.
                required:
                - action
                - walletId
                - transfer
                title: Confirm Payout Action
              - type: object
                properties:
                  action:
                    type: string
                    enum:
                    - Cancel
                required:
                - action
                title: Cancel Payout Action
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: {}
