                      description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). ISO 8601 timestamp when the payout was created.'
                      example: 2023-04-14 20:41:28.715000+00:00
                    dateFinalized:
                      type: string
                      format: date-time
                      description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). ISO 8601 timestamp when the payout was finalized.'
                      example: 2023-04-14 20:41:28.715000+00:00
                    provider:
                      type: string
