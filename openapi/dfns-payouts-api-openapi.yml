                          - Initializing
                          - AwaitingDeposit
                          - DepositConfirmed
                          - AwaitingPayout
                          - Completed
                          - Rejected
                          - Failed
                          - Expired
                          - Canceled
                          description: The Circle Mint execution status.
                        statusReason:
                          type: string
                          description: Reason for the current status, primarily for failure cases.
                        bankId:
                          type: string
                          description: The Circle Mint bank account id the fiat is paid out to; absent for a balance destination.
                        rail:
                          type: string
                          enum:
                          - wire
                          - sepa
                          - sepa_instant
                          description: The payout rail; absent for a balance destination.
                        paymentIntentId:
                          type: string
                          description: Circle payment intent id (the unique per-operation deposit intent).
                        depositAddress:
                          type: string
                          description: The unique per-operation address the wallet remits USDC/EURC to.
                        transferId:
                          type: string
                          description: The Dfns transfer id used to send funds to the deposit address.
                        transactionHash:
                          type: string
                          description: The blockchain transaction hash of the deposit transfer.
                        circlePayoutId:
                          type: string
                          description: The id assigned by Circle when the fiat payout is created.
                        trackingRef:
                          type: string
                          description: Circle tracking reference for the fiat payout.
                        dateDepositConfirmed:
                          type: string
                          format: date-time
                          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). ISO 8601 timestamp when the on-chain deposit was confirmed.'
                          example: 2023-04-14 20:41:28.715000+00:00
                        datePayoutConfirmed:
                          type: string
                          format: date-time
                          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). ISO 8601 timestamp when Circle confirmed the fiat payout.'
                          example: 2023-04-14 20:41:28.715000+00:00
                      required:
