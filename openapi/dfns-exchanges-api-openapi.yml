openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Exchanges API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Exchanges
paths:
  /exchanges/{exchangeId}:
    get:
      operationId: getExchange
      summary: Get Exchange
      tags:
      - Exchanges
      security:
      - authenticationToken: []
      description: Retrieve the details of a specific exchange integration configuration.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Exchanges:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: exchangeId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  kind:
                    type: string
                    enum:
                    - Binance
                    - Kraken
                    - CoinbaseApp
                    - CoinbasePrime
                  dateCreated:
                    type: string
                required:
                - id
                - kind
                - dateCreated
    delete:
      operationId: deleteExchange
      summary: Delete Exchange
      tags:
      - Exchanges
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Delete the exchange configuration from your organization.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Exchanges:Delete`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: exchangeId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    enum:
                    - true
                required:
                - deleted
  /exchanges:
    post:
      operationId: createExchange
      summary: Create Exchange
      tags:
      - Exchanges
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Link your organization with a cryptocurrency exchange.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Exchanges:Create`: Always required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                kind:
                  type: string
                  enum:
                  - Binance
                  - Kraken
                  - CoinbaseApp
                  - CoinbasePrime
                readConfiguration:
                  type: object
                  properties:
                    publicApiKey:
                      type: string
                    privateApiKey:
                      type: string
                    password:
                      type: string
                    otp:
                      type: string
                  required:
                  - publicApiKey
                  - privateApiKey
                writeConfiguration:
                  type: object
                  properties:
                    publicApiKey:
                      type: string
                    privateApiKey:
                      type: string
                    password:
                      type: string
                    otp:
                      type: string
                  required:
                  - publicApiKey
                  - privateApiKey
              required:
              - kind
              - readConfiguration
              - writeConfiguration
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  kind:
                    type: string
                    enum:
                    - Binance
                    - Kraken
                    - CoinbaseApp
                    - CoinbasePrime
                  dateCreated:
                    type: string
                required:
                - id
                - kind
                - dateCreated
                additionalProperties: false
    get:
      operationId: listExchanges
      summary: List Exchanges
      tags:
      - Exchanges
      security:
      - authenticationToken: []
      description: List all configured exchange integrations.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Exchanges:Read`: Always required."
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        kind:
                          type: string
                          enum:
                          - Binance
                          - Kraken
                          - CoinbaseApp
                          - CoinbasePrime
                        dateCreated:
                          type: string
                      required:
                      - id
                      - kind
                      - dateCreated
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /exchanges/{exchangeId}/accounts:
    get:
      operationId: listAccounts
      summary: List Accounts
      tags:
      - Exchanges
      security:
      - authenticationToken: []
      description: Get a list of accounts for a specific exchange.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Exchanges:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: exchangeId
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        exchangeId:
                          type: string
                        exchangeName:
                          type: string
                      required:
                      - id
                      - exchangeId
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /exchanges/{exchangeId}/accounts/{accountId}/assets:
    get:
      operationId: listAccountAssets
      summary: List Account Assets
      tags:
      - Exchanges
      security:
      - authenticationToken: []
      description: Retrieve the list of assets for a specific account on a specific exchange.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Exchanges:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: exchangeId
        in: path
      - schema:
          type: string
          minLength: 1
        required: true
        name: accountId
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        symbol:
                          type: string
                        balance:
                          type: string
                      required:
                      - symbol
                      - balance
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /exchanges/{exchangeId}/accounts/{accountId}/assets/{asset}/withdrawal-networks:
    get:
      operationId: listAssetWithdrawalNetworks
      summary: List Asset Withdrawal Networks
      tags:
      - Exchanges
      security:
      - authenticationToken: []
      description: Lists the networks to which the given asset can be withdrawn from an exchange account.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Exchanges:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: exchangeId
        in: path
      - schema:
          type: string
          minLength: 1
        required: true
        name: accountId
        in: path
      - schema:
          type: string
          minLength: 1
        required: true
        name: asset
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                  - oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Native
                      required:
                      - kind
                      title: Native assets
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Aip21
                        metadata:
                          type: string
                      required:
                      - kind
                      - metadata
                      title: Aptos Fungible Assets (AIP-21)
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Asa
                        assetId:
                          type: string
                      required:
                      - kind
                      - assetId
                      title: Algorand Standard Assets (ASAs)
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Cis2
                        tokenAddress:
                          type: string
                      required:
                      - kind
                      - tokenAddress
                      title: Concordium CIS-2 tokens
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Erc20
                          - Snip2
                          - Trc20
                        contract:
                          type: string
                      required:
                      - kind
                      - contract
                      title: EVM ERC-20/Starknet SNIP-2/TRON TRC-20 tokens
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Erc7984
                        contract:
                          type: string
                      required:
                      - kind
                      - contract
                      title: EVM ERC-7984 confidential tokens
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Hts
                        tokenId:
                          type: string
                      required:
                      - kind
                      - tokenId
                      title: Hedera tokens (HTS)
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Iou
                        currency:
                          type: string
                        issuer:
                          type: string
                      required:
                      - kind
                      - currency
                      - issuer
                      title: XRP Ledger IOU tokens
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Cip56
                        instrumentId:
                          type: string
                        instrumentAdmin:
                          type: string
                      required:
                      - kind
                      - instrumentId
                      - instrumentAdmin
                      title: Canton CIP-56 tokens
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Coin
                          - LockedCoin
                        coin:
                          type: string
                      required:
                      - kind
                      - coin
                      title: Sui/IOTA Coin assets
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Xls33
                        issuanceId:
                          type: string
                      required:
                      - kind
                      - issuanceId
                      title: XRP Ledger MPL (XLS-33) tokens
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Asset
                        assetId:
                          type: string
                      required:
                      - kind
                      - assetId
                      title: Polymesh/Cardano assets
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Cis7
                        tokenId:
                          type: string
                      required:
                      - kind
                      - tokenId
                      title: Concordium PLTs ( CIS-7 tokens)
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Sep41
                        issuer:
                          type: string
                        assetCode:
                          type: string
                      required:
                      - kind
                      - issuer
                      - assetCode
                      title: Stellar SEP-41 tokens
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Trc10
                        tokenId:
                          type: string
                      required:
                      - kind
                      - tokenId
                      title: TRON TRC-10 tokens
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Spl
                          - Spl2022
                        mint:
                          type: string
                      required:
                      - kind
                      - mint
                      title: Solana SPL/SPL2022 tokens
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Tep74
                        master:
                          type: string
                      required:
                      - kind
                      - master
                      title: TON TEP-74 Jetton
                  - type: object
                    properties:
                      network:
                        $ref: '#/components/schemas/Network'
                      decimals:
                        type: number
                    required:
                    - network
                    - decimals
  /exchanges/{exchangeId}/accounts/{accountId}/deposits:
    post:
      operationId: createDeposit
      x-dfns-deprecated-operation-id: createExchangeDeposit
      summary: Create Exchange Deposit
      tags:
      - Exchanges
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Creates a new exchange deposit transaction.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Exchanges:Deposits:Create`: Always required.   \n`Wallets:Transfers:Create`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          description: 'The exchange id obtained from the Create Exchange endpoint. Ex: `ex-1f04s-lqc9q-xxxxxxxxxxxxxxxx`'
        required: true
        description: 'The exchange id obtained from the Create Exchange endpoint. Ex: `ex-1f04s-lqc9q-xxxxxxxxxxxxxxxx`'
        name: exchangeId
        in: path
      - schema:
          type: string
          minLength: 1
          description: Unique identifier for the account like "spot"
        required: true
        description: Unique identifier for the account like "spot"
        name: accountId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - Native
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: The amount of native tokens to transfer in minimum denomination.
                  priority:
                    type: string
                    enum:
                    - Slow
                    - Standard
                    - Fast
                    description: The priority that determines the fees paid for the transfer. All EVM compatible networks and Bitcoin support `priority`. Not supported for other networks. It uses the [estimate fees](https://docs.dfns.co/api-reference/networks/estimate-fees) API to calculate the transfer fees. When not specified, defaults to `Standard` priority.
                  createDestinationAccount:
                    type: boolean
                    description: Whether to create the destination account on chains that require account creation (e.g., Stellar). Only valid for chains that require the receiver account to exist before transfer.
                  offer:
                    type: boolean
                    description: Optional field for Canton, if true it will create a transfer offer.
                  expiresAt:
                    type: string
                    format: date-time
                    description: Optional field for Canton, especially useful in the context of offers
                  useDurableNonce:
                    type: boolean
                    description: 'Optional Solana-only flag. When `true` the SOL transfer is built as a durable-nonce transaction using one of the wallet''s nonce accounts (picked server-side). Use this for offline-signing flows where the construct → broadcast gap may exceed 90 seconds. The wallet''s nonce account pool must be pre-populated via `POST /wallets/{id}/transactions` with `kind: CreateSolanaNonceAccounts`.'
                  externalId:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: A unique ID from your system. It can be leveraged to be used as an idempotency key. (read more [here](https://docs.dfns.co/api-reference/idempotency))
                  travelRule:
                    oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Notabene
                        beneficiaryVASPdid:
                          type: string
                        beneficiaryProof:
                          type: object
                          additionalProperties: {}
                        originator:
                          type: object
                          additionalProperties: {}
                        beneficiary:
                          type: object
                          additionalProperties: {}
                      required:
                      - kind
                      - originator
                      - beneficiary
                      additionalProperties: false
                      title: Notabene Travel Rule
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Sumsub
                        ivms101:
                          type: object
                          properties:
                            version:
                              type: string
                              enum:
                              - IVMS101.2023
                              description: IVMS101 payload version. Must be `IVMS101.2023`.
                            data:
                              type: string
                              minLength: 1
                              description: Originator and beneficiary IVMS101 data, JWS-signed then JWE-encrypted (compact serialization) with the Sumsub public key. Retrieve the key from the Sumsub travel rule public key endpoint. Dfns never decrypts this value.
                            filledFields:
                              type: array
                              items:
                                type: string
                                minLength: 1
                              description: IVMS101 field paths present in `data`, e.g. `Originator.originatorPersons[].naturalPerson.name`.
                          required:
                          - version
                          - data
                          - filledFields
                          additionalProperties: false
                        beneficiaryVaspId:
                          type: string
                          minLength: 1
                          description: Sumsub id of the beneficiary VASP, for a transfer to a hosted (custodial) wallet. Set exactly one of `beneficiaryVaspId` or `beneficiaryWalletType`.
                        beneficiaryWalletType:
                          type: string
                          enum:
                          - unhosted
                          description: Set to `unhosted` for a transfer to a self-custody wallet, which skips VASP attribution. Set exactly one of `beneficiaryVaspId` or `beneficiaryWalletType`.
                      required:
                      - kind
                      - ivms101
                      additionalProperties: false
                      title: Sumsub Travel Rule
                    description: A travel rule payload to associate with the transfer. (read more [here](https://docs.dfns.co/features/travel-rule))
                  feeSponsorId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^fs-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the fee sponsor that will be used to pay for your transfer fees, it might not be available for all blockchains. (read more [here](https://docs.dfns.co/features/fee-sponsors))
                    example: fs-5vqdl-gliqk-b4rfukqauov1sp7j
                  walletId:
                    type: string
                    minLength: 1
                  otp:
                    type: string
                    minLength: 6
                    maxLength: 6
                required:
                - kind
                - amount
                - walletId
                description: ''
                title: Native Assets
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - Erc20
                  contract:
                    type: string
                    pattern: ^0x[0-9a-fA-F]{40}$
                    description: The ERC-20 contract address.
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: The amount of tokens to transfer in minimum denomination.
                  priority:
                    type: string
                    enum:
                    - Slow
                    - Standard
                    - Fast
                    description: The priority that determines the fees paid for the transfer.
                  externalId:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: A unique ID from your system. It can be leveraged to be used as an idempotency key. (read more [here](https://docs.dfns.co/api-reference/idempotency))
                  travelRule:
                    oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Notabene
                        beneficiaryVASPdid:
                          type: string
                        beneficiaryProof:
                          type: object
                          additionalProperties: {}
                        originator:
                          type: object
                          additionalProperties: {}
                        beneficiary:
                          type: object
                          additionalProperties: {}
                      required:
                      - kind
                      - originator
                      - beneficiary
                      additionalProperties: false
                      title: Notabene Travel Rule
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Sumsub
                        ivms101:
                          type: object
                          properties:
                            version:
                              type: string
                              enum:
                              - IVMS101.2023
                              description: IVMS101 payload version. Must be `IVMS101.2023`.
                            data:
                              type: string
                              minLength: 1
                              description: Originator and beneficiary IVMS101 data, JWS-signed then JWE-encrypted (compact serialization) with the Sumsub public key. Retrieve the key from the Sumsub travel rule public key endpoint. Dfns never decrypts this value.
                            filledFields:
                              type: array
                              items:
                                type: string
                                minLength: 1
                              description: IVMS101 field paths present in `data`, e.g. `Originator.originatorPersons[].naturalPerson.name`.
                          required:
                          - version
                          - data
                          - filledFields
                          additionalProperties: false
                        beneficiaryVaspId:
                          type: string
                          minLength: 1
                          description: Sumsub id of the beneficiary VASP, for a transfer to a hosted (custodial) wallet. Set exactly one of `beneficiaryVaspId` or `beneficiaryWalletType`.
                        beneficiaryWalletType:
                          type: string
                          enum:
                          - unhosted
                          description: Set to `unhosted` for a transfer to a self-custody wallet, which skips VASP attribution. Set exactly one of `beneficiaryVaspId` or `beneficiaryWalletType`.
                      required:
                      - kind
                      - ivms101
                      additionalProperties: false
                      title: Sumsub Travel Rule
                    description: A travel rule payload to associate with the transfer. (read more [here](https://docs.dfns.co/features/travel-rule))
                  feeSponsorId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^fs-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the fee sponsor that will be used to pay for your transfer fees, it might not be available for all blockchains. (read more [here](https://docs.dfns.co/features/fee-sponsors))
                    example: fs-5vqdl-gliqk-b4rfukqauov1sp7j
                  walletId:
                    type: string
                    minLength: 1
                  otp:
                    type: string
                    minLength: 6
                    maxLength: 6
                required:
                - kind
                - contract
                - amount
                - walletId
                description: ''
                title: EVM Fungible Token (ERC-20)
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - Trc10
                  tokenId:
                    type: string
                    pattern: ^\d+$
                    description: The token ID.
                  amount:
                    type: string
                    pattern: ^\d+$
                    description: The amount of tokens to transfer in minimum denomination.
                  externalId:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: A unique ID from your system. It can be leveraged to be used as an idempotency key. (read more [here](https://docs.dfns.co/api-reference/idempotency))
                  travelRule:
                    oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Notabene
                        beneficiaryVASPdid:
                          type: string
                        beneficiaryProof:
                          type: object
                          additionalProperties: {}
                        originator:
                          type: object
                          additionalProperties: {}
                        beneficiary:
                          type: object
                          additionalProperties: {}
                      required:
                      - kind
                      - originator
                      - beneficiary
                      additionalProperties: false
                      title: Notabene Travel Rule
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
