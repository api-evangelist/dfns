openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Address Watches API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Address Watches
paths:
  /address-watches:
    post:
      operationId: createAddressWatch
      summary: Create Address Watch
      tags:
      - Address Watches
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Registers an on chain address to watch. An address watch is not controlled by Dfns: it holds no key, it cannot sign or move funds. The indexer matches on chain activity touching the address and sends the corresponding webhooks.


        The address must already exist on chain and is normalized to the form the indexer matches on (lowercase for EVM networks). Only networks that support address watches are accepted. A given address can only be watched once per network within an organization while the watch is Active.


        Watching an address that was previously deleted re-activates the deleted watch, with the ID, the nickname and the externalId it had before: the request body is only used to find it.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`AddressWatches:Create`: Always required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                network:
                  allOf:
                  - $ref: '#/components/schemas/AddressWatchNetwork'
                  - description: Network to watch the address on. Only networks that support address watches are accepted.
                address:
                  type: string
                  minLength: 1
                  maxLength: 256
                  description: The on chain address to watch.
                name:
                  type: string
                  maxLength: 100
                  description: Address watch nickname.
                externalId:
                  type: string
                  maxLength: 100
                  description: User-defined value that can be used to correlate the entity with an external system.
              required:
              - network
              - address
              additionalProperties: false
            examples:
              Ethereum:
                value:
                  network: Ethereum
                  address: '0x00e3495cf6af59008f22ffaf32d4c92ac33dac47'
                  name: exchange-hot-wallet
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressWatch'
    get:
      operationId: listAddressWatches
      summary: List Address Watches
      tags:
      - Address Watches
      security:
      - authenticationToken: []
      description: Retrieves the list of address watches in your organization. Pagination is supported via limit and paginationToken parameters.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`AddressWatches:Read`: Always required."
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddressWatch'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /address-watches/{addressWatchId}:
    delete:
      operationId: deleteAddressWatch
      summary: Delete Address Watch
      tags:
      - Address Watches
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Deletes an address watch. Once deleted, the address is not watched anymore, no webhook is sent for it, and it won't count in your overall organisation wallet count. Watching the same address again on the same network re-activates this watch, with the same ID and the same history.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`AddressWatches:Delete`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^aw-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: The address watch to delete.
        required: true
        description: The address watch to delete.
        name: addressWatchId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressWatch'
    get:
      operationId: getAddressWatch
      summary: Get Address Watch
      tags:
      - Address Watches
      security:
      - authenticationToken: []
      description: Retrieves an address watch by its ID.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`AddressWatches:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^aw-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: The address watch to retrieve.
        required: true
        description: The address watch to retrieve.
        name: addressWatchId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressWatch'
  /address-watches/{addressWatchId}/assets:
    get:
      operationId: getAddressWatchAssets
      summary: Get Address Watch Assets
      tags:
      - Address Watches
      security:
      - authenticationToken: []
      description: Retrieves the list of assets held by the address watch, as tracked by the indexer. Balances are tracked from the moment the watch is created.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`AddressWatches:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^aw-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: The address watch to retrieve the assets of.
        required: true
        description: The address watch to retrieve the assets of.
        name: addressWatchId
        in: path
      - schema:
          type: string
          enum:
          - 'true'
        required: false
        name: netWorth
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  addressWatchId:
                    type: string
                  network:
                    $ref: '#/components/schemas/AddressWatchNetwork'
                  assets:
                    type: array
                    items:
                      allOf:
                      - oneOf:
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Native
                          required:
                          - kind
                          title: Native assets
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Aip21
                            metadata:
                              type: string
                          required:
                          - kind
                          - metadata
                          title: Aptos Fungible Assets (AIP-21)
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Asa
                            assetId:
                              type: string
                          required:
                          - kind
                          - assetId
                          title: Algorand Standard Assets (ASAs)
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Cis2
                            tokenAddress:
                              type: string
                          required:
                          - kind
                          - tokenAddress
                          title: Concordium CIS-2 tokens
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Erc20
                              - Snip2
                              - Trc20
                            contract:
                              type: string
                          required:
                          - kind
                          - contract
                          title: EVM ERC-20/Starknet SNIP-2/TRON TRC-20 tokens
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Erc7984
                            contract:
                              type: string
                          required:
                          - kind
                          - contract
                          title: EVM ERC-7984 confidential tokens
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Hts
                            tokenId:
                              type: string
                          required:
                          - kind
                          - tokenId
                          title: Hedera tokens (HTS)
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Iou
                            currency:
                              type: string
                            issuer:
                              type: string
                          required:
                          - kind
                          - currency
                          - issuer
                          title: XRP Ledger IOU tokens
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Cip56
                            instrumentId:
                              type: string
                            instrumentAdmin:
                              type: string
                          required:
                          - kind
                          - instrumentId
                          - instrumentAdmin
                          title: Canton CIP-56 tokens
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Coin
                              - LockedCoin
                            coin:
                              type: string
                          required:
                          - kind
                          - coin
                          title: Sui/IOTA Coin assets
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Xls33
                            issuanceId:
                              type: string
                          required:
                          - kind
                          - issuanceId
                          title: XRP Ledger MPL (XLS-33) tokens
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Asset
                            assetId:
                              type: string
                          required:
                          - kind
                          - assetId
                          title: Polymesh/Cardano assets
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Cis7
                            tokenId:
                              type: string
                          required:
                          - kind
                          - tokenId
                          title: Concordium PLTs ( CIS-7 tokens)
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Sep41
                            issuer:
                              type: string
                            assetCode:
                              type: string
                          required:
                          - kind
                          - issuer
                          - assetCode
                          title: Stellar SEP-41 tokens
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Trc10
                            tokenId:
                              type: string
                          required:
                          - kind
                          - tokenId
                          title: TRON TRC-10 tokens
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Spl
                              - Spl2022
                            mint:
                              type: string
                          required:
                          - kind
                          - mint
                          title: Solana SPL/SPL2022 tokens
                        - type: object
                          properties:
                            kind:
                              type: string
                              enum:
                              - Tep74
                            master:
                              type: string
                          required:
                          - kind
                          - master
                          title: TON TEP-74 Jetton
                      - type: object
                        properties:
                          symbol:
                            type: string
                          decimals:
                            type: number
                          verified:
                            type: boolean
                          balance:
                            type: string
                          quotes:
                            type: object
                            properties:
                              USD:
                                type: number
                            description: Current market price of the asset, keyed by fiat currency (e.g. USD). Sourced from DFNS market data.
                        required:
                        - decimals
                        - balance
                  netWorth:
                    type: object
                    properties:
                      USD:
                        type: number
                required:
                - addressWatchId
                - network
                - assets
  /address-watches/{addressWatchId}/blockchain-events:
    get:
      operationId: getAddressWatchBlockchainEvents
      summary: Get Address Watch Blockchain Events
      tags:
      - Address Watches
      security:
      - authenticationToken: []
      description: 'Retrieves a list of decoded blockchain events indexed for the specified address watch.


        Blockchain events are not value transfers: asset and token transfers are listed by

        Get Address Watch History instead.

        Events from the same transaction share the same `txHash` across both lists.


        Items are sorted by descending block number; within one block the item order is not the on-chain

        order. `index` is the block scoped log index as a decimal string: sort by `blockNumber` and the

        numeric value of `index` to recover the on-chain order. Webhook delivery is at-least-once and

        unordered; use `id` to deduplicate.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`AddressWatches:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^aw-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Address watch you want to get the blockchain events from.
        required: true
        description: Address watch you want to get the blockchain events from.
        name: addressWatchId
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      - schema:
          type: string
          minLength: 1
        required: false
        name: name
        in: query
      - schema:
          type: string
          minLength: 1
        required: false
        name: contract
        in: query
      - schema:
          type: string
          minLength: 1
        required: false
        name: txHash
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddressWatchBlockchainEvent'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                  addressWatchId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^aw-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Address watch id.
                    example: aw-0pbh4-7sdh4-2occ0e4r1g7obe8c
                  network:
                    $ref: '#/components/schemas/AddressWatchNetwork'
                required:
                - items
                - addressWatchId
                - network
  /address-watches/{addressWatchId}/history:
    get:
      operationId: getAddressWatchHistory
      summary: Get Address Watch History
      tags:
      - Address Watches
      security:
      - authenticationToken: []
      description: 'Retrieves the list of indexed on chain activities for the specified address watch.


        The list reflects the indexed on chain activity from the moment the watch was created. Events from before the watch are not backfilled.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`AddressWatches:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^aw-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Address watch you want to get the history from.
        required: true
        description: Address watch you want to get the history from.
        name: addressWatchId
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      - schema:
          type: string
          enum:
          - In
          - Out
          description: Transfer direction.
        required: false
        description: Transfer direction.
        name: direction
        in: query
      - schema:
          type: string
          enum:
          - NativeTransfer
          - Aip21Transfer
          - AsaTransfer
          - AssetTransfer
          - Cip56Transfer
          - Cis2Transfer
          - Cis7Transfer
          - CoinTransfer
          - Erc20Transfer
          - Erc721Transfer
          - Erc7984Transfer
          - HederaErc20Transfer
          - HederaErc721Transfer
          - Hip17Transfer
          - HtsTransfer
          - IouTransfer
          - LockedCoinTransfer
          - Sep41Transfer
          - Snip2Transfer
          - Snip3Transfer
          - SplTransfer
          - Spl2022Transfer
          - Tep74Transfer
          - Trc10Transfer
          - Trc20Transfer
          - Trc721Transfer
          - UtxoTransfer
          - Xls33Transfer
          description: Blockchain event kind.
        required: false
        description: Blockchain event kind.
        name: kind
        in: query
      - schema:
          type: string
          minLength: 1
        required: false
        name: contract
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AddressWatchHistoryEvent'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                  addressWatchId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^aw-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Address watch id.
                    example: aw-0pbh4-7sdh4-2occ0e4r1g7obe8c
                  network:
                    $ref: '#/components/schemas/AddressWatchNetwork'
                required:
                - items
                - addressWatchId
                - network
components:
  schemas:
    AddressWatchBlockchainEvent:
      type: object
      properties:
        id:
          type: string
          description: Deterministic event id, safe to deduplicate on.
        addressWatchId:
          type: string
        network:
          $ref: '#/components/schemas/AddressWatchNetwork'
        name:
          type: string
          description: Decoded event name.
        blockNumber:
          type: number
        txHash:
          type: string
        index:
          type: string
          description: Block scoped log index of the event, as a decimal string.
        timestamp:
          type: string
        status:
          type: string
          enum:
          - Included
          - Confirmed
          description: Webhooks are emitted only once Confirmed; the list can contain Included events on networks with unfinalized indexing.
        data:
          type: object
          additionalProperties: {}
          description: Decoded event fields, the emitting contract included.
      required:
      - id
      - addressWatchId
      - network
      - name
      - blockNumber
      - txHash
      - index
      - timestamp
      - status
      - data
      example:
        id: ce-2c5o1-eaqqp-xxxxxxxxxxxxxxxx
        addressWatchId: aw-1f04s-lqc9q-xxxxxxxxxxxxxxxx
        network: Ethereum
        name: OrderSettled
        blockNumber: 19036906
        txHash: '0x8e88793607610a83798eb5ec6dde861f3e459c7e4a22e78b0d2e675b86d0d1e7'
        index: '134'
        timestamp: 2026-01-18 23:03:59+00:00
        status: Confirmed
        data:
          contract: '0x11a4a5aa04d840f0c692ba297dd60c2871ad0b56'
          orderId: '0x0102030405060708090a0b0c0d0e0f10'
          amount: '1000'
          currency: EUR
    AddressWatchHistoryEvent:
      oneOf:
      - type: object
        properties:
          direction:
            type: string
            enum:
            - In
            - Out
          network:
            $ref: '#/components/schemas/Network'
          blockNumber:
            type: number
          txHash:
            type: string
          index:
            type: string
          timestamp:
            type: string
          status:
            type: string
            enum:
            - Included
            - Confirmed
          metadata:
            type: object
            properties:
              asset:
                type: object
                properties:
                  symbol:
                    type: string
                  decimals:
                    type: integer
                    description: Number of decimals used by the asset, see [this guide](https://docs.dfns.co/guides/developers/displaying-balances) for more details.
                  verified:
                    type: boolean
                    description: Whether the asset is verified by DFNS as legitimate.
                  quotes:
                    type: object
                    properties:
                      EUR:
                        type: number
                      USD:
                        type: number
                    description: Corresponding asset price in USD at the time of transfer.
              fee:
                type: object
                properties:
                  symbol:
                    type: string
                  decimals:
                    type: integer
                    description: Number of decimals used by the asset, see [this guide](https://docs.dfns.co/guides/developers/displaying-balances) for more details.
                  verified:
                    type: boolean
                    description: Whether the asset is verified by DFNS as legitimate.
                  quotes:
                    type: object
                    properties:
                      EUR:
                        type: number
                      USD:
                        type: number
                    description: Corresponding asset price in USD at the time of transfer.
            required:
            - asset
          kind:
            type: string
            enum:
            - NativeTransfer
          from:
            type: string
          to:
            type: string
          value:
            type: string
          fee:
            type: string
          memo:
            type: string
          liquidityPool:
            type: string
          balanceId:
            type: string
          symbol:
            type: string
            description: '@deprecated use metadata.asset.symbol instead'
          decimals:
            type: number
            description: '@deprecated use metadata.asset.decimals instead'
          verified:
            type: boolean
            description: '@deprecated use metadata.asset.verified instead'
          addressWatchId:
            type: string
        required:
        - direction
        - network
        - blockNumber
        - txHash
        - timestamp
        - status
        - metadata
        - kind
        - value
        - symbol
        - decimals
        - addressWatchId
        title: Native Transfer
      - type: object
        properties:
          direction:
            type: string
            enum:
            - In
            - Out
          network:
            $ref: '#/components/schemas/Network'
          blockNumber:
            type: number
          txHash:
            type: string
          index:
            type: string
          timestamp:
            type: string
          status:
            type: string
            enum:
            - Included
            - Confirmed
          metadata:
            type: object
            properties:
              asset:
                type: object
                properties:
                  symbol:
                    type: string
                  decimals:
                    type: integer
                    description: Number of decimals used by the asset, see [this guide](https://docs.dfns.co/guides/developers/displaying-balances) for more details.
                  verified:
                    type: boolean
                    description: Whether the asset is verified by DFNS as legitimate.
                  quotes:
                    type: object
                    properties:
                      EUR:
                        type: number
                      USD:
                        type: number
                    description: Corresponding asset price in USD at the time of transfer.
              fee:
                type: object
                properties:
                  symbol:
                    type: string
                  decimals:
                    type: integer
                    description: Number of decimals used by the asset, see [this guide](https://docs.dfns.co/guides/developers/displaying-balances) for more details.
                  verified:
                    type: boolean
                    description: Whether the asset is verified by DFNS as legitimate.
                  quotes:
                    type: object
                    properties:
                      EUR:
                        type: number
                      USD:
                        type: number
                    description: Corresponding asset price in USD at the time of transfer.
            required:
            - asset
          kind:
            type: string
            enum:
            - Aip21Transfer
          metadataAddress:
            type: string
          from:
            type: string
          to:
            type: string
          value:
            type: string
          fee:
            type: string
          addressWatchId:
            type: string
        required:
        - direction
        - network
        - blockNumber
        - txHash
        - timestamp
        - status
        - metadata
        - kind
        - metadataAddress
        - from
        - to
