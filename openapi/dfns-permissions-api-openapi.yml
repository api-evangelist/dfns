    get:
      operationId: listPermissions
      summary: List Permissions
      tags:
      - Permissions
      security:
      - authenticationToken: []
      description: Lists all permissions (roles) in the organization.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Permissions:Read`: Always required."
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/Permission'
                      - type: object
                        properties:
                          pendingChangeRequest:
                            type: object
                            properties:
                              id:
                                type: string
                                minLength: 1
                                maxLength: 64
                                pattern: ^cr-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                                description: ID of the change request.
                                example: cr-6uunn-bm6ja-f6rmod5kqrk5rbel
                              requester:
                                $ref: '#/components/schemas/ChangeRequestRequester'
                              status:
                                type: string
                                enum:
                                - Applied
                                - Failed
                                - Pending
                                - Rejected
                                description: Current status of the change request.
                              entityId:
                                type: string
                                description: ID of the entity being changed.
                              userActionId:
                                type: string
                                description: User action of the change request.
                              dateCreated:
                                type: string
                                format: date-time
                                description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the change request was created.'
                                example: 2023-04-14 20:41:28.715000+00:00
                              dateResolved:
                                type: string
                                format: date-time
                                description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the change request was resolved.'
                                example: 2023-04-14 20:41:28.715000+00:00
                              approvalId:
                                type: string
                                minLength: 1
                                maxLength: 64
                                pattern: ^ap-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                                example: ap-2a9in-tt2a1-983lho480p35ejd0
                              kind:
                                type: string
                                enum:
                                - Permission
                              operationKind:
                                type: string
                                enum:
                                - Update
                              body:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    minLength: 1
                                    maxLength: 64
                                    pattern: ^pm-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                                    description: ID of the permission (also referred to as "role" in the dashboard).
                                    example: pm-37vj4-jkr4l-lc9945spfftkne57
                                  name:
                                    type: string
                                    description: Human-readable name of the permission (role).
                                  status:
                                    type: string
                                    enum:
                                    - Active
                                    description: Current status of the permission.
                                  operations:
                                    type: array
                                    items:
                                      type: string
                                    description: List of API operations this permission grants access to. See [Permissions List](https://docs.dfns.co/core-concepts/roles-and-permissions#list-of-permissions) for available operations.
                                  isImmutable:
                                    type: boolean
                                    description: Whether this permission is system-managed and cannot be modified.
                                  isArchived:
                                    type: boolean
                                    description: Whether this permission has been archived (soft-deleted).
                                required:
                                - id
                                - name
                                - status
                                - operations
                                - isImmutable
                                - isArchived
                                additionalProperties: false
                            required:
                            - id
                            - requester
                            - status
                            - entityId
                            - dateCreated
                            - kind
                            - operationKind
                            - body
                            additionalProperties: false
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /permissions/{permissionId}/assignments/{assignmentId}:
    delete:
      operationId: revokePermission
      summary: Revoke Permission
      tags:
      - Permissions
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Revokes a permission (role) assignment, removing the identity's access to the operations granted by the permission.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Permissions:Revoke`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: ID of the permission (also referred to as "role" in the dashboard).
        required: true
        description: ID of the permission (also referred to as "role" in the dashboard).
        name: permissionId
        in: path
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^as-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: ID of the permission assignment.
        required: true
        description: ID of the permission assignment.
        name: assignmentId
        in: path
      - schema:
          type:
          - boolean
          - 'null'
          default: false
          description: If true, bypasses the approval process and revokes immediately.
        required: false
        description: If true, bypasses the approval process and revokes immediately.
        name: force
        in: query
      responses:
        '200':
          description: Success
components:
  schemas:
    ChangeRequestRequester:
      type: object
      properties:
        userId:
          type: string
        tokenId:
          type: string
        appId:
          type: string
      required:
      - userId
      description: The user who initiated the change request.
    Permission:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^pm-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: ID of the permission (also referred to as "role" in the dashboard).
          example: pm-37vj4-jkr4l-lc9945spfftkne57
        name:
          type: string
          description: Human-readable name of the permission (role).
        operations:
          type: array
          items:
            type: string
          description: List of API operations this permission grants access to. See [Permissions List](https://docs.dfns.co/core-concepts/roles-and-permissions#list-of-permissions) for available operations.
        status:
          type: string
          enum:
          - Active
          description: Current status of the permission.
        isImmutable:
          type: boolean
          description: Whether this permission is system-managed and cannot be modified.
        isArchived:
          type: boolean
          description: Whether this permission has been archived (soft-deleted).
        dateCreated:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the permission was created.'
          example: 2023-04-14 20:41:28.715000+00:00
        dateUpdated:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the permission was last updated.'
          example: 2023-04-14 20:41:28.715000+00:00
      required:
      - id
      - name
      - operations
      - status
      - isImmutable
      - isArchived
      - dateCreated
      - dateUpdated
      additionalProperties: false
  securitySchemes:
    authenticationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '**Bearer Token:** Used to authenticate API requests.

        More details how to generate the token: [Authentication flows](https://docs.dfns.co/api-reference/auth/login-flows)'
    userActionSignature:
      type: apiKey
      in: header
      name: X-DFNS-USERACTION
      description: '**User Action Signature:** Used to sign the change-inducing API requests.

        More details how to generate the token: [User Action Signing flows](https://docs.dfns.co/api-reference/auth/signing-flows)'
