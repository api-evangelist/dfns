openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Permissions API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Permissions
paths:
  /permissions/{permissionId}/archive:
    put:
      operationId: archivePermission
      summary: Archive Permission
      tags:
      - Permissions
      security:
      - authenticationToken: []
        userActionSignature: []
      description: '@deprecated in favor of "deletePermission".

        Deletes a permission (aka "Role").'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Permissions:Delete`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: ID of the permission (also referred to as "role" in the dashboard).
        required: true
        description: ID of the permission (also referred to as "role" in the dashboard).
        name: permissionId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isArchived:
                  type: boolean
                  description: '@deprecated - use "deletePermission" method instead'
              required:
              - isArchived
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
  /permissions/{permissionId}:
    delete:
      operationId: deletePermission
      summary: Delete Permission
      tags:
      - Permissions
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Deletes a permission (aka "Role").
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Permissions:Delete`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: ID of the permission (also referred to as "role" in the dashboard).
        required: true
        description: ID of the permission (also referred to as "role" in the dashboard).
        name: permissionId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: {}
    get:
      operationId: getPermission
      summary: Get Permission
      tags:
      - Permissions
      security:
      - authenticationToken: []
      description: Retrieves a permission (role) by ID, including any pending change request.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Permissions:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: ID of the permission (also referred to as "role" in the dashboard).
        required: true
        description: ID of the permission (also referred to as "role" in the dashboard).
        name: permissionId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Permission'
                - type: object
                  properties:
                    pendingChangeRequest:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 64
                          pattern: ^cr-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                          description: ID of the change request.
                          example: cr-6uunn-bm6ja-f6rmod5kqrk5rbel
                        requester:
                          $ref: '#/components/schemas/ChangeRequestRequester'
                        status:
                          type: string
                          enum:
                          - Applied
                          - Failed
                          - Pending
                          - Rejected
                          description: Current status of the change request.
                        entityId:
                          type: string
                          description: ID of the entity being changed.
                        userActionId:
                          type: string
                          description: User action of the change request.
                        dateCreated:
                          type: string
                          format: date-time
                          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the change request was created.'
                          example: 2023-04-14 20:41:28.715000+00:00
                        dateResolved:
                          type: string
                          format: date-time
                          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the change request was resolved.'
                          example: 2023-04-14 20:41:28.715000+00:00
                        approvalId:
                          type: string
                          minLength: 1
                          maxLength: 64
                          pattern: ^ap-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                          example: ap-2a9in-tt2a1-983lho480p35ejd0
                        kind:
                          type: string
                          enum:
                          - Permission
                        operationKind:
                          type: string
                          enum:
                          - Update
                        body:
                          type: object
                          properties:
                            id:
                              type: string
                              minLength: 1
                              maxLength: 64
                              pattern: ^pm-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                              description: ID of the permission (also referred to as "role" in the dashboard).
                              example: pm-37vj4-jkr4l-lc9945spfftkne57
                            name:
                              type: string
                              description: Human-readable name of the permission (role).
                            status:
                              type: string
                              enum:
                              - Active
                              description: Current status of the permission.
                            operations:
                              type: array
                              items:
                                type: string
                              description: List of API operations this permission grants access to. See [Permissions List](https://docs.dfns.co/core-concepts/roles-and-permissions#list-of-permissions) for available operations.
                            isImmutable:
                              type: boolean
                              description: Whether this permission is system-managed and cannot be modified.
                            isArchived:
                              type: boolean
                              description: Whether this permission has been archived (soft-deleted).
                          required:
                          - id
                          - name
                          - status
                          - operations
                          - isImmutable
                          - isArchived
                          additionalProperties: false
                      required:
                      - id
                      - requester
                      - status
                      - entityId
                      - dateCreated
                      - kind
                      - operationKind
                      - body
                      additionalProperties: false
    put:
      operationId: updatePermission
      summary: Update Permission
      tags:
      - Permissions
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Updates the name or operations of an existing permission (role).
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Permissions:Update`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: ID of the permission (also referred to as "role" in the dashboard).
        required: true
        description: ID of the permission (also referred to as "role" in the dashboard).
        name: permissionId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: New name for the permission (role).
                operations:
