  /permissions/{permissionId}/assignments:
    post:
      operationId: assignPermission
      summary: Assign Permission
      tags:
      - Permissions
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Assigns a permission (role) to an identity (user, PAT, service account or user group), granting it access to the operations defined in the permission. Returns the assignment on success (200), or a pending change request if approval is required (202).
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Permissions:Assign`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: ID of the permission (also referred to as "role" in the dashboard).
        required: true
        description: ID of the permission (also referred to as "role" in the dashboard).
        name: permissionId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identityId:
                  type: string
                  minLength: 1
                  description: ID of the identity to assign the permission to. Can be a user ID, a service account ID, a personal access token (PAT) ID, or a user group ID.
              required:
              - identityId
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^as-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: ID of the permission assignment.
                    example: as-1vcmc-qrek0-6b4vii9pln60907e
                  permissionId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^pm-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: ID of the permission (also referred to as "role" in the dashboard).
                    example: pm-37vj4-jkr4l-lc9945spfftkne57
                  identityId:
                    type: string
                    description: ID of the identity the permission is assigned to. Can be a user ID, a service account ID, a personal access token (PAT) ID, or a user group ID.
                  isImmutable:
                    type: boolean
                    description: Whether this assignment is system-managed and cannot be modified.
                  dateCreated:
                    type: string
                    format: date-time
                    description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the assignment was created.'
                    example: 2023-04-14 20:41:28.715000+00:00
                  dateUpdated:
                    type: string
                    format: date-time
                    description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the assignment was last updated.'
                    example: 2023-04-14 20:41:28.715000+00:00
                required:
                - id
                - permissionId
                - identityId
                - isImmutable
                - dateCreated
                - dateUpdated
                additionalProperties: false
    get:
      operationId: listAssignments
      x-dfns-deprecated-operation-id: listPermissionAssignments
      summary: List Permission Assignments
      tags:
      - Permissions
      security:
      - authenticationToken: []
      description: Lists all permission (role) assignments for a given permission.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Permissions:Assignments:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: ID of the permission (also referred to as "role" in the dashboard).
        required: true
        description: ID of the permission (also referred to as "role" in the dashboard).
        name: permissionId
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                      - type: object
                        properties:
                          id:
                            type: string
                            minLength: 1
                            maxLength: 64
                            pattern: ^as-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                            description: ID of the permission assignment.
                            example: as-1vcmc-qrek0-6b4vii9pln60907e
                          permissionId:
                            type: string
                            minLength: 1
                            maxLength: 64
                            pattern: ^pm-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                            description: ID of the permission (also referred to as "role" in the dashboard).
                            example: pm-37vj4-jkr4l-lc9945spfftkne57
                          identityId:
                            type: string
                            description: ID of the identity the permission is assigned to. Can be a user ID, a service account ID, a personal access token (PAT) ID, or a user group ID.
                          isImmutable:
                            type: boolean
                            description: Whether this assignment is system-managed and cannot be modified.
                          dateCreated:
                            type: string
                            format: date-time
                            description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the assignment was created.'
                            example: 2023-04-14 20:41:28.715000+00:00
                          dateUpdated:
                            type: string
                            format: date-time
                            description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the assignment was last updated.'
                            example: 2023-04-14 20:41:28.715000+00:00
                        required:
                        - id
                        - permissionId
                        - identityId
                        - isImmutable
                        - dateCreated
                        - dateUpdated
                        additionalProperties: false
                      - type: object
                        properties:
                          pendingChangeRequest:
                            type: object
                            properties:
                              id:
                                type: string
                                minLength: 1
                                maxLength: 64
                                pattern: ^cr-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                                description: ID of the change request.
                                example: cr-6uunn-bm6ja-f6rmod5kqrk5rbel
                              requester:
                                $ref: '#/components/schemas/ChangeRequestRequester'
                              status:
                                type: string
                                enum:
                                - Applied
                                - Failed
                                - Pending
                                - Rejected
                                description: Current status of the change request.
                              entityId:
                                type: string
                                description: ID of the entity being changed.
                              userActionId:
                                type: string
                                description: User action of the change request.
                              dateCreated:
                                type: string
                                format: date-time
                                description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the change request was created.'
                                example: 2023-04-14 20:41:28.715000+00:00
                              dateResolved:
                                type: string
                                format: date-time
                                description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the change request was resolved.'
                                example: 2023-04-14 20:41:28.715000+00:00
                              approvalId:
                                type: string
                                minLength: 1
                                maxLength: 64
                                pattern: ^ap-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                                example: ap-2a9in-tt2a1-983lho480p35ejd0
                              kind:
                                type: string
                                enum:
                                - Assignment
                              operationKind:
                                type: string
                                enum:
                                - Create
                                - Delete
                              body:
                                type: object
                                properties:
                                  id:
                                    type: string
                                    minLength: 1
                                    maxLength: 64
                                    pattern: ^as-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                                    description: ID of the permission assignment.
                                    example: as-1vcmc-qrek0-6b4vii9pln60907e
                                  permissionId:
                                    type: string
                                    minLength: 1
                                    maxLength: 64
                                    pattern: ^pm-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                                    description: ID of the permission (also referred to as "role" in the dashboard).
                                    example: pm-37vj4-jkr4l-lc9945spfftkne57
                                  identityId:
                                    type: string
                                    description: ID of the identity the permission is assigned to. Can be a user ID, a service account ID, or a personal access token (PAT) ID.
                                  isImmutable:
                                    type: boolean
                                    description: Whether this assignment is system-managed and cannot be modified.
                                required:
                                - id
                                - permissionId
                                - identityId
                                - isImmutable
                                additionalProperties: false
                            required:
                            - id
                            - requester
                            - status
                            - entityId
                            - dateCreated
                            - kind
                            - operationKind
                            - body
                            additionalProperties: false
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /permissions:
    post:
      operationId: createPermission
      summary: Create Permission
      tags:
      - Permissions
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Creates a new permission (also referred to as "role" in the dashboard) that grants access to the specified API operations.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Permissions:Create`: Always required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Human-readable name for the permission (role).
                operations:
                  type: array
                  items:
                    anyOf:
                    - type: string
                      enum:
                      - Auth:Logs:Read
                      - Auth:Users:Create
                      - Auth:Users:Read
                      - Auth:Users:Update
                      - Auth:Users:Activate
                      - Auth:Users:Deactivate
                      - Auth:Users:Delete
                      - Auth:UserGroups:Create
