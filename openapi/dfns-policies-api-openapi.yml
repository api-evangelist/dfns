components:
  schemas:
    VaultLockReplaceRequest:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-lrr-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault lock replace request id.
          example: vlt-lrr-0a29c-jl128-3cec0nntle8k1jjf
        vaultId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault id.
          example: vlt-5vbsp-u62g1-ostmunqgds5o9tc2
        lockId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-lck-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault lock id.
          example: vlt-lck-0lf1e-8a8ag-2ak7vrvusrj3so0j
        network:
          type: string
        tid:
          type: string
        currentAmount:
          type: string
          description: The total locked amount at the time the update was requested.
        newAmount:
          type: string
          description: The requested new total locked amount.
        reason:
          type: string
          description: The reason or note the update is requested with.
        requester:
          type: object
          properties:
            userId:
              type: string
          required:
          - userId
          additionalProperties: false
        rejectionReason:
          type: string
          description: Set when the request was rejected (policy block or approval denial).
        status:
          type: string
          enum:
          - Pending
          - Executed
          - Rejected
          description: Vault lock request status.
        approvalId:
