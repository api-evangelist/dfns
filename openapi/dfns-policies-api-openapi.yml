    VaultReleaseQuarantineRequest:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-rqr-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault release quarantine request id.
          example: vlt-rqr-0ipkf-csl11-mp40010tudj6ir2a
        vaultId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault id.
          example: vlt-5vbsp-u62g1-ostmunqgds5o9tc2
        quarantineId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-qua-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault quarantine id.
          example: vlt-qua-7ein9-uptvv-uuegt9p5n69ocs4q
        network:
          type: string
        transactionHash:
          type: string
        kytResult:
          oneOf:
          - type: object
            properties:
              provider:
                type: string
                enum:
                - Chainalysis
              transferReference:
                type: string
              providerUserId:
                type: string
                description: Grouping key registered with the provider ("userId" in Chainalysis terms).
              externalId:
                type: string
                description: Provider-side id of the registered transfer.
              alerts:
                type: array
                items:
                  type: object
                  properties:
                    level:
                      type: string
                      enum:
                      - Low
                      - Medium
                      - High
                      - Severe
                    categoryId:
                      type:
                      - number
                      - 'null'
                  required:
                  - level
                  - categoryId
              exposure:
                type: object
                properties:
                  direct:
                    type: object
                    properties:
                      categoryId:
                        type:
                        - number
                        - 'null'
                      name:
                        type:
                        - string
                        - 'null'
                    required:
                    - categoryId
                    - name
                required:
                - direct
              maxAlertLevel:
                type:
                - string
                - 'null'
                enum:
                - Low
                - Medium
                - High
                - Severe
            required:
            - provider
            - transferReference
            - providerUserId
            - externalId
            - alerts
            - exposure
            - maxAlertLevel
            title: Chainalysis KYT Result
          - type: object
            properties:
              provider:
                type: string
                enum:
                - Elliptic
              transferReference:
                type: string
              providerUserId:
                type: string
                description: Grouping key registered with the provider ("userId" in Chainalysis terms).
              externalId:
                type: string
                description: Provider-side id of the registered transfer.
              alerts:
                type: array
                items:
                  type: object
                  properties:
                    categoryId:
                      type:
                      - string
                      - 'null'
                  required:
                  - categoryId
              riskScore:
                type:
                - number
                - 'null'
            required:
            - provider
            - transferReference
            - providerUserId
            - externalId
            - alerts
            - riskScore
            title: Elliptic KYT Result
          description: KYT screening result recorded for the quarantined deposit, when available. Policies of rule kind `ChainalysisQuarantineScreening` evaluate this stored result when the release is requested.
        requester:
          type: object
          properties:
            userId:
              type: string
          required:
          - userId
          additionalProperties: false
        reason:
          type: string
        rejectionReason:
          type: string
          description: Set when the request was rejected (policy block or approval denial).
        status:
          type: string
          enum:
          - Pending
          - Executed
          - Rejected
          description: Vault release quarantine request status.
        approvalId:
          type: string
          description: Set when the release is pending a policy approval.
        dateCreated:
          type: string
          format: date-time
      required:
      - id
      - vaultId
      - quarantineId
      - network
      - transactionHash
      - requester
      - status
      - dateCreated
      additionalProperties: false
      description: Request to release quarantined funds into the available balance. Executed immediately unless a policy requires approval, in which case it stays Pending until the approval resolves.
