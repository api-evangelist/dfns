  /v2/policies/travel-rule/sumsub/public-key:
    get:
      operationId: getSumsubTravelRulePublicKey
      summary: Get Sumsub Travel Rule public key
      tags:
      - Policies
      security:
      - authenticationToken: []
      description: Retrieve the RSA public key (JWK, RFC 7517) of the org's Sumsub Travel Rule integration. Use it to JWE-encrypt (RSA-OAEP-256 / A256GCM, compact serialization) the JWS-signed IVMS101 payload client-side before submitting a transfer screened by a Sumsub Travel Rule policy. Requires Travel Rule to be enabled for the tenant and an activated Sumsub integration on the org.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Wallets:Transfers:Create`: Always required."
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  kty:
                    type: string
                    enum:
                    - RSA
                  kid:
                    type: string
                    minLength: 1
                    maxLength: 256
                  n:
                    type: string
                    minLength: 342
                    maxLength: 2048
                    pattern: ^(?!A[A-P][A-Za-z0-9_-])(?:[A-Za-z0-9_-]{4})*(?:[A-Za-z0-9_-]{2,3})?$
                  e:
                    type: string
                    minLength: 1
                    maxLength: 16
                    pattern: ^(?!A[A-P][A-Za-z0-9_-])(?:[A-Za-z0-9_-]{4})*(?:[A-Za-z0-9_-]{2,3})?$
                  use:
                    type: string
                    maxLength: 16
                required:
                - kty
                - kid
                - n
                - e
