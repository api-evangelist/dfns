openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Policies API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Policies
paths:
  /v2/policies/{policyId}:
    delete:
      operationId: deletePolicy
      summary: Delete Policy
      tags:
      - Policies
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Delete an existing policy.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Policies:Delete`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: policyId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Policy'
    get:
      operationId: getPolicy
      summary: Get Policy
      tags:
      - Policies
      security:
      - authenticationToken: []
      description: Retrieve information about a specific policy.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Policies:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: policyId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Policy'
                - type: object
                  properties:
                    pendingChangeRequest:
                      type: object
                      properties:
                        id:
                          type: string
                        requester:
                          $ref: '#/components/schemas/ChangeRequestRequester'
                        kind:
                          type: string
                          enum:
                          - Policy
                        operationKind:
                          type: string
                          enum:
                          - Update
                        status:
                          type: string
                          enum:
                          - Applied
                          - Failed
                          - Pending
                          - Rejected
                        entityId:
                          type: string
                        dateCreated:
                          type: string
                          format: date-time
                        dateResolved:
                          type: string
                          format: date-time
                        approvalId:
                          type: string
                        body:
                          $ref: '#/components/schemas/Policy'
                      required:
                      - id
                      - requester
                      - kind
                      - operationKind
                      - status
                      - entityId
                      - dateCreated
                      - body
                      additionalProperties: false
    put:
      operationId: updatePolicy
      summary: Update Policy
      tags:
      - Policies
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Update an existing policy. The policy status is not editable through this endpoint — the update body has no `status` field. To deactivate a policy, use the Archive Policy endpoint instead.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Policies:Update`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
        required: true
        name: policyId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  name:
                    type: string
                  activityKind:
                    type: string
                    enum:
                    - Registry:Addresses:Modify
                  rule:
                    type: object
                    properties:
                      kind:
                        type: string
                        enum:
                        - AlwaysTrigger
                      configuration:
                        type: object
                        properties: {}
                        additionalProperties: false
                    required:
                    - kind
                    additionalProperties: false
                    description: This rule will always be triggered, meaning that if this rule is defined on a policy, the policy will always trigger the policy action, regardless of the activity details.
                    title: AlwaysTrigger
                  action:
                    oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - RequestApproval
                        approvalGroups:
                          type: array
                          items:
                            type: object
                            properties:
                              name:
                                type: string
                              quorum:
                                type: integer
                                minimum: 1
                              approvers:
                                type: object
                                properties:
                                  userId:
                                    type: object
                                    properties:
                                      in:
                                        type: array
                                        items:
                                          type: string
                                          minLength: 1
                                        minItems: 1
                                        maxItems: 100
                                    required:
                                    - in
                                    additionalProperties: false
                                    description: Users and service accounts who may approve.
                                  userGroupId:
                                    type: object
                                    properties:
                                      in:
                                        type: array
                                        items:
                                          type: string
                                          minLength: 1
                                          maxLength: 64
                                          pattern: ^ug-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                                          description: User group id.
                                          example: ug-139tf-f58l8-lsbt6dp47lfsdvgh
                                        minItems: 1
                                        maxItems: 100
                                    required:
                                    - in
                                    additionalProperties: false
                                    description: User groups whose members may approve.
                                additionalProperties: false
                              initiatorCanApprove:
                                type: boolean
                                description: Whether the initiator of the activity can participate in the approval.
                              serviceAccountsCanApprove:
                                type: boolean
                                description: Whether service accounts can participate in the approval for this group.
                            required:
                            - quorum
                            - approvers
                            additionalProperties: false
                          minItems: 1
                        autoRejectTimeout:
                          type:
                          - integer
                          - 'null'
                          minimum: 1
                      required:
                      - kind
                      - approvalGroups
                      additionalProperties: false
                      description: "\nThis action means that activity will first require an Approval process to be completed before it can  be executed (or be aborted if someone rejects it during the approval process).\n\nOne or several groups of approvers need to be specified. These groups define who is allowed to approve / reject an activity.\n\nThe activity will only be executed if all approver groups reach their \"quorum\" of approvals. Otherwise, if any one user within any approver group rejects, then the activity is aborted and the call is not executed.\n\nThe example below shows a `RequestApproval` action, configured with one approval group requiring 2 approvals amongst three specific users.\n\n```json\n{\n  \"action\": {\n    \"kind\": \"RequestApproval\",\n    \"autoRejectTimeout\": 60, // minutes\n    \"approvalGroups\": [\n      {\n        \"name\": \"Admins\",\n        \"quorum\": 2, // only 2 approvers required in that group \n        \"approvers\": {\n          \"userId\": {\n            \"in\": [\"us-...1\", \"us-...2\", \"us-...3\"],\n          }\n        }\n      }\n    ],\n\n  }\n}\n```\n\n**Don't lock yourself up**\n\nBy default, users cannot approve an activity they initiated themselves, even if they are in an approval group. To allow this, you must set `initiatorCanApprove: true`.\n\n*Example 1:* For any wallet transfer, a policy is setup to require approval from **1 specific admin user** (eg. the CEO). `initiatorCanApprove` was not set to `true`. If the CEO himself initiates a transfer, no-one can approve his transfer and it's stuck.\n\n*Example 2:* Company has only 3 users. A policy is setup to require approval from **any 3 users** (`quorum: 3`) for any modification of a policy. `initiatorCanApprove` was not set to `true`. In this case, they are locked, and the policy cannot be modified: whoever requests a modification cannot approve, and the policy is therefore always missing one approver. To unlock, they would need to invite a new user and give him the rights to approve as well.\n    "
                      title: RequestApproval
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Block
                      required:
                      - kind
                      additionalProperties: false
                      description: "This action means that the activity will be blocked if the policy is triggered.\n\n```json\n{\n  \"action\": {\n    \"kind\": \"Block\"\n  }\n}\n```\n"
                      title: Block
                  filters:
                    type: object
                    properties: {}
                required:
                - name
                - activityKind
                - rule
                - action
                additionalProperties: false
                description: ''
                title: Registry:Addresses:Modify
