    Requester:
      type: object
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^us-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User id.
          example: us-6b58p-r53sr-rlrd3l5cj3uc4ome
        tokenId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^to-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Token id.
          example: to-202a0-cdo33-o65mbt6q758lvvnt
      required:
      - userId
      description: The user who initiated the request.
    VaultLockRequest:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-lkr-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault lock request id.
          example: vlt-lkr-2ic5h-80vdm-jfi6ohbf8spv10cr
        vaultId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Vault id.
          example: vlt-5vbsp-u62g1-ostmunqgds5o9tc2
        network:
          type: string
        tid:
          type: string
        amount:
          type: string
        externalId:
          type: string
        reason:
          type: string
          description: The reason or note the lock is requested with.
        beneficiary:
          type: string
          description: The address the locked funds are sent to on transfer.
        requester:
          type: object
          properties:
            userId:
              type: string
          required:
          - userId
          additionalProperties: false
        rejectionReason:
          type: string
          description: Set when the request was rejected (policy block or approval denial).
        status:
          type: string
          enum:
          - Pending
          - Executed
          - Rejected
          description: Vault lock request status.
        approvalId:
          type: string
          description: Set when the lock creation is pending a policy approval.
        lockId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-lck-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Set when the request was executed and the lock created.
          example: vlt-lck-0lf1e-8a8ag-2ak7vrvusrj3so0j
        dateCreated:
          type: string
          format: date-time
      required:
      - id
      - vaultId
      - network
      - tid
      - amount
      - requester
      - status
      - dateCreated
      additionalProperties: false
      description: Request to lock vault funds. Executed immediately unless a policy requires approval, in which case it stays Pending until the approval resolves.
    Policy:
      oneOf:
      - type: object
        properties:
          id:
            type: string
          name:
            type: string
          status:
            type: string
            enum:
            - Active
            - Archived
          dateCreated:
            type: string
          dateUpdated:
            type: string
          activityKind:
            type: string
            enum:
            - Registry:Addresses:Modify
          rule:
            type: object
            properties:
              kind:
                type: string
                enum:
                - AlwaysTrigger
              configuration:
                type: object
                properties: {}
                additionalProperties: false
            required:
            - kind
            additionalProperties: false
            description: This rule will always be triggered, meaning that if this rule is defined on a policy, the policy will always trigger the policy action, regardless of the activity details.
            title: AlwaysTrigger
          action:
            oneOf:
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                  - RequestApproval
                approvalGroups:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      quorum:
                        type: integer
                        minimum: 1
                      approvers:
                        type: object
                        properties:
                          userId:
                            type: object
                            properties:
                              in:
                                type: array
                                items:
                                  type: string
                                  minLength: 1
                                minItems: 1
                                maxItems: 100
                            required:
                            - in
                            additionalProperties: false
                            description: Users and service accounts who may approve.
                          userGroupId:
                            type: object
                            properties:
                              in:
                                type: array
                                items:
                                  type: string
                                  minLength: 1
                                  maxLength: 64
                                  pattern: ^ug-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                                  description: User group id.
                                  example: ug-139tf-f58l8-lsbt6dp47lfsdvgh
                                minItems: 1
                                maxItems: 100
                            required:
                            - in
                            additionalProperties: false
                            description: User groups whose members may approve.
                        additionalProperties: false
                      initiatorCanApprove:
                        type: boolean
                        description: Whether the initiator of the activity can participate in the approval.
                      serviceAccountsCanApprove:
                        type: boolean
                        description: Whether service accounts can participate in the approval for this group.
                    required:
                    - quorum
                    - approvers
                    additionalProperties: false
                  minItems: 1
                autoRejectTimeout:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
              required:
              - kind
              - approvalGroups
              additionalProperties: false
              description: "\nThis action means that activity will first require an Approval process to be completed before it can  be executed (or be aborted if someone rejects it during the approval process).\n\nOne or several groups of approvers need to be specified. These groups define who is allowed to approve / reject an activity.\n\nThe activity will only be executed if all approver groups reach their \"quorum\" of approvals. Otherwise, if any one user within any approver group rejects, then the activity is aborted and the call is not executed.\n\nThe example below shows a `RequestApproval` action, configured with one approval group requiring 2 approvals amongst three specific users.\n\n```json\n{\n  \"action\": {\n    \"kind\": \"RequestApproval\",\n    \"autoRejectTimeout\": 60, // minutes\n    \"approvalGroups\": [\n      {\n        \"name\": \"Admins\",\n        \"quorum\": 2, // only 2 approvers required in that group \n        \"approvers\": {\n          \"userId\": {\n            \"in\": [\"us-...1\", \"us-...2\", \"us-...3\"],\n          }\n        }\n      }\n    ],\n\n  }\n}\n```\n\n**Don't lock yourself up**\n\nBy default, users cannot approve an activity they initiated themselves, even if they are in an approval group. To allow this, you must set `initiatorCanApprove: true`.\n\n*Example 1:* For any wallet transfer, a policy is setup to require approval from **1 specific admin user** (eg. the CEO). `initiatorCanApprove` was not set to `true`. If the CEO himself initiates a transfer, no-one can approve his transfer and it's stuck.\n\n*Example 2:* Company has only 3 users. A policy is setup to require approval from **any 3 users** (`quorum: 3`) for any modification of a policy. `initiatorCanApprove` was not set to `true`. In this case, they are locked, and the policy cannot be modified: whoever requests a modification cannot approve, and the policy is therefore always missing one approver. To unlock, they would need to invite a new user and give him the rights to approve as well.\n    "
              title: RequestApproval
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                  - Block
              required:
              - kind
              additionalProperties: false
              description: "This action means that the activity will be blocked if the policy is triggered.\n\n```json\n{\n  \"action\": {\n    \"kind\": \"Block\"\n  }\n}\n```\n"
              title: Block
          filters:
            type: object
            properties: {}
