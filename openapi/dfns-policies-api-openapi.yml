              title: TransactionRecipientWhitelist
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                  - TransactionAmountLimit
                configuration:
                  type: object
                  properties:
                    limit:
                      type: number
                      description: Amount limit in `currency`
