                                kind:
                                  type: string
                                  enum:
                                  - Vaults:CreateLock
                                lockRequest:
                                  $ref: '#/components/schemas/VaultLockRequest'
                              required:
                              - kind
                              - lockRequest
                              description: A "`Vaults:CreateLock`" activity represents a request to lock vault funds, created as a result of calling the endpoint CreateVaultLock (`POST /vaults/:vaultId/locks`). The lock is not created until the approval process completes.
