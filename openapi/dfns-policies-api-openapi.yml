                      type: string
                      enum:
                      - USD
                      description: Fiat currency, currently only `USD`
                  required:
                  - limit
                  - currency
                  additionalProperties: false
              required:
              - kind
              - configuration
              additionalProperties: false
              description: 'This rule will trigger if the wallet activity detected is transferring some value which amount is greater than a given limit.


                The limit is expressed in a fiat `currency` and evaluated against the market value of the transfer. To set a threshold in the asset''s own units instead, use `TransactionAmountLimitNominal`.


                Note: If the amount of the wallet activity cannot be evaluated for any reason (eg. market prices are not available, or eg. the amount cannot be inferred from a wallet signature request, etc.), by default the rule will trigger the policy (this is called "failing closed" and is generally considered a security best practice).'
              title: TransactionAmountLimit
            - type: object
              properties:
                kind:
                  type: string
                  enum:
                  - TransactionAmountLimitNominal
                configuration:
                  type: object
                  properties:
                    assets:
                      type: array
                      items:
                        type: object
                        properties:
                          network:
                            allOf:
                            - $ref: '#/components/schemas/Network'
                            - description: The network the asset lives on.
                          tid:
                            type: string
                            minLength: 1
                            maxLength: 200
                            pattern: ^[a-z0-9_]+:[^\s](?:[ ]?[^\s])*$
                            description: 'The Dfns token identifier of the asset, for example `native:eth` or `erc20:0xa0b86991c6218b36c1d19d4a2e9eb0ce3606eb48`. Must be canonical: token contract addresses on hex based networks are lower cased.'
                          limit:
                            type: string
                            pattern: ^\d+$
                            description: Amount limit in the minimum denomination of the asset, as an integer string, matching how a transfer expresses its amount. For an 18 decimal token `"5000000000000000000"` is 5 whole tokens.
                        required:
                        - network
                        - tid
                        - limit
                        additionalProperties: false
                      minItems: 1
                      maxItems: 100
                      description: The assets this rule applies to, each with its own limit. A transfer of an asset that is not listed does not trigger the rule. The limit applies to each matching transfer individually; nothing is accumulated across transfers.
                  required:
                  - assets
                  additionalProperties: false
              required:
              - kind
              - configuration
              additionalProperties: false
              description: 'This rule will trigger if the wallet activity detected is transferring more of a listed asset than that asset''s limit.


                Each limit is expressed in the minimum denomination of its own asset and compared against the transferred amount directly, so the verdict needs no market data and does not move with a price. To set a threshold on the fiat value of a transfer instead, use `TransactionAmountLimit`.


                Limits are asset exact: an asset is identified by its network and its Dfns token identifier, so a wrapped or staked derivative is a different asset from the thing it tracks, and a transfer of an asset the rule does not list will not trigger it.


                Note: If the transferred amount or the asset cannot be determined for any reason, by default the rule will trigger the policy (this is called "failing closed" and is generally considered a security best practice).'
              title: TransactionAmountLimitNominal
