                      additionalProperties: false
                      description: "This rule can only be used once the Notabene integration is activated from the Dfns dashboard settings (see more on [Notabene](https://docs.dfns.co/integrations/travel-rule/notabene) integration page).\n    \n    It's a rule based on [Notabene Travel Rule](https://docs.dfns.co/integrations/travel-rule/notabene) integration. It ***ONLY*** applies to Dfns [Transfer Asset](https://docs.dfns.co/api-reference/wallets/transfer-asset) Api Calls. It is NOT supported for Transfers initiated via the dashboard. Upon transfer attempt with an optional [TravelRule](https://docs.dfns.co/api-reference/wallets/transfer-asset#body-travel-rule) payload, we will call Notabene's APIs on your behalf to both confirm the validity of the travel rule message and submit it for processing. Dfns then waits for a response from the counterparty (for custodial transfers) or Notabene (for non-custodial transfers).\n\nThe travel-rule vendor is determined by this rule's `configuration.vendor`, and the transfer's `travelRule` payload must be of the matching kind — a mismatch blocks the transfer. Because of this, a given wallet must be covered by travel-rule policies of a single vendor: scoping two travel-rule policies of different vendors to the same wallet would block every transfer to it (whichever payload is sent always mismatches the other vendor's rule).\n\nIt's called \"Pre\"-screening, because the transaction is not on chain yet, it's still a transaction attempt (before the transaction actually make it on chain)."
