    SignatureRequest:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^sig-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Signature id.
          example: sig-4sfvl-f4iha-umighfi3hk4t54dr
        keyId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^key-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Key id.
          example: key-01snl-t56gb-j8tsok0vn802p80i
        requester:
          $ref: '#/components/schemas/Requester'
        requestBody:
          oneOf:
          - type: object
            properties:
              kind:
                type: string
                enum:
                - Hash
              hash:
                type: string
                pattern: ^(0x)?[0-9a-fA-F]{64}$
                description: 32-byte hash in hex encoded format.
              taprootMerkleRoot:
                type: string
                pattern: ^(0x)?([0-9A-Fa-f]{64})?$
                description: Required when signing with a Schnorr key. Specify the merkle root for tweaking the signing key, or the empty string "" to tweak with the default merkle root.
              network:
                $ref: '#/components/schemas/Network'
              blockchainKind:
                $ref: '#/components/schemas/BlockchainKind'
              externalId:
                type: string
                minLength: 1
                maxLength: 50
                description: A unique ID from your system. It can be leveraged to be used as an idempotency key (read more [here](https://docs.dfns.co/api-reference/idempotency)).
            required:
            - kind
            - hash
            additionalProperties: false
            description: All cryptographic scheme support hash signing. Different blockchains will apply different hash functions to compute the hash.
            title: Hash
          - type: object
            properties:
              kind:
                type: string
                enum:
                - Message
              message:
                type: string
                pattern: ^(0x)?([0-9a-fA-F][0-9a-fA-F])*$
                description: An arbitrary hex encoded message.
              network:
                $ref: '#/components/schemas/Network'
              blockchainKind:
                $ref: '#/components/schemas/BlockchainKind'
              externalId:
                type: string
                minLength: 1
                maxLength: 50
                description: A unique ID from your system. It can be leveraged to be used as an idempotency key (read more [here](https://docs.dfns.co/api-reference/idempotency)).
            required:
            - kind
            - message
            additionalProperties: false
            description: Signs an arbitrary hex encoded arbitrary message.
            title: Message
          - type: object
            properties:
              kind:
                type: string
                enum:
                - Transaction
              transaction:
                anyOf:
                - type: string
                  pattern: ^(0x)?([0-9a-fA-F][0-9a-fA-F])*$
                - type: object
                  properties: {}
                  description: Network-specific JSON transaction object. The accepted fields depend on the target network. For EVM chains the shape matches the EVM transaction object of [Sign and Broadcast Transaction](https://docs.dfns.co/api-reference/wallets/sign-and-broadcast-transaction) (for example `to`, `value`, `data`, `nonce`, `gasLimit`, `maxFeePerGas`, `maxPriorityFeePerGas`). For other JSON networks (such as Starknet or Concordium), refer to the per-network formats described below.
                  title: JSON transaction object
                description: The unsigned hex-encoded transaction or JSON object for compatible networks
              network:
                $ref: '#/components/schemas/Network'
              blockchainKind:
                $ref: '#/components/schemas/BlockchainKind'
              externalId:
                type: string
                minLength: 1
                maxLength: 50
                description: A unique ID from your system. It can be leveraged to be used as an idempotency key (read more [here](https://docs.dfns.co/api-reference/idempotency)).
            required:
            - kind
            - transaction
            additionalProperties: false
            description: "Signs an unsigned transaction. The transaction parameter accepts hex-encoded transactions or JSON objects for compatible networks (Concordium, Starknet, Evm).\n\nThe following blockchains only accept JSON transaction objects (not hex strings): Concordium, Starknet.\n\nFor Starknet transactions, you may use invocation request objects (https://github.com/starkware-libs/starknet-specs/blob/v0.8.1/api/starknet_api_openrpc.json#L2621):\n\n| Field                         | Description                                                                                         | Type - Optional                  |\n|-------------------------------|-----------------------------------------------------------------------------------------------------|----------------------------------|\n| type                          | transaction type (always INVOKE              )                                                      | String (required)                |\n| calldata                      | **Array** of encoded function call parameters                                                       | **Array of Strings** (required)  |\n| nonce                         | Transaction nonce in hex format                                                                     | String (required)                |\n| version                       | Transaction version in hex format. Typically \"0x3\" for current transactions                         | String (required)                |\n| resourceBounds                | Gas bounds for L1, L2, and L1 data gas                                                              | Object (required)                |\n| ↳ resourceBounds.l1Gas        | L1 gas configuration with maxAmount and maxPricePerUnit                                             | Object (required)                |\n| ↳ resourceBounds.l2Gas        | L2 gas configuration with maxAmount and maxPricePerUnit                                             | Object (required)                |\n| ↳ resourceBounds.l1DataGas    | L1 data gas configuration with maxAmount and maxPricePerUnit                                        | Object (required)                |\n| tip                           | Transaction tip in hex format. Typically \"0x0\"                                                      | String (required)                |\n| paymasterData                 | Paymaster data array                                                                                | Array of Strings (required)      |\n| accountDeploymentData         | Account deployment data array                                                                       | Array of Strings (required)      |\n| nonceDataAvailabilityMode     | Data availability mode for nonce. Typically \"L1\" for now                                            | String (required)                |\n| feeDataAvailabilityMode       | Data availability mode for fee. Typically \"L1\" for now                                              | String (required)                |\n| chainId                       | The chain identifier in hex format                                                                  | String (required)                |\n| senderAddress                 | The address of the account sending the transaction                                                  | String (required)                |\n\nFor Concordium transactions, use account transaction objects (https://developer.concordium.software/concordium-node-sdk-js/classes/ccd_js_gen.ConcordiumGRPCClient.html):\n\n| Field                          | Description                                                                  | Type - Optional              |\n|--------------------------------|------------------------------------------------------------------------------|------------------------------|\n| header.sender                  | Account address (base58)                                                     | String (required)            |\n| header.nonce                   | Account nonce                                                                | String (required)            |\n| header.expiry                  | Unix epoch seconds expiry                                                    | Number (required)            |\n| header.executionEnergyAmount   | Max NRG for execution                                                        | String (required)            |\n| header.numSignatures           | Number of signatures                                                         | Number (optional)            |\n| payload                        | Transaction payload (type-specific, e.g. Transfer, RegisterData)             | Object (required)            |\n\n```json\n{\n  \"kind\": \"Transaction\",\n  \"blockchainKind\": \"Concordium\",\n  \"transaction\": {\n    \"header\": {\n      \"sender\": \"4FmiTW2L2AccyR36ZBRKNqwQvBJBH8CAXWMLB1dbX5WyZmRo6N\",\n      \"nonce\": \"42\",\n      \"expiry\": 1709510400,\n      \"executionEnergyAmount\": \"501\"\n    },\n    \"payload\": {\n      \"Transfer\": {\n        \"amount\": \"1000000\",\n        \"toAddress\": \"3U4sfVSqGG6XK8g6eho2qRYtnHc4MWJBG1dfxdtPGbfHwFxini\"\n      }\n    }\n  }\n}\n```\n\n```json\n{\n  \"kind\": \"Transaction\",\n  \"transaction\": \"0xe703847735941a82520894f0965f5eb35ace69f01b77031f2cff22daca622887470de4df82000080\"\n}\n```\n\n```json\n{\n  \"kind\": \"Transaction\",\n  \"transaction\": {\n    \"type\": \"INVOKE\",\n    \"calldata\": [\n      \"1\",\n      \"2009894490435840142178314390393166646092438090257831307886760648929397478285\",\n      \"232670485425082704932579856502088130646006032362877466777181098476241604910\",\n      \"3\",\n      \"296727860213112272332383824629975240127004024814636931420022890499591637514\",\n      \"1\",\n      \"0\"\n    ],\n    \"nonce\": \"0x51\",\n    \"version\": \"0x3\",\n    \"resourceBounds\": {\n      \"l1Gas\": { \"maxAmount\": \"0x0\", \"maxPricePerUnit\": \"0x239a01ff6e6c\" },\n      \"l2Gas\": { \"maxAmount\": \"0x1694a0\", \"maxPricePerUnit\": \"0x10c388d00\" },\n      \"l1DataGas\": { \"maxAmount\": \"0x120\", \"maxPricePerUnit\": \"0x98e8\" }\n    },\n    \"tip\": \"0x0\",\n    \"paymasterData\": [],\n    \"accountDeploymentData\": [],\n    \"nonceDataAvailabilityMode\": \"L1\",\n    \"feeDataAvailabilityMode\": \"L1\",\n    \"chainId\": \"0x534e5f5345504f4c4941\",\n    \"senderAddress\": \"0x0535a9762b984c876abe0b164b0ccedb0d23a78978c9fe87e29deae0ea890c72\"\n  }\n}\n```"
            title: Transaction
          - type: object
            properties:
              kind:
                type: string
                enum:
                - Eip191
              message:
                type: string
                pattern: ^(0x)?([0-9a-fA-F][0-9a-fA-F])*$
                description: Hex-encoded message.
              network:
                $ref: '#/components/schemas/Network'
