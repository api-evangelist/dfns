  policy.triggered:
    post:
      summary: Policy Triggered
      description: A policy got triggered upon some activity (the policy rule got evaluated, and it triggered).
      tags:
      - Policies
      requestBody:
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/WebhookEnvelopeBase'
              - type: object
                properties:
                  kind:
                    type: string
