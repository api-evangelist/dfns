                      description: '

                        <Info>

                        This rule can only be used once the Elliptic integration is activated from the Dfns dashboard settings.

                        </Info>


                        This rule uses Elliptic KYT for pre-screening outgoing transfers. Upon transfer attempt, we run a synchronous Elliptic wallet analysis of the destination address, and check the returned risk score against the configured threshold, plus any configured risk rules / categories. If at or above the threshold, or if a configured rule / category matched, the policy is triggered.


                        It''s called "Pre"-screening, because the scanned transaction is not on chain yet, it''s still a transaction attempt.'
