              description: "\n<Info>\nThis rule can only be used once the Chainalysis integration is activated from the Dfns dashboard settings. (see more on [Chainalysis](https://docs.dfns.co/integrations/aml-kyt/chainalysis) integration page).\n</Info>\n\nThis rule can be used on a policy of `activityKind` = `Vaults:ReleaseQuarantine`. When a quarantined vault deposit was screened by Chainalysis KYT, the screening result (alerts & direct exposure) is stored with the quarantine. When a release of the quarantined funds is requested, this rule evaluates that **stored** result — no new Chainalysis call is made. Based on the stored result and the configuration of this rule, the policy will be triggered.\n\nIf the quarantine has **no stored KYT result** (the result was not received yet, the network/asset is not supported by the Chainalysis integration, or screening failed), the rule **always triggers** (fail closed): the release then follows the policy action (approval or block).\n\n```json\n{\n  \"rule\": {\n    \"kind\": \"ChainalysisQuarantineScreening\",\n    \"configuration\": {\n      \"alerts\": {\n        \"alertLevel\": \"LOW\",\n        \"categoryIds\": []\n      },\n      \"exposures\": {\n        \"direct\": {\n          \"categoryIds\": []\n        }\n      }\n    }\n  }\n}\n```\n\n**Configuration**\n\n| Property | Type | Description |\n| --- | --- | --- |\n| `alerts`<br><br>`.alertLevel`* | `string` | Minimum alert level above which the rule should trigger, if any alert was returned in the stored Chainalysis results. Can be `LOW`, `MEDIUM`, `HIGH`, or `SEVERE` |\n| `alerts`<br><br>`.categoryIds`* | list of integers | List of Chainalysis category IDs (see [here](https://docs.chainalysis.com/api/kyt/#categories)). If you leave this list empty, alerts of any category will trigger the rule. Otherwise, if you only want the rule to trigger on specific categories, you can specify some in the list. |\n| `exposures`<br><br>`.direct`<br><br>`.categoryIds`* | list of integers | List of Chainalysis category IDs (see [here](https://docs.chainalysis.com/api/kyt/#categories)). If you leave this list empty, a direct exposure of any category in the stored results will trigger the rule. Otherwise, if you only want the rule to trigger on specific categories, you can specify some in the list. |\n"
