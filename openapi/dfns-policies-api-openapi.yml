                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - ChainalysisTransactionPrescreening
                        configuration:
                          type: object
                          properties:
                            alerts:
                              type: object
                              properties:
                                alertLevel:
                                  type: string
                                  enum:
                                  - LOW
                                  - MEDIUM
                                  - HIGH
                                  - SEVERE
                                categoryIds:
                                  type: array
                                  items:
                                    type: integer
                                    exclusiveMinimum: 0
                              required:
                              - alertLevel
                              - categoryIds
                            exposures:
                              type: object
                              properties:
                                direct:
                                  type: object
                                  properties:
                                    categoryIds:
                                      type: array
                                      items:
                                        type: integer
                                        exclusiveMinimum: 0
                                  required:
                                  - categoryIds
                              required:
                              - direct
                            addresses:
                              type: object
                              properties:
                                categoryIds:
                                  type: array
                                  items:
                                    type: integer
                                    exclusiveMinimum: 0
                              required:
                              - categoryIds
                            userIdTemplate:
                              type: string
                              minLength: 1
                              maxLength: 50
                              pattern: ^([a-zA-Z0-9_:-]|{wallet\.id}|{wallet\.externalId})+$
                              default: dfns
                              description: "**Deprecated** — set `userIdTemplate` on the Chainalysis integration setting instead; when set there, the integration-level template takes precedence over this one.\n\nValue sent to Chainalysis as the \"user ID\". Used by Chainalysis for grouping transaction screenings.\n  \nThis template can include variables, included in brackets. The following variables are currently supported:  `{wallet.id}` and `{wallet.externalId}`.\nAs an example, if you set `userIdTemplate: \"dfns:{wallet.id}_{wallet.externalId}\"`, when your wallet receives a transaction that gets screened by a Chainalysis policy, the \"user ID\" sent to Chainalysis will be `dfns:wa-xxx_yyy` (`wa-xxx` being the wallet ID, and `yyy` being the wallet external ID)."
                            fallbackBehaviours:
                              type: object
                              properties:
                                skipUnscreenableTransaction:
                                  type: boolean
                                skipUnsupportedNetwork:
                                  type: boolean
                                skipUnsupportedAsset:
                                  type: boolean
                                skipChainalysisFailure:
                                  type: boolean
                              required:
                              - skipUnscreenableTransaction
                              - skipUnsupportedNetwork
                              - skipUnsupportedAsset
                              - skipChainalysisFailure
                          required:
                          - alerts
                          - exposures
                          - addresses
                          - fallbackBehaviours
                          additionalProperties: false
                      required:
                      - kind
                      - configuration
                      additionalProperties: false
                      description: "\n<Info>\nThis rule can only be used once the Chainalysis integration is activated from the Dfns dashboard settings. (see more on [Chainalysis](https://docs.dfns.co/integrations/aml-kyt/chainalysis) integration page).\n</Info>\n\nIt's a rule based on [Chainalysis](https://docs.dfns.co/integrations/aml-kyt/chainalysis) KYT integration (Know-Your-Transaction). Upon transfer attempt, we will first register the transfer with Chainalysis (as a [\"withdrawal attempt\"](https://docs.chainalysis.com/api/kyt/#registration-register-a-withdrawal-attempt)), and fetch the screening results (alerts, exposures, addresses detected). Based on the results, and the configuration of this rule, the policy will be triggered.\n\nIt's called \"Pre\"-screening, because the scanned transaction is not on chain yet, it's still a transaction attempt (before the transaction actually make it on chain).\n\n```json\n{\n  \"rule\": {\n    \"kind\": \"ChainalysisTransactionPrescreening\",\n    \"configuration\": {\n      \"alerts\": {\n        \"alertLevel\": \"LOW\",\n        \"categoryIds\": []\n      },\n      \"exposures\": {\n        \"direct\": {\n          \"categoryIds\": []\n        }\n      },\n      \"addresses\": {\n        \"categoryIds\": []\n      },\n      \"fallbackBehaviours\": {\n        \"skipUnscreenableTransaction\": false,\n        \"skipUnsupportedNetwork\": false,\n        \"skipUnsupportedAsset\": false,\n        \"skipChainalysisFailure\": false\n      }\n    }\n  }\n}\n```\n\n**Configuration**\n\n| Property | Type | Description |\n| --- | --- | --- |\n| `alerts`<br><br>`.alertLevel`* | `string` | Minimum alert level above which the rule should trigger, if any [alert is returned in Chainalysis results](https://docs.chainalysis.com/api/kyt/#withdrawal-attempts-get-alerts). Can be `LOW`, `MEDIUM`, `HIGH`, or `SEVERE` |\n| `alerts`<br><br>`.categoryIds`* | list of integers | List of Chainalysis category IDs (see [here](https://docs.chainalysis.com/api/kyt/#categories)). If you leave this list empty, alerts of any category will trigger the rule. Otherwise, if you only want the rule to trigger on specific categories, you can specify some in the list. |\n| `exposures`<br><br>`.direct`<br><br>`.categoryIds`* | list of integers | List of Chainalysis category IDs (see [here](https://docs.chainalysis.com/api/kyt/#categories)). If you leave this list empty, a [direct exposure](https://docs.chainalysis.com/api/kyt/#withdrawal-attempts-get-direct-exposure) of any category detected by chainalysis will trigger the rule. Otherwise, if you only want the rule to trigger on specific categories, you can specify some in the list. |\n| `addresses`<br><br>`.categoryIds`* | list of integers | List of Chainalysis category IDs (see [here](https://docs.chainalysis.com/api/kyt/#categories)). If you leave this list empty, an [address](https://docs.chainalysis.com/api/kyt/#withdrawal-attempts-get-address-identifications) of any category identified by chainalysis will trigger the rule. Otherwise, if you only want the rule to trigger on specific categories, you can specify some in the list. |\n| `fallbackBehaviours`<br><br>`.skipUnscreenableTransaction`* | boolean | Behaviour if the wallet activity is not screenable (eg. if it's a signature request of a hash). If true, a transaction which is \"unscreenable\" will just be skipped, and policy will not trigger |\n| `fallbackBehaviours.skipUnsupportedNetwork`* | boolean | Behaviour if the wallet activity is on a network not supported by chainalysis, or not yet supported in the dfns-chainalysis integration. If true, an unsupported network will just be skipped, and policy will not trigger |\n| `fallbackBehaviours.skipUnsupportedAsset`* | boolean | Behaviour if the wallet activity is with a asset not supported by chainalysis, or not yet supported in the dfns-chainalysis integration. If true, an unsupported asset will just be skipped, and policy will not trigger |\n| `fallbackBehaviours.skipChainalysisFailure`* | boolean | Behaviour if any issue with Chainalysis calls (timeout, results took too long, rate limiting errors, any error). If true, will skip if any error happens |\n\n"
                      title: ChainalysisTransactionPrescreening
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - EllipticTransactionPrescreening
                        configuration:
                          type: object
                          properties:
