                              description: "**Deprecated** — set `userIdTemplate` on the Chainalysis integration setting instead; when set there, the integration-level template takes precedence over this one.\n\nValue sent to Chainalysis as the \"user ID\". Used by Chainalysis for grouping transaction screenings.\n  \nThis template can include variables, included in brackets. The following variables are currently supported:  `{wallet.id}` and `{wallet.externalId}`.\nAs an example, if you set `userIdTemplate: \"dfns:{wallet.id}_{wallet.externalId}\"`, when your wallet receives a transaction that gets screened by a Chainalysis policy, the \"user ID\" sent to Chainalysis will be `dfns:wa-xxx_yyy` (`wa-xxx` being the wallet ID, and `yyy` being the wallet external ID)."
                            fallbackBehaviours:
                              type: object
                              properties:
                                skipUnscreenableTransaction:
