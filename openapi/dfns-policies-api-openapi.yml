                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - ChainalysisQuarantineScreening
                        configuration:
                          type: object
                          properties:
                            alerts:
                              type: object
                              properties:
                                alertLevel:
                                  type: string
                                  enum:
