  /keys/import:
    post:
      operationId: importKey
      summary: Import Key
      tags:
      - Keys
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Dfns secures private keys by generating them as MPC key shares in our decentralized key management network. This happens by default when you create a key or wallet.


        In some circumstances, however, you may need to import an existing private key into Dfns infrastructure, instead of creating a brand new wallet with Dfns and transfer funds to it. As an example, you might want to keep an existing wallet if its address is tied to a smart contract which you don''t want to re-deploy.


        In such a case, Dfns exposes this key import API endpoint, which can be used in conjunction with our import SDK. Note this is intended to be used only to migrate wallets when first onboarding onto the Dfns platform.


        Dfns can not guarantee the security of imported wallets, as we have no way to control who had access to the private key prior to import. For this reason, this feature is restricted to Enterprise customers who have signed a contractual addendum limiting our liability for imported keys. Please contact your sales representative for more information.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Keys:Import`: Always required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  maxLength: 100
                  description: Nickname for the imported key.
                curve:
                  type: string
                  enum:
                  - ed25519
                  - secp256k1
                  - stark
                  description: The elliptic curve of the private key being imported.
                protocol:
                  anyOf:
                  - type: string
                    enum:
                    - CGGMP24
                    - FROST
                    - FROST_BITCOIN
                    - GLOW20_DH
                    - KU23
                  - type: string
                    enum:
                    - CGGMP21
                  description: The MPC protocol the key shares are formatted for.
                minSigners:
                  type: integer
                  exclusiveMinimum: 0
                  description: 'The TSS threshold: the minimum number of key shares required to sign.'
                encryptedKeyShares:
                  type: array
                  items:
                    type: object
                    properties:
                      signerId:
                        type: string
                        minLength: 1
                        description: ID of the signer this key share is for.
                      encryptedKeyShare:
                        type: string
                        minLength: 1
                        description: The key share encrypted to the target signer.
                    required:
                    - signerId
                    - encryptedKeyShare
                  minItems: 1
                  description: One key share per signer, each encrypted to that signer.
                masterKey:
                  type: boolean
                  description: Specify to create an extended master key for HD derivation.
              required:
              - curve
              - protocol
              - minSigners
              - encryptedKeyShares
              additionalProperties: false
            examples:
              Import:
                value:
                  name: my-imported-key
                  curve: secp256k1
                  protocol: CGGMP21
                  minSigners: 2
                  encryptedKeyShares:
                  - signerId: signer-1
                    encryptedKeyShare: <base64-encrypted-share>
                  - signerId: signer-2
                    encryptedKeyShare: <base64-encrypted-share>
                  - signerId: signer-3
                    encryptedKeyShare: <base64-encrypted-share>
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
