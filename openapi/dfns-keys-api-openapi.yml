    WebhookEnvelopeBase:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^whe-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Unique identifier for this webhook event.
          example: whe-544ul-uqgad-jkgltj5p6fvd04cj
        date:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Timestamp when the event occurred.'
          example: 2023-04-14 20:41:28.715000+00:00
        retryOf:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^whe-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: ID of the original event if this is a retry.
          example: whe-544ul-uqgad-jkgltj5p6fvd04cj
        timestampSent:
          type: integer
          description: Unix timestamp when the event was sent
          example: 1719566994
        deliveryAttempt:
          type: integer
          minimum: 1
          description: Delivery attempt number
          example: 1
      required:
      - id
      - date
      - timestampSent
      - deliveryAttempt
    KeyCurve:
      type: string
      enum:
      - ed25519
      - secp256k1
      - stark
      description: The elliptic curve for the key.
    Wallet:
      type: object
      properties:
