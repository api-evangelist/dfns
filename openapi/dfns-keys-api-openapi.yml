openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Keys API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Keys
paths:
  /keys:
    post:
      operationId: createKey
      summary: Create Key
      tags:
      - Keys
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Creates a key for the given scheme and curve. Returns the new key entity.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Keys:Create`: Always required   \n`Keys:Delegate`: Required if `delegateTo` is specified.   \n`Keys:ChildKeys:Create`: Required if `deriveFrom` is specified."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                scheme:
                  $ref: '#/components/schemas/KeyScheme'
                curve:
                  $ref: '#/components/schemas/KeyCurve'
                name:
                  type: string
                  maxLength: 100
                  description: Nickname for the key.
                masterKey:
                  type: boolean
                  description: Whether this key can be used as a master key for HD derivation.
                deriveFrom:
                  type: object
                  properties:
                    keyId:
                      type: string
                      minLength: 1
                      maxLength: 64
                      pattern: ^key-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                      description: The master key to derive from.
                      example: key-01snl-t56gb-j8tsok0vn802p80i
                    path:
                      type: string
                      pattern: ^m(\/(0|[1-9]\d{0,9}))+$
                      description: Use this to specify the derivation path of the signing key. One will be auto generated if left blank.
                  required:
                  - keyId
                  description: Options for hierarchical deterministic key derivation.
                storeId:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^store-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                  description: The key store to save the key to.
                  example: store-425nf-ebf0a-qq22t6qra51tj8j0
                delegateTo:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^us-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                  description: ID of the end user to delegate this key to.
                  example: us-6b58p-r53sr-rlrd3l5cj3uc4ome
                delayDelegation:
                  type: boolean
                  description: Whether to delay delegation until explicitly triggered.
              required:
              - scheme
              - curve
              additionalProperties: false
            examples:
              EdDSA:
                value:
                  scheme: EdDSA
                  curve: ed25519
              Schnorr:
                value:
                  scheme: Schnorr
                  curve: secp256k1
              Stark:
                value:
                  scheme: ECDSA
                  curve: stark
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Key'
    get:
      operationId: listKeys
      summary: List Keys
      tags:
      - Keys
      security:
      - authenticationToken: []
      description: Retrieve all keys registered for your organization.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Keys:Read`: Always required."
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      - schema:
          type: string
          minLength: 1
          description: Filter by owner id or username.
        required: false
        description: Filter by owner id or username.
        name: owner
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Key'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /keys/{keyId}/delegate:
    post:
      operationId: delegateKey
      summary: Delegate Key
      tags:
      - Keys
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Only keys created with "`delayDelegation: true`" can then be delegated to an end-user. It means you need to know ahead of time that you''re creating a wallet meant to be delegated to an end-user later. This is a safety to prevent, for example, a treasury wallet from being unintentionally delegated to an end-user.


        When a key is delegated to an end user, all wallets using this key as the signing key are also automatically delegated to the same end user. Key and wallet ownerships are guaranteed to be always consistent.


        This operation is irreversible. The key ownership will be transferred to the end-user


        In most cases, when you want to implement Wallet Delegation, simply create the wallet by directly delegating it to an end user, in which case it will the non-custodial from the start. There are some rare cases, however, where the key or wallet must be created before the user has accessed to the system. To accommodate this, we''ve added the ability to create a key or wallet in delay delegation mode, and then later delegate it (i.e.: transfer ownership of it) to an end user via this endpoint.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Keys:Delegate`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: 'The key to delegate. Must have been created with `delayDelegation: true`.'
        required: true
        description: 'The key to delegate. Must have been created with `delayDelegation: true`.'
        name: keyId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                delegateTo:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: ^us-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                  description: ID of the end user to transfer ownership of the key to.
                  example: us-6b58p-r53sr-rlrd3l5cj3uc4ome
              required:
              - delegateTo
              additionalProperties: false
            examples:
              Delegate:
                value:
                  delegateTo: us-1a2b3-c4d5e-6f7g8h9i0jklmno
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  keyId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^key-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: The delegated key.
                    example: key-01snl-t56gb-j8tsok0vn802p80i
                  status:
                    type: string
                    enum:
                    - Delegated
                    description: The key status after delegation.
                required:
                - keyId
                - status
  /keys/{keyId}:
    delete:
      operationId: deleteKey
      summary: Delete Key
      tags:
      - Keys
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Deletes the key and all wallets using this key. Once deleted, keys (and wallets) are not usable anymore, and won't count in your overall organisation wallet count.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Keys:Delete`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: The key to delete.
        required: true
        description: The key to delete.
        name: keyId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Key'
                - additionalProperties: false
    get:
      operationId: getKey
      summary: Get Key
      tags:
      - Keys
      security:
      - authenticationToken: []
      description: Retrieves a key information by its ID.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Keys:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: The key to retrieve.
        required: true
        description: The key to retrieve.
        name: keyId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Key'
                - type: object
                  properties:
                    wallets:
                      type: array
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            minLength: 1
                            maxLength: 64
                            pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                            description: The wallet id.
                            example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                          network:
                            type: string
                            description: The network of the wallet.
                            enum:
                            - Algorand
                            - AlgorandTestnet
                            - Aptos
                            - AptosTestnet
                            - ArbitrumOne
                            - ArbitrumSepolia
                            - Arc
                            - ArcTestnet
                            - Areum
                            - AvalancheC
                            - AvalancheCFuji
                            - Base
                            - BaseSepolia
                            - Berachain
                            - BerachainBepolia
                            - Bitcoin
                            - BitcoinSignet
                            - BitcoinTestnet4
                            - BitcoinCash
                            - Bob
                            - BobSepolia
                            - Bsc
                            - BscTestnet
                            - Canton
                            - CantonTestnet
                            - Cardano
                            - CardanoPreprod
                            - Concordium
                            - ConcordiumTestnet
                            - Celo
                            - CeloSepolia
                            - Codex
                            - CodexSepolia
                            - CosmosHub4
                            - CosmosIcsTestnet
                            - Dogecoin
                            - DogecoinTestnet
                            - Ethereum
                            - EthereumClassic
                            - EthereumClassicMordor
                            - EthereumSepolia
                            - EthereumHoodi
                            - FlareC
                            - FlareCCoston2
                            - FlowEvm
                            - FlowEvmTestnet
                            - Hedera
                            - HederaTestnet
                            - Ink
                            - InkSepolia
                            - InternetComputer
                            - Ion
                            - IonTestnet
                            - Iota
                            - IotaTestnet
                            - Kusama
                            - KusamaAssetHub
                            - Litecoin
                            - LitecoinTestnet
                            - Monad
                            - MonadTestnet
                            - Movement
                            - MovementTestnet
                            - Near
                            - NearTestnet
                            - Optimism
                            - OptimismSepolia
                            - Origyn
                            - Plasma
                            - PlasmaTestnet
                            - Plume
                            - PlumeSepolia
                            - Paseo
                            - PaseoAssetHub
                            - Polkadot
                            - PolkadotAssetHub
                            - Polygon
                            - PolygonAmoy
                            - Polymesh
                            - PolymeshTestnet
                            - Rayls
                            - RaylsTestnet
                            - Robinhood
                            - RobinhoodSepolia
                            - SeiAtlantic2
                            - SeiPacific1
                            - Solana
                            - SolanaDevnet
                            - Sonic
                            - SonicTestnet
                            - Starknet
                            - StarknetSepolia
                            - Stellar
                            - StellarTestnet
                            - Sui
                            - SuiTestnet
                            - Tezos
                            - TezosShadownet
                            - Tempo
                            - TempoModerato
                            - Tsc
                            - TscTestnet1
                            - Ton
                            - TonTestnet
                            - Tron
                            - TronNile
                            - Westend
                            - WestendAssetHub
                            - Xdc
                            - XdcApothem
                            - XLayer
                            - XLayerSepolia
                            - XrpLedger
                            - XrpLedgerTestnet
                        required:
                        - id
                        - network
                      description: Wallets associated with this key.
                    store:
                      type: object
                      properties:
                        id:
                          type: string
                          minLength: 1
                          maxLength: 64
                          pattern: ^store-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                          description: The key store id.
                          example: store-425nf-ebf0a-qq22t6qra51tj8j0
                        kind:
                          type: string
                          enum:
                          - Hsm
                          - Mpc
                          - OfflineSigner
                          description: The type of key store.
                        keyId:
                          type: string
                          minLength: 1
                          maxLength: 64
                          pattern: ^key-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                          description: The key id within the store.
                          example: key-01snl-t56gb-j8tsok0vn802p80i
                        derivationPath:
                          type: string
                          description: The HD derivation path if applicable.
                        reconstructionThreshold:
                          type: number
                          description: The minimum number of key shares required to reconstruct this MPC key. Omitted for non-MPC keys.
                      required:
                      - id
                      - kind
                      - keyId
                      description: Key store details.
                  required:
                  - wallets
                  - store
    put:
      operationId: updateKey
      summary: Update Key
      tags:
      - Keys
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Updates the name of an existing key.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Keys:Update`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: The key to update.
        required: true
        description: The key to update.
        name: keyId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type:
                  - string
                  - 'null'
                  maxLength: 100
                  description: New nickname for the key. Pass `null` to clear the existing name.
              required:
              - name
              additionalProperties: false
            examples:
              Rename:
                value:
                  name: my-treasury-key
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Key'
                - additionalProperties: false
  /keys/{keyId}/derive:
    post:
      operationId: deriveKey
      summary: Derive Key
      tags:
      - Keys
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Dfns decentralized key management network supports threshold Diffie-Hellman protocol based on GLOW20 paper. You can use the DH protocol to derive output from a domain separation tag and a seed value. The derivation process is deterministic, i.e. the same Diffie-Hellman key and seed will lead to the same derived output. To ensure reproducibility, we use hash to curve RFC9380 and standard ciphersuite `secp256k1_XMD:SHA-256_SSWU_RO_`.


        The seed doesn’t need to be secret. Without access to the DH key, it is not possible to do the derivation, even if the seed is known. Moreover, if both seed and derived output are known, it’s also not possible to do the derivation for another seed without having access to the DH key.


        This endpoint only supports Diffie-Hellman keys. Regular threshold signature keys, like `ECDSA` or `EdDSA`, will not work. You can create a Diffie-Hellman key with the Create Key endpoint using `scheme=DH` and `curve=secp256k1`.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Keys:Vrf:Derive`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: The Diffie-Hellman key to derive from. Must be a key created with `scheme=DH`.
        required: true
        description: The Diffie-Hellman key to derive from. Must be a key created with `scheme=DH`.
        name: keyId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain:
                  type: string
                  pattern: ^(0x)?([0-9a-fA-F][0-9a-fA-F])*$
                  description: Hex-encoded domain separation tag used as an input to the derivation.
                seed:
                  type: string
                  pattern: ^(0x)?([0-9a-fA-F][0-9a-fA-F])*$
                  description: Hex-encoded seed value to derive from. The seed does not need to be secret.
              required:
              - domain
              - seed
              additionalProperties: false
            examples:
              Derive:
                value:
                  domain: '0x64666e732d646f6d61696e'
                  seed: '0x73656564'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  output:
                    type: string
                    description: Hex-encoded derived output. Deterministic for a given key, domain and seed.
                required:
                - output
  /keys/{keyId}/export:
    post:
      operationId: exportKey
      summary: Export Key
      tags:
      - Keys
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Dfns secures private keys by generating them as MPC key shares in our decentralized key management network. Our goal is to eliminate all single points of failure (SPOFs) associated with blockchain private keys.


        In certain circumstances, however, customers require Dfns to export a private key. In this case, Dfns exposes the following endpoint which can be used in conjunction with our export SDK. Each signer returns its key share encrypted to an encryption key you provide; the full private key is reconstituted client-side and is never assembled on Dfns servers.


        Once a key is exported and reconstituted, it becomes a single point of failure that Dfns can no longer protect: anyone who obtains it controls the wallet and its assets, and Dfns can not guarantee the security of transactions signed with it. You are solely responsible for the exported key''s security — its storage, encryption, access controls, and protection against theft or misuse. Key export is not enabled by default; contact our support team to have it activated for your organization.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Keys:Export`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: The key to export.
        required: true
        description: The key to export.
        name: keyId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                encryptionKey:
                  type: string
                  minLength: 1
                  description: The public encryption key the signers should encrypt their key shares to.
                supportedSchemes:
                  type: array
                  items:
                    type: object
                    properties:
                      protocol:
                        anyOf:
                        - type: string
                          enum:
                          - CGGMP24
                          - FROST
                          - FROST_BITCOIN
                          - GLOW20_DH
                          - KU23
                        - type: string
                          enum:
                          - CGGMP21
                        description: An MPC protocol the client supports.
                      curve:
                        type: string
                        enum:
                        - ed25519
                        - secp256k1
                        - stark
                        description: An elliptic curve the client supports.
                    required:
                    - protocol
                    - curve
                    additionalProperties: false
                  description: The protocol/curve combinations the client is able to reconstruct the key from.
              required:
              - encryptionKey
              - supportedSchemes
              additionalProperties: false
            examples:
              Export:
                value:
                  encryptionKey: <hex-encoded-public-encryption-key>
                  supportedSchemes:
                  - protocol: CGGMP21
                    curve: secp256k1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  publicKey:
                    type: string
                    description: Hex-encoded public key of the exported key.
                  protocol:
                    anyOf:
                    - type: string
                      enum:
                      - CGGMP24
                      - FROST
                      - FROST_BITCOIN
                      - GLOW20_DH
                      - KU23
                    - type: string
                      enum:
                      - CGGMP21
                    description: The MPC protocol the key shares are for.
                  curve:
                    type: string
                    enum:
                    - ed25519
                    - secp256k1
                    - stark
                    description: The elliptic curve of the exported key.
                  minSigners:
                    type: number
                    description: The TSS threshold of the wallet private signing key shares
                  encryptedKeyShares:
                    type: array
                    items:
                      type: object
                      properties:
                        signerId:
                          type: string
                          description: Base64-encoded ID of the signer exported the encrypted keyshare
                        encryptedKeyShare:
                          type: string
                          description: Base64-encoded keyshare
                      required:
                      - signerId
                      - encryptedKeyShare
                    description: Keyshares of the exported wallet. They are encrypted with the provided encryption key. The exported private key is re-constructed from these keyshares.
                required:
                - publicKey
                - protocol
                - curve
                - minSigners
                - encryptedKeyShares
  /keys/{keyId}/signatures:
    post:
      operationId: generateSignature
      summary: Generate Signature
      tags:
      - Keys
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Request to generate a signature with the key. **This process does not broadcast anything on-chain**, this is just an off-chain signature request.


        Dfns is compatible with any blockchain that uses a supported key format. If Dfns doesn''t officially integrate with a blockchain, you can use hash signing to generate the signatures to interact with the chain.


        If you were using the deprecated `POST /wallets/{walletId}/signatures` endpoint, then you should now use this one. See the deprecation notice to get more information about how to change your code. TL,DR: from a wallet you can obtain the key as `wallet.signingKey.id`.'
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n✅ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Keys:Signatures:Create`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: The key to sign with.
        required: true
        description: The key to sign with.
        name: keyId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - Hash
                  hash:
                    type: string
                    pattern: ^(0x)?[0-9a-fA-F]{64}$
                    description: 32-byte hash in hex encoded format.
                  taprootMerkleRoot:
                    type: string
                    pattern: ^(0x)?([0-9A-Fa-f]{64})?$
                    description: Required when signing with a Schnorr key. Specify the merkle root for tweaking the signing key, or the empty string "" to tweak with the default merkle root.
                  network:
                    $ref: '#/components/schemas/Network'
                  blockchainKind:
                    $ref: '#/components/schemas/BlockchainKind'
                  externalId:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: A unique ID from your system. It can be leveraged to be used as an idempotency key (read more [here](https://docs.dfns.co/api-reference/idempotency)).
                required:
                - kind
                - hash
                additionalProperties: false
                description: All cryptographic scheme support hash signing. Different blockchains will apply different hash functions to compute the hash.
                title: Hash
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - Message
                  message:
                    type: string
                    pattern: ^(0x)?([0-9a-fA-F][0-9a-fA-F])*$
                    description: An arbitrary hex encoded message.
                  network:
                    $ref: '#/components/schemas/Network'
                  blockchainKind:
                    $ref: '#/components/schemas/BlockchainKind'
                  externalId:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: A unique ID from your system. It can be leveraged to be used as an idempotency key (read more [here](https://docs.dfns.co/api-reference/idempotency)).
                required:
                - kind
                - message
                additionalProperties: false
                description: Signs an arbitrary hex encoded arbitrary message.
                title: Message
              - type: object
                properties:
                  kind:
                    type: string
                    enum:
                    - Transaction
                  transaction:
                    anyOf:
                    - type: string
                      pattern: ^(0x)?([0-9a-fA-F][0-9a-fA-F])*$
                    - type: object
                      properties: {}
                      description: Network-specific JSON transaction object. The accepted fields depend on the target network. For EVM chains the shape matches the EVM transaction object of [Sign and Broadcast Transaction](https://docs.dfns.co/api-reference/wallets/sign-and-broadcast-transaction) (for example `to`, `value`, `data`, `nonce`, `gasLimit`, `maxFeePerGas`, `maxPriorityFeePerGas`). For other JSON networks (such as Starknet or Concordium), refer to the per-network formats described below.
                      title: JSON transaction object
                    description: The unsigned hex-encoded transaction or JSON object for compatible networks
                  network:
                    $ref: '#/components/schemas/Network'
                  blockchainKind:
                    $ref: '#/components/schemas/BlockchainKind'
                  externalId:
                    type: string
                    minLength: 1
                    maxLength: 50
                    description: A unique ID from your system. It can be leveraged to be used as an idempotency key (read more [here](https://docs.dfns.co/api-reference/idempotency)).
                required:
                - kind
                - transaction
                additionalProperties: false
                description: "Signs an unsigned transaction. The transaction parameter accepts hex-encoded transactions or JSON objects for compatible networks (Concordium, Starknet, Evm).\n\nThe following blockchains only accept JSON transaction objects (not hex strings): Concordium, Starknet.\n\nFor Starknet transactions, you may use invocation request objects (https://github.com/starkware-libs/starknet-specs/blob/v0.8.1/api/starknet_api_openrpc.json#L2621):\n\n| Field                         | Description                                                                                         | Type - Optional                  |\n|-------------------------------|-----------------------------------------------------------------------------------------------------|----------------------------------|\n| type                          | transaction type (always INVOKE              )                                                      | String (required)                |\n| calldata                      | **Array** of encoded function call parameters                                                       | **Array of Strings** (required)  |\n| nonce                         | Transaction nonce in hex format                                                                     | String (required)                |\n| version                       | Transaction version in hex format. Typically \"0x3\" for current transactions                         | String (required)                |\n| resourceBounds                | Gas bounds for L1, L2, and L1 data gas                                                              | Object (required)                |\n| ↳ resourceBounds.l1Gas        | L1 gas configuration with maxAmount and maxPricePerUnit                                             | Object (required)                |\n| ↳ resourceBounds.l2Gas        | L2 gas configuration with maxAmount and maxPricePerUnit                                             | Object (required)                |\n| ↳ resourceBounds.l1DataGas    | L1 data gas configuration with maxAmount and maxPricePerUnit                                        | Object (required)                |\n| tip                           | Transaction tip in hex format. Typically \"0x0\"                                                      | String (required)                |\n| paymasterData                 | Paymaster data array                                                                                | Array of Strings (required)      |\n| accountDeploymentData         | Account deployment data array                                                                       | Array of Strings (required)      |\n| nonceDataAvailabilityMode     | Data availability mode for nonce. Typically \"L1\" for now                                            | String (required)                |\n| feeDataAvailabilityMode       | Data availability mode for fee. Typically \"L1\" for now                                              | String (required)                |\n| chainId                       | The chain identifier in hex format                                                                  | String (required)                |\n| senderAddress                 | The address of the account sending the transaction                                                  | String (required)                |\n\nFor Concordium transactions, use account transaction objects (https://developer.concordium.software/concordium-node-sdk-js/classes/ccd_js_gen.ConcordiumGRPCClient.html):\n\n| Field                          | Description                                                                  | Type - Optional              |\n|--------------------------------|------------------------------------------------------------------------------|------------------------------|\n| header.sender                  | Account address (base58)                                                     | String (required)            |\n| header.nonce                   | Account nonce                                                                | String (required)            |\n| header.expiry                  | Unix epoch seconds expiry                                                    | Number (required)            |\n| header.executionEnergyAmount   | Max NRG for execution                                                        | String (required)            |\n| header.numSignatures           | Number of signatures                                                         | Number (optional)            |\n| payload                        | Transaction payload (type-specific, e.g. Transfer, RegisterData)             | Object (required)            |\n\n```json\n{\n  \"kind\": \"Transaction\",\n  \"blockchainKind\": \"Concordium\",\n  \"transaction\": {\n    \"header\": {\n      \"sender\": \"4FmiTW2L2AccyR36ZBRKNqwQvBJBH8CAXWMLB1dbX5WyZmRo6N\",\n      \"nonce\": \"42\",\n      \"expiry\": 1709510400,\n      \"executionEnergyAmount\": \"501\"\n    },\n    \"payload\": {\n      \"Transfer\": {\n        \"amount\": \"1000000\",\n        \"toAddress\": \"3U4sfVSqGG6XK8g6eho2qRYtnHc4MWJBG1dfxdtPGbfHwFxini\"\n      }\n    }\n  }\n}\n```\n\n```json\n{\n  \"kind\": \"Transaction\",\n  \"transaction\": \"0xe703847735941a82520894f0965f5eb35ace69f01b77031f2cff22daca622887470de4df82000080\"\n}\n```\n\n```json\n{\n  \"kind\": \"Transaction\",\n  \"transaction\": {\n    \"type\": \"INVOKE\",\n    \"calldata\": [\n      \"1\",\n      \"2009894490435840142178314390393166646092438090257831307886760648929397478285\",\n      \"232670485425082704932579856502088130646006032362877466777181098476241604910\",\n      \"3\",\n      \"296727860213112272332383824629975240127004024814636931420022890499591637514\",\n      \"1\",\n      \"0\"\n    ],\n    \"nonce\": \"0x51\",\n    \"version\": \"0x3\",\n    \"resourceBounds\": {\n      \"l1Gas\": { \"maxAmount\": \"0x0\", \"maxPricePerUnit\": \"0x239a01ff6e6c\" },\n      \"l2Gas\": { \"maxAmount\": \"0x1694a0\", \"maxPricePerUnit\": \"0x10c388d00\" },\n      \"l1DataGas\": { \"maxAmount\": \"0x120\", \"maxPricePerUnit\": \"0x98e8\" }\n    },\n    \"tip\": \"0x0\",\n    \"paymasterData\": [],\n    \"accountDeploymentData\": [],\n    \"nonceDataAvailabilityMode\": \"L1\",\n    \"feeDataAvailabilityMode\": \"L1\",\n    \"chainId\": \"0x534e5f5345504f4c4941\",\n    \"senderAddress\": \"0x0535a9762b984c876abe0b164b0ccedb0d23a78978c9fe87e29deae0ea890c72\"\n  }\n}\n```"
                title: Transaction
