        address:
          type: string
          description: Wallet address on its corresponding network.
        signingKey:
          type: object
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^key-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
              description: Key id.
              example: key-01snl-t56gb-j8tsok0vn802p80i
            scheme:
              $ref: '#/components/schemas/KeyScheme'
            curve:
              $ref: '#/components/schemas/KeyCurve'
            publicKey:
              type: string
              description: Hex-encoded value of the public key.
              example: e2375c8c9e87bfcd0be8f29d76c818cabacd51584f72cb2222d49a13b036d84d3d
            delegatedTo:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^us-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
              description: The end user ID the key (and wallet) is delegated to.
              example: us-6b58p-r53sr-rlrd3l5cj3uc4ome
            storeId:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^store-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
              description: ID of the key store the signing key lives in (see [List Key Stores](https://docs.dfns.co/api-reference/key-stores/list-key-stores)). Use it to tell wallets apart by custody setup, for instance to scope a policy to one store with the `keyStoreId` policy filter.
              example: store-425nf-ebf0a-qq22t6qra51tj8j0
          required:
          - id
          - scheme
          - curve
          - publicKey
          description: Details about the key underlying the wallet.
        status:
          type: string
          enum:
          - Active
          - Inactive
          - Archived
          description: Wallet status.
        dateCreated:
          type: string
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date string when wallet was created.'
          example: 2023-04-14 20:41:28.715000+00:00
        dateDeleted:
          type: string
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date string when wallet was deleted.'
          example: 2023-04-14 20:41:28.715000+00:00
        name:
          type: string
          maxLength: 100
          description: Wallet nickname.
        custodial:
          type: boolean
          description: Whether the wallet is owned by an end user (non-custodial), or by your organization (custodial).
        externalId:
          type: string
          maxLength: 100
          description: User-defined value that can be used to correlate the entity with an external system.
        tags:
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9_.:/+-]{1,100}$
            description: Wallet Tag.
          maxItems: 10
          description: List of tags.
        validatorId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^cv-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: '@deprecated use `networkInfo.validatorId` instead.'
          deprecated: true
        networkInfo:
          type: object
          properties:
            nonceAccounts:
              type: array
              items:
                type: string
              description: Confirmed Solana durable-nonce accounts owned by this wallet.
            validatorId:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^cv-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
              description: Id of the validator on which the wallet is created for Canton networks.
              example: cv-7jeof-m584r-p35ucm37ko3cqgts
          description: Additional chain-dependent information about the wallet. Only returned by Get Wallet.
        vaultId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^vlt-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: The vault controlling this wallet, absent for ordinary wallets. A vault wallet is read-only, its funds move through the vault endpoints, and it carries its vault name and tags as its own.
          example: vlt-5vbsp-u62g1-ostmunqgds5o9tc2
      required:
      - id
      - network
      - signingKey
      - status
      - dateCreated
      - custodial
      - tags
      example:
        id: wa-1f04s-lqc9q-xxxxxxxxxxxxxxxx
        network: Ethereum
        address: '0x00e3495cf6af59008f22ffaf32d4c92ac33dac47'
        name: trading hot wallet
        signingKey:
          id: key-6ece3-9l565-xxxxxxxxxxxxxxxx
          scheme: ECDSA
          curve: secp256k1
          publicKey: e2375c8c9e87bfcd0be8f29d76c818cabacd51584f72cb2222d49a13b036d84d3d
          storeId: store-2ab1c-4d5e6-xxxxxxxxxxxxxxxx
        status: Active
        dateCreated: 2023-04-14 20:41:28.715000+00:00
        custodial: true
        tags: []
    KeyScheme:
      type: string
      description: The cryptographic scheme for the key.
      enum:
      - ECDSA
      - EdDSA
      - Schnorr
  securitySchemes:
    authenticationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '**Bearer Token:** Used to authenticate API requests.

        More details how to generate the token: [Authentication flows](https://docs.dfns.co/api-reference/auth/login-flows)'
    userActionSignature:
      type: apiKey
      in: header
      name: X-DFNS-USERACTION
      description: '**User Action Signature:** Used to sign the change-inducing API requests.

        More details how to generate the token: [User Action Signing flows](https://docs.dfns.co/api-reference/auth/signing-flows)'
