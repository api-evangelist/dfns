openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Tenant API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Tenant
paths:
  /tenant/permissions/{permissionId}/assign:
    post:
      operationId: assignTenantPermission
      summary: Assign Tenant Permission
      tags:
      - Tenant
      security:
      - authenticationToken: []
        userActionSignature: []
      description: 'Creates a permission that allows certain specified operations to be executed.


        Response is either the permission object itself (success) or a reason why it was not possible to create the permission (failure).'
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:Permissions:Assign`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: ID of the permission (also referred to as "role" in the dashboard).
        required: true
        description: ID of the permission (also referred to as "role" in the dashboard).
        name: permissionId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identityId:
                  type: string
                  minLength: 1
                  description: ID of the identity to assign the permission to. Can be a user ID, a service account ID, or a personal access token (PAT) ID.
              required:
              - identityId
              additionalProperties: false
      responses:
        '200':
          description: Success
  /tenant/permissions/{permissionId}/revoke:
    post:
      operationId: revokeTenantPermission
      summary: Revoke Tenant Permission
      tags:
      - Tenant
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Revokes a permission assignment (success) or gives reason why it's not possible (failure).
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:Permissions:Revoke`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: ID of the permission (also referred to as "role" in the dashboard).
        required: true
        description: ID of the permission (also referred to as "role" in the dashboard).
        name: permissionId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                identityId:
                  type: string
                  minLength: 1
                  description: ID of the identity to revoke the permission from. Can be a user ID, a service account ID, or a personal access token (PAT) ID.
              required:
              - identityId
              additionalProperties: false
      responses:
        '200':
          description: Success
  /tenant/permissions/{permissionId}:
    get:
      operationId: getTenantPermission
      summary: Get Tenant Permission
      tags:
      - Tenant
      security:
      - authenticationToken: []
      description: Retrieves a specific permission (success) or gives a reason why it's not possible (failure).
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:Permissions:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: ID of the permission (also referred to as "role" in the dashboard).
        required: true
        description: ID of the permission (also referred to as "role" in the dashboard).
        name: permissionId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
  /tenant/permissions:
    get:
      operationId: listTenantPermissions
      summary: List Tenant Permissions
      tags:
      - Tenant
      security:
      - authenticationToken: []
      description: Retrieves a list of permissions (success) or gives a reason why it's not possible (failure).
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:Permissions:Read`: Always required."
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /tenant/users:
    post:
      operationId: createTenantUser
      summary: Create Tenant User
      tags:
      - Tenant
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Creates a new Tenant User. This creates the user and sends him an email with a registration code. The user is created without any permissions.
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:Users:Create`: Always required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  description: The email address of the new user.
                externalId:
                  type: string
                  description: Value that can be used to correlate the entity with an external system.
                isSSORequired:
                  type: boolean
                  default: false
                  description: If set to true, the user will have to authenticate via SSO
              required:
              - email
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUser'
    get:
      operationId: listTenantUsers
      summary: List Tenant Users
      tags:
      - Tenant
      security:
      - authenticationToken: []
      description: List all Users in your Tenant.
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:Users:Read`: Always required."
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TenantUser'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /tenant/users/{userId}:
    put:
      operationId: updateTenantUser
      summary: Update Tenant User
      tags:
      - Tenant
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Updates a new Tenant User details.
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:Users:Update`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: User id.
        required: true
        description: User id.
        name: userId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isSSORequired:
                  type: boolean
              required:
              - isSSORequired
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: {}
    delete:
      operationId: deleteTenantUser
      summary: Delete Tenant User
      tags:
      - Tenant
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Delete a specific Tenant User.
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:Users:Delete`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: User id.
        required: true
        description: User id.
        name: userId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: {}
    get:
      operationId: getTenantUser
      summary: Get Tenant User
      tags:
      - Tenant
      security:
      - authenticationToken: []
      description: Get a Tenant User.
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:Users:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          description: User id.
        required: true
        description: User id.
        name: userId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantUser'
  /tenant/orgs:
    get:
      operationId: listOrgs
      summary: List Orgs
      tags:
      - Tenant
      security:
      - authenticationToken: []
      description: 'List all Orgs in your Tenant.

        By default, returns non-archived Orgs, unless specific status are passed'
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:Orgs:Read`: Always required."
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      - schema:
          anyOf:
          - type: string
            enum:
            - Active
            - Suspended
            - Archived
          - type: array
            items:
              type: string
              enum:
              - Active
              - Suspended
              - Archived
        required: false
        name: status
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        name:
                          type: string
                        status:
                          type: string
                          enum:
                          - Active
                          - Suspended
                          - Archived
                        dateCreated:
                          type: string
                      required:
                      - id
                      - name
                      - status
                      - dateCreated
                      additionalProperties: false
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
    post:
      operationId: createOrg
      summary: Create Org
      tags:
      - Tenant
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Create a new Org in your Tenant. The creator of the org will be granted access to the Org as the first Org Admin.
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:Orgs:Create`: Always required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 50
                keyStores:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                        minLength: 1
                      primary:
                        type: boolean
                    required:
                    - id
              required:
              - name
              - keyStores
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  org:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                    required:
                    - id
                    - name
                required:
                - org
  /tenant/user-groups:
    post:
      operationId: createTenantUserGroup
      summary: Create Tenant User Group
      tags:
      - Tenant
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Create a user group in the caller's tenant. A group holds tenant permissions through the tenant permission assignment endpoint, and its members hold those permissions in addition to their own.
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:UserGroups:Create`: Always required."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_+.-]+$
                  description: Name of the group. Unique within the org or tenant, ignoring case. A deleted group frees its name for reuse.
                description:
                  type: string
                  minLength: 1
                  maxLength: 1024
                  description: Description of the group.
              required:
              - name
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroup'
    get:
      operationId: listTenantUserGroups
      summary: List Tenant User Groups
      tags:
      - Tenant
      security:
      - authenticationToken: []
      description: List the user groups in the caller's tenant.
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:UserGroups:Read`: Always required."
      parameters:
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserGroup'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
  /tenant/user-groups/{userGroupId}:
    get:
      operationId: getTenantUserGroup
      summary: Get Tenant User Group
      tags:
      - Tenant
      security:
      - authenticationToken: []
      description: Get a specific user group of the caller's tenant.
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:UserGroups:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^ug-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User group id.
        required: true
        description: User group id.
        name: userGroupId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroup'
    put:
      operationId: updateTenantUserGroup
      summary: Update Tenant User Group
      tags:
      - Tenant
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Rename a user group of the caller's tenant or change its description. Fields left out keep their value. Its permissions and members are unaffected.
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:UserGroups:Update`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^ug-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User group id.
        required: true
        description: User group id.
        name: userGroupId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                  pattern: ^[A-Za-z0-9_+.-]+$
                  description: Name of the group. Unique within the org or tenant, ignoring case. A deleted group frees its name for reuse.
                description:
                  type:
                  - string
                  - 'null'
                  minLength: 1
                  maxLength: 1024
                  description: Description of the group. Null removes it.
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserGroup'
    delete:
      operationId: deleteTenantUserGroup
      summary: Delete Tenant User Group
      tags:
      - Tenant
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Delete a user group of the caller's tenant. Its tenant permission assignments are revoked and its members are removed. The name can be reused.
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:UserGroups:Delete`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^ug-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User group id.
        required: true
        description: User group id.
        name: userGroupId
        in: path
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: {}
  /tenant/user-groups/{userGroupId}/members:
    get:
      operationId: listTenantUserGroupMembers
      summary: List Tenant User Group Members
      tags:
      - Tenant
      security:
      - authenticationToken: []
      description: List the members of a user group of the caller's tenant.
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:UserGroups:Members:Read`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^ug-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User group id.
        required: true
        description: User group id.
        name: userGroupId
        in: path
      - schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
          description: Maximum number of items to return.
        required: false
        description: Maximum number of items to return.
        name: limit
        in: query
      - schema:
          type: string
          minLength: 1
          description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        required: false
        description: Opaque token used to retrieve the next page. Returned as `nextPageToken` from the previous request.
        name: paginationToken
        in: query
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/UserGroupMember'
                    description: Current page items.
                  nextPageToken:
                    type: string
                    description: token to use as `paginationToken` to request the next page.
                required:
                - items
    post:
      operationId: addTenantUserGroupMembers
      summary: Add Tenant User Group Members
      tags:
      - Tenant
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Add tenant users to a user group. Each member gains every tenant permission assigned to the group, in addition to their own.
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:UserGroups:Members:Add`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^ug-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User group id.
        required: true
        description: User group id.
        name: userGroupId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^us-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: User id.
                    example: us-6b58p-r53sr-rlrd3l5cj3uc4ome
                  minItems: 1
                  maxItems: 100
                  description: Tenant users to add. Users already in the group are left unchanged.
              required:
              - userIds
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: {}
    delete:
      operationId: removeTenantUserGroupMembers
      summary: Remove Tenant User Group Members
      tags:
      - Tenant
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Remove tenant users from a user group. Each removed user immediately loses every tenant permission they held only through this group.
      x-mint:
        content: "#### Authentication\n\n❌ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n❌ Service Account\n\n#### Required Permissions\n\n`Tenant:UserGroups:Members:Remove`: Always required."
      parameters:
      - schema:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^ug-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User group id.
        required: true
        description: User group id.
        name: userGroupId
        in: path
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userIds:
                  type: array
                  items:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^us-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: User id.
                    example: us-6b58p-r53sr-rlrd3l5cj3uc4ome
                  minItems: 1
                  maxItems: 100
                  description: Tenant users to remove. Users not in the group are left unchanged.
              required:
              - userIds
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties: {}
  /tenant/orgs/{orgId}:
    get:
      operationId: getOrg
      summary: Get Org
      tags:
      - Tenant
      security:
      - authenticationToken: []
      description: Get details on a single Org within your Tenant.
      x-mint:
