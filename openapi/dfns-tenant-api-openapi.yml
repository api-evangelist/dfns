components:
  schemas:
    UserGroup:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^ug-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User group id.
          example: ug-139tf-f58l8-lsbt6dp47lfsdvgh
        orgId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^or-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Organization id.
          example: or-30tnh-itmjs-s235s5ontr3r23h2
        tenantId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^acct-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Tenant id.
          example: acct-24hka-dhili-9hgvdlvr1ohpibp4
        name:
          type: string
          description: Name of the group.
        description:
          type: string
          description: Description of the group.
        memberCount:
          type: integer
          minimum: 0
          description: Number of members.
        dateCreated:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the group was created.'
          example: 2023-04-14 20:41:28.715000+00:00
        dateUpdated:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the group was last updated.'
          example: 2023-04-14 20:41:28.715000+00:00
      required:
      - id
      - name
      - memberCount
      - dateCreated
      - dateUpdated
    UserGroupMember:
      type: object
      properties:
        userId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^us-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User id.
          example: us-6b58p-r53sr-rlrd3l5cj3uc4ome
        username:
          type: string
          description: Username/identifier of the member.
        kind:
          type: string
          enum:
          - TenantUser
          - CustomerEmployee
          - EndUser
          description: User kind.
        isActive:
          type: boolean
          description: Whether the member is an active user.
        isArchived:
          type: boolean
          description: Whether the member has been archived. Archived members hold no permissions.
        isServiceAccount:
          type: boolean
          description: Whether the member is a service account.
        dateAdded:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the user was added to the group.'
          example: 2023-04-14 20:41:28.715000+00:00
      required:
      - userId
      - username
      - kind
      - isActive
      - isArchived
      - isServiceAccount
      - dateAdded
    TenantUser:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^us-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: User id.
          example: us-6b58p-r53sr-rlrd3l5cj3uc4ome
        kind:
          type: string
          enum:
          - TenantUser
        username:
          type: string
        isRegistered:
          type: boolean
        isActive:
          type: boolean
        isSSORequired:
          type: boolean
        externalId:
          type: string
        permissions:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              operations:
                type: array
                items:
                  type: string
            required:
            - id
            - name
            - operations
        orgs:
          type: array
          items:
            type: object
            properties:
              orgId:
                type: string
              name:
                type: string
            required:
            - orgId
            - name
          description: orgs this user has access to
      required:
      - id
      - kind
      - username
      - isRegistered
      - isActive
      - isSSORequired
      - permissions
      - orgs
    Permission:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^pm-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: ID of the permission (also referred to as "role" in the dashboard).
          example: pm-37vj4-jkr4l-lc9945spfftkne57
        name:
          type: string
          description: Human-readable name of the permission (role).
        operations:
          type: array
          items:
            type: string
          description: List of API operations this permission grants access to. See [Permissions List](https://docs.dfns.co/core-concepts/roles-and-permissions#list-of-permissions) for available operations.
        status:
          type: string
          enum:
          - Active
          description: Current status of the permission.
        isImmutable:
          type: boolean
          description: Whether this permission is system-managed and cannot be modified.
        isArchived:
          type: boolean
          description: Whether this permission has been archived (soft-deleted).
        dateCreated:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the permission was created.'
          example: 2023-04-14 20:41:28.715000+00:00
        dateUpdated:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). Date the permission was last updated.'
          example: 2023-04-14 20:41:28.715000+00:00
      required:
      - id
      - name
      - operations
      - status
      - isImmutable
      - isArchived
      - dateCreated
      - dateUpdated
      additionalProperties: false
  securitySchemes:
    authenticationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '**Bearer Token:** Used to authenticate API requests.

        More details how to generate the token: [Authentication flows](https://docs.dfns.co/api-reference/auth/login-flows)'
    userActionSignature:
      type: apiKey
      in: header
      name: X-DFNS-USERACTION
      description: '**User Action Signature:** Used to sign the change-inducing API requests.

        More details how to generate the token: [User Action Signing flows](https://docs.dfns.co/api-reference/auth/signing-flows)'
