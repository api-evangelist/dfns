openapi: 3.2.0
info:
  version: 2.0.249
  title: Dfns Swaps API
servers:
- url: https://api.dfns.io
  description: Default - Europe
- url: https://api.uae.dfns.io
  description: UAE
- url: https://api.dfns.ninja
  description: <Deprecated> Staging
tags:
- name: Swaps
paths:
  /swaps:
    post:
      operationId: createSwap
      summary: Create Swap
      tags:
      - Swaps
      security:
      - authenticationToken: []
        userActionSignature: []
      description: Create a new swap based on an existing quote. This is the second step of the Swap flow.
      x-mint:
        content: "#### Authentication\n\n✅ Organization User (`CustomerEmployee`)    \n❌ Delegated User (`EndUser`)    \n✅ Service Account\n\n#### Required Permissions\n\n`Swaps:Create`: Always required   \n`Wallets:Transactions:Create`: Always required. Swap transactions are broadcast from your wallet.   \n`FeeSponsors:Use`: Required if `feeSponsorId` is specified and the sponsoree wallet belongs to an `EndUser` user kind."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                properties:
                  provider:
                    type: string
                    enum:
                    - UniswapClassic
                  quoteId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^swapQuote-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Quote to use for this swap.
                    example: swapQuote-7n9p0-cth75-6l74n2sj7u73ooeq
                  reference:
                    type: string
                    description: An optional reference for this Swap.
                  walletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the Dfns wallet spending the sourceAsset. Used for attesting that the swap is being created with the same parameters as the quote.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  targetWalletId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the Dfns wallet receiving the target asset. Currently this value must be the same as the `walletId`. Used for attesting that the swap is being created with the same parameters as the quote.
                    example: wa-5pfuu-9euek-h0odgb6snva8ph3k
                  sourceAsset:
                    oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Native
                        amount:
                          type: string
                          pattern: ^\d+$
                      required:
                      - kind
                      - amount
                      title: Native Asset
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Erc20
                        contract:
                          type: string
                          pattern: ^0x[0-9a-fA-F]{40}$
                        amount:
                          type: string
                          pattern: ^\d+$
                      required:
                      - kind
                      - contract
                      - amount
                      title: EVM Fungible Token (ERC-20)
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Spl
                        mint:
                          type: string
                          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
                        amount:
                          type: string
                          pattern: ^\d+$
                      required:
                      - kind
                      - mint
                      - amount
                      title: Solana Fungible Token (SPL)
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Sep41
                        issuer:
                          type: string
                          pattern: ^(G[A-Z0-9]{55}|M[A-Z0-9]{68})$
                        assetCode:
                          type: string
                        amount:
                          type: string
                          pattern: ^\d+$
                      required:
                      - kind
                      - issuer
                      - assetCode
                      - amount
                      title: Stellar Fungible Token (SEP-41)
                    description: The source asset that will be spent on the Swap transaction. Used for attesting that the swap is being created with the same parameters as the quote.
                  targetAsset:
                    oneOf:
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Native
                        amount:
                          type: string
                          pattern: ^\d+$
                      required:
                      - kind
                      - amount
                      title: Native Asset
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Erc20
                        contract:
                          type: string
                          pattern: ^0x[0-9a-fA-F]{40}$
                        amount:
                          type: string
                          pattern: ^\d+$
                      required:
                      - kind
                      - contract
                      - amount
                      title: EVM Fungible Token (ERC-20)
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Spl
                        mint:
                          type: string
                          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
                        amount:
                          type: string
                          pattern: ^\d+$
                      required:
                      - kind
                      - mint
                      - amount
                      title: Solana Fungible Token (SPL)
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Sep41
                        issuer:
                          type: string
                          pattern: ^(G[A-Z0-9]{55}|M[A-Z0-9]{68})$
                        assetCode:
                          type: string
                        amount:
                          type: string
                          pattern: ^\d+$
                      required:
                      - kind
                      - issuer
                      - assetCode
                      - amount
                      title: Stellar Fungible Token (SEP-41)
                    description: The target asset that will be received with the Swap transaction. Used for attesting that the swap is being created with the same parameters as the quote.
                  feeSponsorId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^fs-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the fee sponsor that will pay the network fees for this swap. When set, the swap transactions are broadcast as sponsored user operations.
                    example: fs-5vqdl-gliqk-b4rfukqauov1sp7j
                  slippageBps:
                    type: integer
                    minimum: 0
                    maximum: 10000
                    description: The slippage tolerance for this trade in [basis point](https://en.wikipedia.org/wiki/Basis_point) (BPS). Slippage tolerance defines the maximum price difference you're willing to accept during a trade from the estimated quote, ensuring you still receive at least a minimum number of tokens if the price shifts. One basis point equals one-hundredth of a percentage point, or 0.01%.
                required:
                - provider
                - quoteId
                - walletId
                - sourceAsset
                - targetAsset
                - slippageBps
                title: UniswapClassic Swap Request
              - type: object
                properties:
                  provider:
                    type: string
                    enum:
                    - UniswapX
                  quoteId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^swapQuote-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Quote to use for this swap.
