                        mint:
                          type: string
                          pattern: ^[1-9A-HJ-NP-Za-km-z]{32,44}$
                        amount:
                          type: string
                          pattern: ^\d+$
                      required:
                      - kind
                      - mint
                      - amount
                      title: Solana Fungible Token (SPL)
                    - type: object
                      properties:
