                          type: string
                          pattern: ^\d+$
                      required:
                      - kind
                      - issuer
                      - assetCode
                      - amount
                      title: Stellar Fungible Token (SEP-41)
                    description: The target asset that will be received with the Swap transaction. Used for attesting that the swap is being created with the same parameters as the quote.
                  feeSponsorId:
                    type: string
                    minLength: 1
                    maxLength: 64
                    pattern: ^fs-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
                    description: Id of the fee sponsor that will pay the network fees for this swap. When set, the swap transactions are broadcast as sponsored user operations.
                    example: fs-5vqdl-gliqk-b4rfukqauov1sp7j
                  slippageBps:
                    type: integer
                    minimum: 0
