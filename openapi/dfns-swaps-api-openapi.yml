                      title: Native Asset
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
                          - Erc20
                        contract:
                          type: string
                          pattern: ^0x[0-9a-fA-F]{40}$
                        amount:
                          type: string
                          pattern: ^\d+$
                      required:
                      - kind
