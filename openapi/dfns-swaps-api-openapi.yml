                  walletId: wa-123456-12345678
                  targetWalletId: wa-123456-87654321
                  slippageBps: 50
                  sourceAsset:
                    kind: Native
                    amount: '1000000000000000000'
                  targetAsset:
                    kind: Erc20
                    contract: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
                    amount: '5600000'
