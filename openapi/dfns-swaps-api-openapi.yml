                        amount:
                          type: string
                          pattern: ^\d+$
                      required:
                      - kind
                      - contract
                      - amount
                      title: EVM Fungible Token (ERC-20)
                    - type: object
                      properties:
                        kind:
                          type: string
                          enum:
