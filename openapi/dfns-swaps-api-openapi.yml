                          type: string
                          enum:
                          - Sep41
                        issuer:
                          type: string
                          pattern: ^(G[A-Z0-9]{55}|M[A-Z0-9]{68})$
                        assetCode:
                          type: string
                        amount:
                          type: string
                          pattern: ^\d+$
                      required:
