      - XLayerSepolia
      - XrpLedger
      - XrpLedgerTestnet
    FeeSponsor:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^fs-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Fee Sponsor id.
          example: fs-5vqdl-gliqk-b4rfukqauov1sp7j
        name:
          type: string
          description: Nickname for the Fee Sponsor. This is displayed on the transfer modal in the dashboard.
        walletId:
          type: string
          minLength: 1
          maxLength: 64
          pattern: ^wa-[a-z0-9]{5}-[a-z0-9]{5}-[a-z0-9]{14,16}$
          description: Id of the wallet that is used to sponsor the fee for other wallets
          example: wa-5pfuu-9euek-h0odgb6snva8ph3k
        network:
          allOf:
          - $ref: '#/components/schemas/Network'
          - description: Network used for the wallet.
        status:
          type: string
          enum:
          - Active
          - Deactivated
          - Archived
          description: Fee sponsor status.
        dateCreated:
          type: string
          format: date-time
          description: '[ISO 8601](https://en.wikipedia.org/wiki/ISO_8601) date (must be UTC). When the Fee Sponsor was created.'
          example: 2023-04-14 20:41:28.715000+00:00
        allowEndUser:
          type: boolean
          description: Defines whether EndUsers and their delegated wallets can use this Fee Sponsor.
      required:
      - id
      - walletId
      - network
      - status
      - dateCreated
      additionalProperties: false
      example:
        id: fs-1f04s-lqc9q-xxxxxxxxxxxxxxxx
        walletId: wa-1f04s-lqc9q-xxxxxxxxxxxxxxxx
        network: Solana
        status: Active
        dateCreated: 2023-04-14 20:41:28.715000+00:00
  securitySchemes:
    authenticationToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: '**Bearer Token:** Used to authenticate API requests.

        More details how to generate the token: [Authentication flows](https://docs.dfns.co/api-reference/auth/login-flows)'
    userActionSignature:
      type: apiKey
      in: header
      name: X-DFNS-USERACTION
      description: '**User Action Signature:** Used to sign the change-inducing API requests.

        More details how to generate the token: [User Action Signing flows](https://docs.dfns.co/api-reference/auth/signing-flows)'
